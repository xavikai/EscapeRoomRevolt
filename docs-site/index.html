<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia interactiva · Escape Room Revolt</title>
  <meta name="description" content="Guia interactiva d’Escape Room Revolt amb cerca, receptes de puzles i passos per a Unity.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #efe8d6;
      --panel: #faf5e8;
      --ink: #27251c;
      --muted: #5f5746;
      --line: #b5a783;
      --link: #554421;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171611;
        --panel: #201f19;
        --ink: #e6e1cd;
        --muted: #bbb198;
        --line: #61583e;
        --link: #dfcf9e;
      }
    }
    * { box-sizing: border-box }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 1rem/1.55 system-ui, sans-serif }
    main { width: min(100% - 2.5rem, 62rem); margin: auto; padding-block: clamp(2.5rem, 8vw, 6rem) }
    h1, h2, p { margin: 0 }
    h1 { font-size: clamp(2.25rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: -.045em }
    header p { max-width: 52ch; margin-top: 1rem; color: var(--muted); font-size: 1.125rem }
    a { color: var(--link); text-underline-offset: .18em }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px }
    .guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr)); gap: 1rem; margin-block: 2rem }
    article { display: grid; grid-template-rows: auto 1fr auto auto; gap: .8rem; padding: clamp(1rem, 4vw, 1.75rem); border: 1px solid var(--line); border-radius: .55rem; background: var(--panel) }
    h2 { line-height: 1.2 }
    .languages { color: var(--muted); font-size: .9rem }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Guia d’Escape Room Revolt</h1>
      <p>Crea la teva primera sala amb Unity. Consulta les receptes de puzles, les pistes, els menús i el laboratori 3D.</p>
    </header>
    <div class="guides">
      <article>
        <h2><a href="escape-room/">Obre la guia interactiva</a></h2>
        <p class="languages">Català, castellà, anglès, francès i rus</p>
        <p><a href="https://github.com/xavikai/EscapeRoomRevolt/releases/download/escaperoom-v0.2.2/guia-escape-room-0.2.2.html">Descarrega la guia HTML</a></p>
      </article>
    </div>
  </main>
</body>
</html>
