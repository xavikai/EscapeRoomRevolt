    s.occupant = p.id; p.socket = s.id; p.mesh.position.set(s.x, 0.37, s.z);
    pz.progress(); logLine(`PieceSocketReceiver → Connect("${p.id}", "${s.id}") · OnPieceSeated`); tone(250, 0.1);
    if (pieces.every(x => x.socket)) { if (pieces.every(x => rules[x.id] === x.socket)) { pz.solve(); logLine("OnPieceLocked: les peces queden fixades", "i"); } else pz.fail("Wrong placement"); }
  };
  paintRings();
  const reset = () => { pz.reset(); pieces.forEach(p => { p.socket = null; p.mesh.position.copy(p.home); }); sockets.forEach(s => s.occupant = null); };
  onReset(reset);
  buildFields([
    { id: "r1", label: "Rule · pieceA →", type: "text", value: rules.pieceA, onChange: () => { } },
    { id: "r2", label: "Rule · pieceB →", type: "text", value: rules.pieceB, onChange: () => { } },
    { id: "rand", label: "Randomize Mapping", type: "bool", value: cfg.random, onChange: v => {
      cfg.random = v; const pool = ["socketA", "socketB", "socketDecoy"]; if (v) { pool.sort(() => Math.random() - 0.5); rules = { pieceA: pool[0], pieceB: pool[1] }; } else rules = { pieceA: "socketA", pieceB: "socketB" };
      document.getElementById("f_r1").value = rules.pieceA; document.getElementById("f_r2").value = rules.pieceB; paintRings(); reset(); logLine(`Mapping → ${JSON.stringify(rules)} (es guarda com chosenMapping)`, "w");
    } },
  ]);
  return () => w.dispose();
};

/* ── Multi-stage ─────────────────────────────────────────────────────────── */
Stages.mech.multi = (el) => {
  const w = createWorld(el, { orbit: { r: 5.2, theta: 0, phi: 1.15, target: new THREE.Vector3(-0.2, 1, -0.4), minPhi: 0.5, maxPhi: 1.5 } });
  floorRoom(w, 12);
  const wall = box(9, 3.2, 0.2, 0x3b372b); wall.position.set(0, 1.6, -1.5); w.scene.add(wall);
  const door = makeDoor(w, -0.6, -1.38);
  const cfg = { order: true, lock: true };
  const group = puzzleCtl("MultiStage", door);
  const child = { seq: { solved: false, cur: [] }, lev: { solved: false, state: [0, 0] } };
  const seqIds = ["red", "blue"], seqCols = { red: 0xb23b2b, blue: 0x3b6ab8 };
  const seqBtns = seqIds.map((id, i) => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.1, 24), mat(seqCols[id])); b.position.set(-2.6 + i * 0.7, 0.95, 0); w.scene.add(b);
    const ped = box(0.45, 0.9, 0.45, 0x3d3a2d); ped.position.set(-2.6 + i * 0.7, 0.45, 0); w.scene.add(ped);
    w.clickable(b, () => {
      if (child.seq.solved || group.state === "Solved") return;
      child.seq.cur.push(id); logLine(`[Seq child] InputStep("${id}")`);
      if (child.seq.cur.some((s, k) => s !== seqIds[k])) { child.seq.cur = []; logLine("[Seq child] Failed — Wrong sequence step", "w"); return; }
      if (child.seq.cur.length === 2) { child.seq.solved = true; logLine("[Seq child] SOLVED → MultiStage.HandleChildSolved(0)", "s"); b.parent && paintLocks(); evalGroup(); }
    });
    return b;
  });
  const levers = [0, 1].map(i => {
    const base = box(0.4, 0.3, 0.3, 0x3d3a2d); base.position.set(1.8 + i * 0.8, 0.9, -1.3); w.scene.add(base);
    const arm = new THREE.Group(); arm.position.set(1.8 + i * 0.8, 1.0, -1.2); const stick = box(0.08, 0.6, 0.08, 0x9a7d3f); stick.position.y = 0.3; arm.add(stick); arm.rotation.x = 0.6; w.scene.add(arm);
    w.clickable(arm, () => {
      if (group.state === "Solved" || child.lev.solved) return;
      if (cfg.order && cfg.lock && !child.seq.solved) { logLine("[Levers child] Bloquejat: Lock Future Puzzles (visible però no respon)", "w"); return; }
      child.lev.state[i] ^= 1; arm.rotation.x = child.lev.state[i] ? -0.6 : 0.6; logLine(`[Levers child] Toggle ${i} → ${child.lev.state[i]}`);
      if (child.lev.state.every(Boolean)) {
        if (cfg.order && !child.seq.solved) { logLine("Resolt fora d'ordre → ResetPuzzle() del fill", "w"); child.lev.state = [0, 0]; levers.forEach(l => l.rotation.x = 0.6); return; }
        child.lev.solved = true; logLine("[Levers child] SOLVED → MultiStage.HandleChildSolved(1)", "s"); evalGroup();
      }
    });
    return arm;
  });
  const lockMarks = [];
  function paintLocks() {
    const locked = cfg.order && cfg.lock && !child.seq.solved;
    levers.forEach(l => l.children[0].material.color.setHex(locked ? 0x4a463a : 0x9a7d3f));
    seqBtns.forEach((b, i) => b.material.color.setHex(child.seq.solved ? 0x2f5a3a : seqCols[seqIds[i]]));
  }
  function evalGroup() { paintLocks(); group.progress(); if (child.seq.solved && child.lev.solved) group.solve(); }
  paintLocks();
  const reset = () => { group.reset(); child.seq = { solved: false, cur: [] }; child.lev = { solved: false, state: [0, 0] }; levers.forEach(l => l.rotation.x = 0.6); paintLocks(); };
  onReset(reset);
  buildFields([
    { id: "ord", label: "Require Order", type: "bool", value: cfg.order, onChange: v => { cfg.order = v; reset(); } },
    { id: "lock", label: "Lock Future Puzzles", type: "bool", value: cfg.lock, onChange: v => { cfg.lock = v; reset(); } },
    { id: "list", label: "Puzzles", type: "text", value: "0: sequence · 1: levers", onChange: () => { } },
  ]);
  return () => w.dispose();
};

/* ── PC player demo ──────────────────────────────────────────────────────── */
Stages.pc = (el) => {
  const w = createWorld(el, { fov: 70, bg: 0x14130f });
  floorRoom(w, 10, 0x2b2922);
  const walls = [[0, 1.5, -5, 10, 3, 0.2], [0, 1.5, 5, 10, 3, 0.2], [-5, 1.5, 0, 0.2, 3, 10], [5, 1.5, 0, 0.2, 3, 10]];
  const colliders = [];
  walls.forEach(([x, y, z, a, b, c]) => { const m = box(a, b, c, 0x3b372b); m.position.set(x, y, z); w.scene.add(m); colliders.push(m); });
  const lamp = new THREE.PointLight(0xffd79a, 0.8, 12); lamp.position.set(0, 2.6, 0); w.scene.add(lamp);
  const door = makeDoor(w, -0.6, -4.88);
  let hasKey = false, doorOpen = false;
  const invPill = document.getElementById("pcInv"), prompt = document.getElementById("pcPrompt");
  const interact = [];
  const key = new THREE.Group(); const kb = box(0.25, 0.05, 0.05, 0xc9a95a, { metalness: 0.8, roughness: 0.3 }); const kr = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 8, 16), mat(0xc9a95a, { metalness: 0.8 })); kr.position.x = -0.15; key.add(kb, kr); key.position.set(2.5, 0.85, 2); w.scene.add(key);
  const table = box(1.2, 0.8, 0.7, 0x5a4630); table.position.set(2.5, 0.4, 2); w.scene.add(table); colliders.push(table);
  interact.push({ obj: key, prompt: () => "E · Pick up Key_Office", act: () => { hasKey = true; w.scene.remove(key); invPill.textContent = "Inventory · Key_Office"; logLine("PickableItem → InventoryManager.AddItem(Key_Office) · SaveManager.MarkAsDestroyed", "s"); } });
  const note = plane(0.6, 0.45, labelTex("La clau és\na la taula", { w: 256, h: 192, bg: "#e9dfc2", fg: "#3a3326", size: 32 })); note.position.set(-4.88, 1.5, 1); note.rotation.y = Math.PI / 2; w.scene.add(note);
  interact.push({ obj: note, prompt: () => "E · Read note", act: () => logLine("InteractableNote → RequestShowNoteReader (panell de lectura, bloqueja el moviment)", "i") });
  const lever = new THREE.Group(); const lb = box(0.3, 0.3, 0.2, 0x3d3a2d); const ls = box(0.06, 0.5, 0.06, 0x9a7d3f); ls.position.y = 0.25; const la = new THREE.Group(); la.add(ls); la.rotation.x = 0.5; lever.add(lb, la); lever.position.set(4.85, 1.2, -2); lever.rotation.y = -Math.PI / 2; w.scene.add(lever);
  let leverOn = false; const bulb = new THREE.PointLight(0x66ffaa, 0, 5); bulb.position.set(4.2, 2.4, -2); w.scene.add(bulb);
  interact.push({ obj: lever, prompt: () => leverOn ? "E · Turn Off" : "E · Turn On", act: () => { leverOn = !leverOn; la.rotation.x = leverOn ? -0.5 : 0.5; bulb.intensity = leverOn ? 1.2 : 0; logLine(`InteractableToggle → OnStateToggled(${leverOn})`); } });
  const doorObj = door.group;
  interact.push({ obj: doorObj, prompt: () => doorOpen ? "E · Close" : hasKey ? "E · Unlock with Key_Office" : "E · Locked (needs Key_Office)", act: () => { if (!hasKey && !doorOpen) { logLine("Door → TryUseItem: no compatible item (OfferCompatible)", "w"); return; } doorOpen = !doorOpen; doorOpen ? door.open() : door.close(); logLine(doorOpen ? "Door.Unlock() → Open()" : "Door.Close()", "s"); } });
  // first-person controller
  const pos = new THREE.Vector3(0, 1.6, 3); let yaw = 0, pitch = 0; const keys = {};
  const place = () => { w.camera.position.copy(pos); w.camera.rotation.set(pitch, yaw, 0, "YXZ"); };
  place();
  let dragLook = null;
  const cv = w.renderer.domElement;
  cv.addEventListener("pointerdown", (e) => { dragLook = { x: e.clientX, y: e.clientY, yaw, pitch }; el.focus({ preventScroll: true }); });
  window.addEventListener("pointerup", () => dragLook = null);
  cv.addEventListener("pointermove", (e) => {
    if (document.pointerLockElement === cv) { yaw -= e.movementX * 0.0025; pitch = Math.max(-1.3, Math.min(1.3, pitch - e.movementY * 0.0025)); place(); return; }
    if (dragLook) { yaw = dragLook.yaw - (e.clientX - dragLook.x) * 0.005; pitch = Math.max(-1.3, Math.min(1.3, dragLook.pitch - (e.clientY - dragLook.y) * 0.005)); place(); }
  });
  cv.addEventListener("dblclick", () => { try { cv.requestPointerLock?.(); } catch (e) { } });
  const kd = (e) => {
    if (document.activeElement !== el && document.pointerLockElement !== cv) return;
    const k = e.key.toLowerCase(); keys[k] = true;
    if (["w", "a", "s", "d", " ", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
    if (k === "e" && focus) focus.act();
    if (k === "i") logLine("I → RequestToggleInventory: " + (hasKey ? "[Key_Office]" : "[ ]"), "i");
    if (k === "h") logLine("H → HintManager.RequestNextHint()", "i");
    if (k === "f5") { e.preventDefault(); logLine("F5 → SaveManager.SaveGame(\"slot_0\")", "s"); }
    if (k === "f9") { e.preventDefault(); logLine("F9 → SaveManager.LoadGame(\"slot_0\")", "s"); }
  };
  const ku = (e) => keys[e.key.toLowerCase()] = false;
  window.addEventListener("keydown", kd); window.addEventListener("keyup", ku);
  let focus = null; const center = new THREE.Vector2(0, 0);
  w.tick((dt) => {
    const sp = (keys["shift"] ? 4 : 2.2) * dt; const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const mv = new THREE.Vector3();
    if (keys["w"] || keys["arrowup"]) mv.add(f); if (keys["s"] || keys["arrowdown"]) mv.sub(f); if (keys["d"]) mv.add(r); if (keys["a"]) mv.sub(r);
    if (mv.lengthSq()) { mv.normalize().multiplyScalar(sp); const nx = pos.x + mv.x, nz = pos.z + mv.z; const lim = doorOpen && nz < -4.5 && nx > -0.6 && nx < 0.6 ? 7 : 4.6; pos.x = Math.max(-4.6, Math.min(4.6, nx)); pos.z = Math.max(-lim, Math.min(4.6, nz)); if (Math.hypot(pos.x - 2.5, pos.z - 2) < 0.8) { pos.x -= mv.x; pos.z -= mv.z; } place(); }
    w.ray.setFromCamera(center, w.camera); w.ray.far = 2.8;
    const hits = w.ray.intersectObjects(interact.map(i => i.obj), true);
    let nf = null; if (hits.length) { let o = hits[0].object; nf = interact.find(i => { let p = o; while (p) { if (p === i.obj) return true; p = p.parent; } return false; }); }
    if (nf !== focus) {
      if (focus) focus.obj.traverse(m => m.material && m.material.emissive && m.material.emissive.setHex(0));
      focus = nf; if (focus) focus.obj.traverse(m => m.material && m.material.emissive && m.material.emissive.setHex(0x4a3a14));
    }
    if (focus) { prompt.hidden = false; prompt.textContent = focus.prompt(); } else prompt.hidden = true;
  });
  logLine("Player_PC · PCPlayerPlatformAdapter registrat a PlayerPlatformRegistry", "i");
  return () => { window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); if (document.pointerLockElement === cv) document.exitPointerLock(); w.dispose(); };
};

/* ── VR rig demo ─────────────────────────────────────────────────────────── */
Stages.vr = (el) => {
  const w = createWorld(el, { orbit: { r: 6, theta: 0.8, phi: 1.1, target: new THREE.Vector3(0, 1.1, 0) } });
  floorRoom(w, 14);
  const cfg = { locomotion: "Both", turn: "Snap", snap: 45, speed: 1.5, vignette: true };
  const rig = new THREE.Group(); w.scene.add(rig);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.4, 32), new THREE.MeshBasicMaterial({ color: 0xb39a61, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; rig.add(ring);
  const head = new THREE.Group(); head.position.y = 1.65; rig.add(head);
  const hm = box(0.26, 0.16, 0.2, 0x2a2a2a); const visor = box(0.24, 0.1, 0.02, 0x3b6ab8, { emissive: 0x112244 }); visor.position.z = -0.11; head.add(hm, visor);
  const hand = (x) => { const g = new THREE.Group(); g.position.set(x, 1.1, -0.35); const c = box(0.06, 0.06, 0.16, 0x444444); const tr = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 8, 20), mat(0x777777)); tr.position.set(0, 0.04, -0.04); tr.rotation.x = 0.8; g.add(c, tr);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 3, 6), new THREE.MeshBasicMaterial({ color: 0x9fd6ff, transparent: true, opacity: 0.6 })); beam.rotation.x = Math.PI / 2; beam.position.z = -1.55; g.add(beam); rig.add(g); return g; };
  const L = hand(-0.25), R = hand(0.25);
  const tgt = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.22, 24), new THREE.MeshBasicMaterial({ color: 0x6fbf87, side: THREE.DoubleSide })); tgt.rotation.x = -Math.PI / 2; tgt.visible = false; w.scene.add(tgt);
  const arc = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x6fbf87 })); w.scene.add(arc);
  const vign = document.createElement("div"); vign.style.cssText = "position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 80%);opacity:0;transition:opacity .25s"; el.appendChild(vign);
  const anim = [];
  const tele = () => {
    if (cfg.locomotion === "ContinuousOnly") { logLine("Teleport desactivat: Locomotion Mode = ContinuousOnly", "w"); return; }
    const to = new THREE.Vector3((Math.random() - 0.5) * 6, 0, (Math.random() - 0.5) * 6); tgt.position.set(to.x, 0.02, to.z); tgt.visible = true;
    const from = rig.position.clone().add(new THREE.Vector3(0.25, 1.1, -0.35)); const pts = []; for (let i = 0; i <= 20; i++) { const k = i / 20; pts.push(new THREE.Vector3().lerpVectors(from, to, k).setY(from.y * (1 - k) + Math.sin(k * Math.PI) * 1.2)); }
    arc.geometry.dispose(); arc.geometry = new THREE.BufferGeometry().setFromPoints(pts);
    setTimeout(() => { rig.position.set(to.x, 0, to.z); tgt.visible = false; arc.geometry.dispose(); arc.geometry = new THREE.BufferGeometry(); }, 600);
  };
  const turn = () => { if (cfg.turn === "Snap") rig.rotation.y += THREE.MathUtils.degToRad(cfg.snap); else anim.push({ t: 1, f: (dt) => rig.rotation.y += THREE.MathUtils.degToRad(75) * dt }); };
  const move = () => {
    if (cfg.locomotion === "TeleportOnly") { logLine("Moviment continu desactivat: Locomotion Mode = TeleportOnly", "w"); return; }
    if (cfg.vignette) vign.style.opacity = "1";
    anim.push({ t: 1.6, f: (dt) => { const d = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), rig.rotation.y).multiplyScalar(cfg.speed * dt); rig.position.add(d); rig.position.x = Math.max(-6, Math.min(6, rig.position.x)); rig.position.z = Math.max(-6, Math.min(6, rig.position.z)); }, end: () => vign.style.opacity = "0" });
  };
  w.tick((dt, tm) => { for (let i = anim.length - 1; i >= 0; i--) { const a = anim[i]; a.f(dt); a.t -= dt; if (a.t <= 0) { a.end && a.end(); anim.splice(i, 1); } } if (!reduceMotion) { head.rotation.y = Math.sin(tm * 0.7) * 0.25; L.position.y = 1.1 + Math.sin(tm * 1.3) * 0.03; R.position.y = 1.1 + Math.cos(tm * 1.1) * 0.03; } w.orbit.target.set(rig.position.x, 1.1, rig.position.z); w.applyOrbit(); });
  document.getElementById("vrTele").onclick = () => { tele(); logLine("Teleport (TeleportationArea)"); };
  document.getElementById("vrTurn").onclick = () => { turn(); logLine(`Turn · ${cfg.turn} ${cfg.turn === "Snap" ? cfg.snap + "°" : "75°/s"}`); };
  document.getElementById("vrMove").onclick = () => { move(); };
  const box2 = document.getElementById("vrFields");
  const fields = [
    ["locomotionMode", "select", cfg.locomotion, ["TeleportOnly", "ContinuousOnly", "Both"], v => cfg.locomotion = v],
    ["continuousMoveSpeed", "number", cfg.speed, null, v => cfg.speed = parseFloat(v) || 1.5],
    ["turnMode", "select", cfg.turn, ["Snap", "Continuous"], v => cfg.turn = v],
    ["snapTurnAmount", "number", cfg.snap, null, v => cfg.snap = Math.max(15, Math.min(90, parseFloat(v) || 45))],
    ["tunnelingVignette", "checkbox", cfg.vignette, null, v => cfg.vignette = v]];
  box2.innerHTML = fields.map(([n, ty, v, opts]) => `<div class="field"><label for="vr_${n}">${n}</label>${ty === "select" ? `<select id="vr_${n}">${opts.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>` : ty === "checkbox" ? `<input type="checkbox" id="vr_${n}" ${v ? "checked" : ""}>` : `<input type="number" id="vr_${n}" value="${v}">`}</div>`).join("");
  fields.forEach(([n, ty, , , fn]) => { const e = document.getElementById("vr_" + n); e.onchange = () => fn(ty === "checkbox" ? e.checked : e.value); });
  return () => { vign.remove(); w.dispose(); };
};
