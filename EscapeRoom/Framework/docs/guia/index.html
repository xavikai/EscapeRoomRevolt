ues una escena de la plantilla, però només hi assignes un fitxer teu.", "fix": ["Si arrossegues el tema i no s'hi queda, comprova que has seleccionat `MainMenuUI` i no `MainMenuCamera`."]}, {"id": "t3", "title": "Assigna'l també al menú de pausa", "do": ["Obre la teva escena (`Sala1`).", "A la Hierarchy, obre la fletxa de `GameManager` i clica `MenuUI`.", "Arrossega `TemaMenu` al camp `Theme` del seu `UI Toolkit Menu Controller` i desa.", "Repeteix-ho a cada escena de joc que tinguis."], "see": "En prémer [[Esc]] durant el joc, el menú de pausa té els mateixos colors que el principal.", "fix": ["El nom del camp surt en negreta perquè és un canvi només d'aquesta escena (un *override* del prefab). És correcte."]}, {"id": "t4", "title": "Tria els colors", "do": ["Selecciona `TemaMenu`. A `Colores` hi ha sis colors: `Panel Background` (fons del marc), `Accent` (vores), `Title Text` (títol), `Button Background`, `Button Background Hover` (botó amb el ratolí a sobre) i `Button Text`.", "Clica cada color i tria'l. Al selector de Unity pots escriure el codi al camp `Hexadecimal` (per exemple `1B2A3A`).", "Truc: prova combinacions al **Taller de menús** d'aquesta mateixa pàgina, més amunt, i copia'n els codis."], "see": "En prémer Play a l'escena `MainMenu`, el menú surt amb els teus colors.", "fix": ["Si el text no es llegeix bé, augmenta el contrast entre el fons del botó i el text del botó.", "Si posant `A` (transparència) a 0 el color desapareix, és normal: el canal `A` és l'opacitat."]}, {"id": "t5", "title": "Posa el títol del joc i els crèdits", "do": ["A `Textos propios` > `Main Menu Title`, escriu el nom del teu joc (per exemple `LA CAMBRA DEL RELLOTGER`).", "A `Credits Text`, escriu els autors, l'assignatura, el curs i les llicències de recursos d'altres persones (models, sons, fonts)."], "see": "La pantalla principal mostra el teu títol i el botó `Créditos` mostra el teu text.", "fix": ["Si deixes el camp buit, es fa servir el text de la plantilla."]}, {"id": "t6", "title": "Afegeix un logo", "do": ["Arrossega un PNG (millor amb fons transparent, uns 256 × 256 px) des de l'Explorador de Windows fins a `Assets/ElMeuJoc/UI`.", "Selecciona'l i, a l'Inspector, posa `Texture Type` = **`Sprite (2D and UI)`**. Clica `Apply`.", "Arrossega'l al camp `Logo` de `TemaMenu`."], "see": "El logo surt a sobre del títol, a totes les pantalles del menú.", "fix": ["Si no el pots arrossegar al camp `Logo`, no l'has convertit a `Sprite (2D and UI)`.", "Per canviar-ne la mida necessites el nivell 2 (selector `.menu-logo`)."]}, {"id": "t7", "title": "Canvia les fonts", "do": ["Descarrega una font gratuïta amb llicència lliure (per exemple de Google Fonts). Necessites el fitxer `.ttf` o `.otf`.", "Arrossega'l a `Assets/ElMeuJoc/Fonts`.", "Assigna'l a `Title Font` (títols) i, si vols, una altra a `Body Font` (botons i textos)."], "see": "El menú fa servir les teves fonts.", "fix": ["Comprova que la font té accents, `ç` i `l·l`. Si no, sortiran quadrats en lloc de lletres.", "Les fonts decoratives queden bé als títols però costen de llegir als botons: per a `Body Font` tria una font simple.", "Afegeix la llicència de la font als crèdits."]}, {"id": "t8", "title": "Prova-ho tot", "do": ["Obre `MainMenu` i prem Play. Recorre totes les pantalles: principal, Ajustes, Cargar, Créditos.", "Entra al joc i prem [[Esc]] per veure el menú de pausa.", "A Ajustes, activa l'**alt contrast**: el menú passa a negre, blanc i groc. És correcte: l'accessibilitat guanya al tema."], "see": "Totes les pantalles es llegeixen bé i tenen els teus colors, fonts i logo.", "fix": ["Si una pantalla no canvia, revisa que el tema estigui assignat a `MainMenuUI` (t2) i a `MenuUI` de cada escena (t3)."]}]}, {"id": "U", "title": "Nivell 2 · El teu full d'estils amb UI Builder", "goal": "Una còpia del menú amb un fitxer `.uss` teu per canviar mides, formes, posició i imatges.", "steps": [{"id": "u1", "title": "Fes una còpia de l'estructura del menú", "do": ["A **Project**, baixa fins a `Packages` > `Revolt Common Framework` > `UI` > `Toolkit`.", "Clica `EscapeRoomMenu` (la icona de UXML) i prem [[Ctrl]] + [[C]].", "Ves a `Assets/ElMeuJoc/UI`, clica a l'espai buit i prem [[Ctrl]] + [[V]].", "Canvia el nom de la còpia a `MenuElMeuJoc` ([[F2]])."], "see": "A la teva carpeta `UI` hi ha `MenuElMeuJoc.uxml`. La plantilla no ha canviat.", "fix": ["Si [[Ctrl]] + [[V]] no fa res, fes clic dret a `EscapeRoomMenu` > `Show in Explorer`, copia el fitxer amb l'Explorador de Windows i enganxa'l a la carpeta `Assets/ElMeuJoc/UI` del teu projecte. Copia **només** el `.uxml`, no el `.meta`.", "**No** arrosseguis el fitxer fora de `Packages`: el mouries en lloc de copiar-lo."]}, {"id": "u2", "title": "Obre la còpia amb UI Builder", "do": ["Fes doble clic a `MenuElMeuJoc`. S'obre la finestra **UI Builder**.", "Hi veuràs: a dalt a l'esquerra `StyleSheets` (fulls d'estil), a sota `Hierarchy` (les caixes del menú), al mig el `Viewport` (la vista prèvia) i a la dreta l'`Inspector` (propietats de la caixa o del selector triat)."], "see": "Al Viewport surt el marc fosc amb el títol `ARCHIVO 06`. **Els botons no hi surten**: els crea el codi quan prems Play.", "fix": ["Si la finestra és massa petita, maximitza-la amb doble clic a la seva pestanya."]}, {"id": "u3", "title": "Crea el teu full d'estils", "do": ["Al panell `StyleSheets`, clica el botó **`+`** > `Create New USS`.", "Desa'l a `Assets/ElMeuJoc/UI` amb el nom `MenuElMeuJoc.uss`."], "see": "A `StyleSheets` hi ha dos fulls: `EscapeRoomMenu.uss` (el de la plantilla) i, a sota, `MenuElMeuJoc.uss` (el teu). El de sota guanya: el que hi posis substitueix el de la plantilla.", "fix": ["Si el teu ha quedat a sobre, arrossega'l a sota."]}, {"id": "u4", "title": "El teu primer canvi: botons més grans i arrodonits", "do": ["Clica `MenuElMeuJoc.uss` al panell StyleSheets perquè sigui l'actiu.", "Al camp `Add new selector...` escriu `.menu-button` (amb el punt) i prem [[Enter]].", "Clica el selector nou. A l'Inspector de la dreta: `Size` > `Height` = 56 · `Text` > `Font Size` = 20 · `Border` > `Radius` = 10 · `Spacing` > `Margin` > a baix (`Bottom`) = 12.", "Desa amb [[Ctrl]] + [[S]] (amb el ratolí a sobre de la finestra UI Builder)."], "see": "A la part de baix de UI Builder (o obrint `MenuElMeuJoc.uss`) hi ha el text `.menu-button { height: 56px; font-size: 20px; ... }`. Encara no ho veuràs al joc: falta el pas u6.", "fix": ["El punt és important: `.menu-button` vol dir \"tots els elements amb la classe menu-button\". Sense punt no funciona.", "Si l'Inspector diu que el selector no coincideix amb cap element, és normal: els botons es creen en jugar."]}, {"id": "u5", "title": "O enganxa el codi del dissenyador", "do": ["Fes servir el **dissenyador visual** que hi ha a sota d'aquests passos: mou els controls fins que la vista prèvia t'agradi.", "Clica `Copia el codi USS`.", "A Unity, fes doble clic a `MenuElMeuJoc.uss`: s'obre a l'editor de codi (Visual Studio o el Bloc de notes).", "Selecciona-ho tot ([[Ctrl]] + [[A]]), enganxa ([[Ctrl]] + [[V]]) i desa ([[Ctrl]] + [[S]])."], "see": "El fitxer conté els selectors `.menu-root`, `.document-frame`, `.title`, `.menu-button` i `.menu-button:hover` amb els teus valors.", "fix": ["Si Unity mostra un avís groc d'USS a la Console, hi ha una línia mal copiada. Torna a copiar i enganxar el codi sencer."]}, {"id": "u6", "title": "Fes que el joc faci servir la teva còpia", "do": ["Obre `MainMenu`. Clica `MainMenuUI` i, al component `UI Document`, arrossega `MenuElMeuJoc` (l'UXML) al camp **`Source Asset`**.", "Obre `Sala1`. Clica `GameManager` > `MenuUI` i fes el mateix al seu `UI Document`.", "Desa les dues escenes."], "see": "En prémer Play, els botons tenen la nova mida i forma, al menú principal i al de pausa.", "fix": ["Si el menú surt buit o sense botons, a la teva còpia s'ha canviat el nom d'algun element (`document-frame`, `logo`, `title`, `screen-content`). Torna a fer la còpia del pas u1.", "Si no veus el canvi de color, recorda que el **tema** guanya en els colors. Canvia'ls al tema o buida el camp `Theme`."]}, {"id": "u7", "title": "Posa una imatge de fons a tot el menú", "do": ["Importa una imatge (per exemple 1920 × 1080) a `Assets/ElMeuJoc/UI` i posa-la com a `Sprite (2D and UI)`.", "A UI Builder, crea el selector `.menu-root` al teu USS.", "A l'Inspector: `Background` > `Image` = la teva imatge · `Scale Mode` = `scale-and-crop`.", "Si vols que la imatge es vegi a través del marc, posa un color de fons del marc amb transparència (al tema: `Panel Background` amb `A` al voltant de 200)."], "see": "La imatge omple tota la pantalla darrere del marc del menú.", "fix": ["En el menú de pausa el fons tapa el joc. Si només la vols al menú principal, fes dues còpies de l'UXML (una per a cada menú) amb fulls d'estil diferents."]}, {"id": "u8", "title": "Botons amb imatge", "do": ["Dissenya una imatge de botó **sense text** (per exemple 400 × 80 px) i una altra per a quan el ratolí és a sobre.", "Importa-les com a `Sprite (2D and UI)`.", "Al selector `.menu-button`: `Background` > `Image` = imatge normal. Al selector `.menu-button:hover`: la imatge de ratolí a sobre.", "Si la imatge té vores decorades, al mateix selector obre `Background` > `Slice` i posa quants píxels ocupa la vora a cada costat (per exemple 20). Així el centre s'estira i les cantonades no es deformen.", "Treu la vora vermella: `.menu-button` > `Border` > `Width` esquerra = 0."], "see": "Els botons tenen la teva imatge i el text continua sortint a sobre i traduint-se.", "fix": ["Si darrere de la imatge es veu un color, és el color de fons del botó del tema: posa'l amb `A` = 0 al tema.", "Si la imatge es veu estirada i lletja, revisa els valors de `Slice`."]}, {"id": "u9", "title": "Comprova-ho a fons", "do": ["Juga totes les pantalles: principal, Ajustes (té barres i desplegables), Cargar/Guardar (ranures), Créditos, confirmació de Salir i pausa.", "Prova amb la finestra Game petita i gran (menú `Free Aspect` > `1280x720` i `1920x1080`).", "Activa l'alt contrast als Ajustes."], "see": "Res no queda tallat, tot es llegeix i els botons responen al ratolí.", "fix": ["Si a Ajustes les etiquetes queden tallades, no facis el marc més estret de 640 px.", "Si algun canvi no es veu durant el Play, atura'l i torna'l a engegar."]}]}], "designer_t": "Dissenyador visual del menú", "designer_lead": "Mou els controls i mira el resultat. Quan t'agradi, copia el codi i enganxa'l al teu fitxer `MenuElMeuJoc.uss` (pas u5). Els valors inicials són els de la plantilla.", "designer_colors_note": "Aquests colors només es veuen al joc si el camp `Theme` està buit. Si fas servir un tema, posa els colors al tema.", "d": {"g_panel": "Marc", "g_title": "Títol", "g_button": "Botons", "g_colors": "Colors (només sense tema)", "align": "Posició del marc", "left": "Esquerra", "center": "Centre", "right": "Dreta", "width": "Amplada del marc", "padding": "Marge interior", "border": "Gruix de la vora", "radius": "Cantonades arrodonides", "tsize": "Mida del títol", "tspacing": "Espai entre lletres", "talign": "Alineació del títol", "bheight": "Alçada", "bsize": "Mida de lletra", "bgap": "Separació", "bradius": "Cantonades", "bstripe": "Franja esquerra", "bcenter": "Text centrat", "bhover": "Animació en passar el ratolí", "c_panel": "Fons del marc", "c_accent": "Vora", "c_title": "Títol", "c_btn": "Fons del botó", "c_btnh": "Botó (ratolí a sobre)", "c_text": "Text", "c_stripe": "Franja", "copy": "Copia el codi USS", "copied": "Copiat!", "reset": "Torna als valors de la plantilla", "code_t": "Codi per a MenuElMeuJoc.uss", "p_title": "EL MEU JOC", "p_b1": "Nova partida", "p_b2": "Continuar", "p_b3": "Ajustos", "p_b4": "Crèdits", "p_b5": "Sortir"}, "ref_t": "Referència: selectors que pots fer servir", "ref_h": ["Selector", "Què és", "Exemples de canvis"], "ref": [[".menu-root", "Fons de tota la pantalla", "`background-image`, `align-items`, `padding-left`"], [".document-frame", "Marc del menú", "`width`, `padding`, `border-radius`, `border-width`"], [".menu-logo", "Logo", "`width`, `height`, `margin-bottom`"], [".title", "Títol de cada pantalla", "`font-size`, `letter-spacing`, `-unity-text-align`"], [".menu-button", "Botons principals", "`height`, `font-size`, `border-radius`, `background-image`"], [".menu-button:hover", "Botó amb el ratolí a sobre", "`background-color`, `scale`, `translate`"], [".menu-button--quiet", "Botons secundaris (Crèdits, Sortir, Tornar)", "`opacity`, `margin-top`"], [".menu-button--danger", "Botó de confirmar una acció perillosa", "`background-color`, `border-left-color`"], [".settings-section", "Títols de secció a Ajustes", "`font-size`, `color`"], [".setting-row", "Una fila d'Ajustes (etiqueta + control)", "`margin-bottom`"], [".save-slot-card", "Una ranura de partida desada", "`height`, `background-color`, `border-radius`"], [".confirmation-message", "Text de les confirmacions", "`font-size`, `color`"]], "hud_t": "I el HUD del joc?", "hud": "La interfície durant el joc (inventari, missatges, pistes, temporitzador) funciona igual: és `GameplayHUD.uxml` amb `GameplayHUD.uss`, i la mostra el `UI Document` de `GameManager` > `GameplayUI`. Pots seguir el mateix procés del nivell 2: copia l'UXML, afegeix-hi el teu USS i assigna'l al `Source Asset` de `GameplayUI`. Canvia només l'aspecte, mai els noms dels elements."}, "es": {"eyebrow": "Diseño del menú · paso a paso", "title": "Cambia el aspecto del menú sin saber UI Toolkit", "lead": "El menú de la plantilla está hecho con UI Toolkit, el sistema de interfaces de Unity que funciona como una página web. No hace falta dominarlo: hay tres niveles. Empieza por el primero, que no te pide escribir nada, y pasa al segundo solo si quieres cambiar tamaños, formas, posiciones o poner imágenes en los botones.", "levels_t": "Tres niveles de personalización", "levels": [{"n": "1", "t": "Tema (sin UI Toolkit)", "d": "Un archivo de configuración, `Menu Theme Settings`, donde eliges colores, dos fuentes, un logo, el título del juego y los créditos. Todo se hace en el Inspector.", "tag": "Recomendado para empezar"}, {"n": "2", "t": "Hoja de estilos propia (UI Builder)", "d": "Una copia del menú con un archivo de estilos `.uss` tuyo. En él cambias tamaños, bordes redondeados, posición del panel, imágenes de fondo y animaciones. Se hace con el editor visual **UI Builder** o pegando el código que genera el diseñador de esta página.", "tag": "Cuando el tema se te queda corto"}, {"n": "3", "t": "Cambiar la estructura (avanzado)", "d": "Los botones de cada pantalla (Nueva partida, Continuar, Ajustes...) **los crea el código C#**, no el archivo de diseño. Añadir pantallas o botones nuevos significa programar en `UIToolkitMenuController.cs`. No lo necesitas para hacer un menú con personalidad.", "tag": "Solo si programas"}], "anatomy_t": "Cómo está hecho el menú", "anatomy_lead": "Haz clic en cada parte del menú de muestra para saber cómo se llama, en qué archivo se cambia y qué puedes modificar.", "anatomy_pick": "Haz clic en una parte del menú.", "anatomy_files_t": "Las cuatro piezas", "anatomy_files": [{"k": "UIDocument", "d": "El componente que muestra el menú en la escena. Hay dos: `MainMenuUI` en la escena `MainMenu` (menú principal) y `MenuUI` dentro de `GameManager` (menú de pausa). El campo `Source Asset` indica qué UXML usa."}, {"k": "UXML", "d": "La **estructura**: qué cajas hay y cómo se anidan. El del menú es `EscapeRoomMenu.uxml`: un fondo, un marco, el logo, el título y una zona donde el código pone los botones."}, {"k": "USS", "d": "El **aspecto**: colores, tamaños, bordes, márgenes, imágenes. Es como el CSS de una web. El de la plantilla es `EscapeRoomMenu.uss`; el tuyo irá en un archivo aparte."}, {"k": "C#", "d": "El **comportamiento**: `UIToolkitMenuController` crea los botones de cada pantalla, los traduce y aplica el tema. No tienes que tocarlo."}], "parts": [{"id": "root", "sel": ".menu-root", "name": "Fondo de pantalla", "d": "Ocupa toda la pantalla y centra el marco. Aquí puedes poner una imagen de fondo (`background-image`) o mover el marco a la izquierda (`align-items: flex-start`)."}, {"id": "frame", "sel": "#document-frame · .document-frame", "name": "Marco del menú", "d": "La caja donde está todo. Ancho (`width: 760px`), margen interior (`padding`), grosor y color del borde, esquinas redondeadas (`border-radius`) y color o imagen de fondo."}, {"id": "logo", "sel": "#logo · .menu-logo", "name": "Logo", "d": "Oculto si no pones logo en el tema. Tamaño con `width` y `height` (72 px por defecto)."}, {"id": "title", "sel": "#title · .title", "name": "Título", "d": "El título de cada pantalla. Tamaño de letra (`font-size: 28px`), espacio entre letras (`letter-spacing`), alineación (`-unity-text-align`) y fuente."}, {"id": "button", "sel": ".menu-button", "name": "Botón", "d": "Todos los botones del menú. Altura (`height: 42px`), separación (`margin-bottom`), tamaño de letra, borde izquierdo rojo (`border-left-width`, `border-left-color`), esquinas e imagen de fondo. El estado con el ratón encima es `.menu-button:hover`."}, {"id": "quiet", "sel": ".menu-button--quiet", "name": "Botón secundario", "d": "Botones como Créditos, Salir o Volver. Se ven más apagados (`opacity: 0.72`) y con más espacio encima."}, {"id": "content", "sel": "#screen-content · .screen-content", "name": "Zona de contenido", "d": "Donde el código pone los botones, los ajustes y las ranuras de partida. Tiene barra de desplazamiento si el contenido no cabe (`max-height: 560px`)."}], "warn_t": "Antes de tocar nada: cuatro normas", "warn": ["**No cambies el nombre** (`name`) de los elementos `document-frame`, `logo`, `title` ni `screen-content`. El código los busca por el nombre; si lo cambias, el menú se queda vacío.", "**No edites los archivos de la plantilla** (`EscapeRoomMenu.uxml` y `EscapeRoomMenu.uss`). Trabaja siempre sobre copias en tu carpeta.", "**Si hay un tema asignado, los colores del tema ganan** a los de tu USS (fondo del marco, borde, título y botones). Usa el tema para los colores y el USS para lo demás, o deja el campo `Theme` vacío si quieres controlar los colores desde el USS.", "**No escribas texto dentro de las imágenes** de los botones: el texto lo pone el código y se traduce solo. El modo de alto contraste de los Ajustes también tiene que seguir leyéndose bien."], "phases": [{"id": "T", "title": "Nivel 1 · El tema del menú", "goal": "Colores, fuentes, logo, título y créditos de tu juego, sin tocar ningún archivo de diseño.", "steps": [{"id": "t1", "title": "Crea el archivo del tema", "do": ["En **Project**, entra en tu carpeta (`Assets/MiJuego`) y crea dentro una carpeta `UI`.", "Dentro de `UI`: clic derecho > `Create` > `Escape Room Framework` > `Menu Theme Settings`.", "Ponle el nombre `TemaMenu` y pulsa [[Enter]]."], "see": "Un archivo `TemaMenu` en tu carpeta. Si lo seleccionas, el Inspector muestra los apartados `Colores`, `Tipografía`, `Marca` y `Textos propios`. Los valores por defecto son los colores actuales del menú: todavía no cambia nada.", "fix": ["Si no aparece `Escape Room Framework` en el menú `Create`, espera a que Unity termine de compilar (barra de abajo a la derecha)."]}, {"id": "t2", "title": "Asígnalo al menú principal", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Main Menu`.", "En la **Hierarchy**, haz clic en `MainMenuUI`.", "En el Inspector, en el componente `UI Toolkit Menu Controller`, arrastra `TemaMenu` desde Project hasta el campo **`Theme`**.", "Guarda la escena ([[Ctrl]] + [[S]])."], "see": "El campo `Theme` muestra `TemaMenu`. Aquí sí tocas una escena de la plantilla, pero solo le asignas un archivo tuyo.", "fix": ["Si arrastras el tema y no se queda, comprueba que has seleccionado `MainMenuUI` y no `MainMenuCamera`."]}, {"id": "t3", "title": "Asígnalo también al menú de pausa", "do": ["Abre tu escena (`Sala1`).", "En la Hierarchy, abre la flecha de `GameManager` y haz clic en `MenuUI`.", "Arrastra `TemaMenu` al campo `Theme` de su `UI Toolkit Menu Controller` y guarda.", "Repítelo en cada escena de juego que tengas."], "see": "Al pulsar [[Esc]] durante el juego, el menú de pausa tiene los mismos colores que el principal.", "fix": ["El nombre del campo sale en negrita porque es un cambio solo de esta escena (un *override* del prefab). Es correcto."]}, {"id": "t4", "title": "Elige los colores", "do": ["Selecciona `TemaMenu`. En `Colores` hay seis colores: `Panel Background` (fondo del marco), `Accent` (bordes), `Title Text` (título), `Button Background`, `Button Background Hover` (botón con el ratón encima) y `Button Text`.", "Haz clic en cada color y elígelo. En el selector de Unity puedes escribir el código en el campo `Hexadecimal` (por ejemplo `1B2A3A`).", "Truco: prueba combinaciones en el **Taller de menús** de esta misma página, más arriba, y copia sus códigos."], "see": "Al pulsar Play en la escena `MainMenu`, el menú sale con tus colores.", "fix": ["Si el texto no se lee bien, aumenta el contraste entre el fondo del botón y el texto del botón.", "Si al poner `A` (transparencia) a 0 el color desaparece, es normal: el canal `A` es la opacidad."]}, {"id": "t5", "title": "Pon el título del juego y los créditos", "do": ["En `Textos propios` > `Main Menu Title`, escribe el nombre de tu juego (por ejemplo `LA CÁMARA DEL RELOJERO`).", "En `Credits Text`, escribe los autores, la asignatura, el curso y las licencias de recursos de otras personas (modelos, sonidos, fuentes)."], "see": "La pantalla principal muestra tu título y el botón `Créditos` muestra tu texto.", "fix": ["Si dejas el campo vacío, se usa el texto de la plantilla."]}, {"id": "t6", "title": "Añade un logo", "do": ["Arrastra un PNG (mejor con fondo transparente, de unos 256 × 256 px) desde el Explorador de Windows hasta `Assets/MiJuego/UI`.", "Selecciónalo y, en el Inspector, pon `Texture Type` = **`Sprite (2D and UI)`**. Haz clic en `Apply`.", "Arrástralo al campo `Logo` de `TemaMenu`."], "see": "El logo sale encima del título, en todas las pantallas del menú.", "fix": ["Si no puedes arrastrarlo al campo `Logo`, es que no lo has convertido a `Sprite (2D and UI)`.", "Para cambiar su tamaño necesitas el nivel 2 (selector `.menu-logo`)."]}, {"id": "t7", "title": "Cambia las fuentes", "do": ["Descarga una fuente gratuita con licencia libre (por ejemplo de Google Fonts). Necesitas el archivo `.ttf` o `.otf`.", "Arrástralo a `Assets/MiJuego/Fonts`.", "Asígnalo a `Title Font` (títulos) y, si quieres, otra fuente a `Body Font` (botones y textos)."], "see": "El menú usa tus fuentes.", "fix": ["Comprueba que la fuente tiene tildes, `ñ` y `¿`. Si no, saldrán cuadrados en lugar de letras.", "Las fuentes decorativas quedan bien en los títulos pero cuestan de leer en los botones: para `Body Font` elige una fuente sencilla.", "Añade la licencia de la fuente a los créditos."]}, {"id": "t8", "title": "Pruébalo todo", "do": ["Abre `MainMenu` y pulsa Play. Recorre todas las pantallas: principal, Ajustes, Cargar, Créditos.", "Entra en el juego y pulsa [[Esc]] para ver el menú de pausa.", "En Ajustes, activa el **alto contraste**: el menú pasa a negro, blanco y amarillo. Es correcto: la accesibilidad gana al tema."], "see": "Todas las pantallas se leen bien y tienen tus colores, fuentes y logo.", "fix": ["Si una pantalla no cambia, revisa que el tema esté asignado a `MainMenuUI` (t2) y a `MenuUI` de cada escena (t3)."]}]}, {"id": "U", "title": "Nivel 2 · Tu hoja de estilos con UI Builder", "goal": "Una copia del menú con un archivo `.uss` tuyo para cambiar tamaños, formas, posición e imágenes.", "steps": [{"id": "u1", "title": "Haz una copia de la estructura del menú", "do": ["En **Project**, baja hasta `Packages` > `Revolt Common Framework` > `UI` > `Toolkit`.", "Haz clic en `EscapeRoomMenu` (el icono de UXML) y pulsa [[Ctrl]] + [[C]].", "Ve a `Assets/MiJuego/UI`, haz clic en el espacio vacío y pulsa [[Ctrl]] + [[V]].", "Cambia el nombre de la copia a `MenuMiJuego` ([[F2]])."], "see": "En tu carpeta `UI` está `MenuMiJuego.uxml`. La plantilla no ha cambiado.", "fix": ["Si [[Ctrl]] + [[V]] no hace nada, haz clic derecho en `EscapeRoomMenu` > `Show in Explorer`, copia el archivo con el Explorador de Windows y pégalo en la carpeta `Assets/MiJuego/UI` de tu proyecto. Copia **solo** el `.uxml`, no el `.meta`.", "**No** arrastres el archivo fuera de `Packages`: lo moverías en lugar de copiarlo."]}, {"id": "u2", "title": "Abre la copia con UI Builder", "do": ["Haz doble clic en `MenuMiJuego`. Se abre la ventana **UI Builder**.", "Verás: arriba a la izquierda `StyleSheets` (hojas de estilo), debajo `Hierarchy` (las cajas del menú), en el centro el `Viewport` (la vista previa) y a la derecha el `Inspector` (propiedades de la caja o del selector elegido)."], "see": "En el Viewport sale el marco oscuro con el título `ARCHIVO 06`. **Los botones no salen**: los crea el código cuando pulsas Play.", "fix": ["Si la ventana es demasiado pequeña, maximízala con doble clic en su pestaña."]}, {"id": "u3", "title": "Crea tu hoja de estilos", "do": ["En el panel `StyleSheets`, haz clic en el botón **`+`** > `Create New USS`.", "Guárdala en `Assets/MiJuego/UI` con el nombre `MenuMiJuego.uss`."], "see": "En `StyleSheets` hay dos hojas: `EscapeRoomMenu.uss` (la de la plantilla) y, debajo, `MenuMiJuego.uss` (la tuya). La de abajo gana: lo que pongas en ella sustituye a lo de la plantilla.", "fix": ["Si la tuya ha quedado arriba, arrástrala abajo."]}, {"id": "u4", "title": "Tu primer cambio: botones más grandes y redondeados", "do": ["Haz clic en `MenuMiJuego.uss` en el panel StyleSheets para que sea la activa.", "En el campo `Add new selector...` escribe `.menu-button` (con el punto) y pulsa [[Enter]].", "Haz clic en el selector nuevo. En el Inspector de la derecha: `Size` > `Height` = 56 · `Text` > `Font Size` = 20 · `Border` > `Radius` = 10 · `Spacing` > `Margin` > abajo (`Bottom`) = 12.", "Guarda con [[Ctrl]] + [[S]] (con el ratón encima de la ventana UI Builder)."], "see": "En la parte de abajo de UI Builder (o abriendo `MenuMiJuego.uss`) aparece el texto `.menu-button { height: 56px; font-size: 20px; ... }`. Todavía no lo verás en el juego: falta el paso u6.", "fix": ["El punto es importante: `.menu-button` significa \"todos los elementos con la clase menu-button\". Sin punto no funciona.", "Si el Inspector dice que el selector no coincide con ningún elemento, es normal: los botones se crean al jugar."]}, {"id": "u5", "title": "O pega el código del diseñador", "do": ["Usa el **diseñador visual** que hay debajo de estos pasos: mueve los controles hasta que te guste la vista previa.", "Haz clic en `Copiar el código USS`.", "En Unity, haz doble clic en `MenuMiJuego.uss`: se abre en el editor de código (Visual Studio o el Bloc de notas).", "Selecciónalo todo ([[Ctrl]] + [[A]]), pega ([[Ctrl]] + [[V]]) y guarda ([[Ctrl]] + [[S]])."], "see": "El archivo contiene los selectores `.menu-root`, `.document-frame`, `.title`, `.menu-button` y `.menu-button:hover` con tus valores.", "fix": ["Si Unity muestra un aviso amarillo de USS en la Console, hay una línea mal copiada. Vuelve a copiar y pegar el código entero."]}, {"id": "u6", "title": "Haz que el juego use tu copia", "do": ["Abre `MainMenu`. Haz clic en `MainMenuUI` y, en el componente `UI Document`, arrastra `MenuMiJuego` (el UXML) al campo **`Source Asset`**.", "Abre `Sala1`. Haz clic en `GameManager` > `MenuUI` y haz lo mismo en su `UI Document`.", "Guarda las dos escenas."], "see": "Al pulsar Play, los botones tienen el nuevo tamaño y forma, en el menú principal y en el de pausa.", "fix": ["Si el menú sale vacío o sin botones, en tu copia se ha cambiado el nombre de algún elemento (`document-frame`, `logo`, `title`, `screen-content`). Vuelve a hacer la copia del paso u1.", "Si no ves el cambio de color, recuerda que el **tema** gana en los colores. Cámbialos en el tema o vacía el campo `Theme`."]}, {"id": "u7", "title": "Pon una imagen de fondo en todo el menú", "do": ["Importa una imagen (por ejemplo de 1920 × 1080) en `Assets/MiJuego/UI` y ponla como `Sprite (2D and UI)`.", "En UI Builder, crea el selector `.menu-root` en tu USS.", "En el Inspector: `Background` > `Image` = tu imagen · `Scale Mode` = `scale-and-crop`.", "Si quieres que la imagen se vea a través del marco, pon un color de fondo del marco con transparencia (en el tema: `Panel Background` con `A` alrededor de 200)."], "see": "La imagen llena toda la pantalla detrás del marco del menú.", "fix": ["En el menú de pausa el fondo tapa el juego. Si solo la quieres en el menú principal, haz dos copias del UXML (una para cada menú) con hojas de estilo diferentes."]}, {"id": "u8", "title": "Botones con imagen", "do": ["Diseña una imagen de botón **sin texto** (por ejemplo de 400 × 80 px) y otra para cuando el ratón está encima.", "Impórtalas como `Sprite (2D and UI)`.", "En el selector `.menu-button`: `Background` > `Image` = imagen normal. En el selector `.menu-button:hover`: la imagen con el ratón encima.", "Si la imagen tiene bordes decorados, en el mismo selector abre `Background` > `Slice` y pon cuántos píxeles ocupa el borde en cada lado (por ejemplo 20). Así el centro se estira y las esquinas no se deforman.", "Quita el borde rojo: `.menu-button` > `Border` > `Width` izquierdo = 0."], "see": "Los botones tienen tu imagen y el texto sigue saliendo encima y traduciéndose.", "fix": ["Si detrás de la imagen se ve un color, es el color de fondo del botón del tema: ponlo con `A` = 0 en el tema.", "Si la imagen se ve estirada y fea, revisa los valores de `Slice`."]}, {"id": "u9", "title": "Compruébalo a fondo", "do": ["Juega todas las pantallas: principal, Ajustes (tiene barras y desplegables), Cargar/Guardar (ranuras), Créditos, confirmación de Salir y pausa.", "Prueba con la ventana Game pequeña y grande (menú `Free Aspect` > `1280x720` y `1920x1080`).", "Activa el alto contraste en los Ajustes."], "see": "Nada queda cortado, todo se lee y los botones responden al ratón.", "fix": ["Si en Ajustes las etiquetas quedan cortadas, no hagas el marco más estrecho de 640 px.", "Si algún cambio no se ve durante el Play, páralo y vuelve a ponerlo en marcha."]}]}], "designer_t": "Diseñador visual del menú", "designer_lead": "Mueve los controles y mira el resultado. Cuando te guste, copia el código y pégalo en tu archivo `MenuMiJuego.uss` (paso u5). Los valores iniciales son los de la plantilla.", "designer_colors_note": "Estos colores solo se ven en el juego si el campo `Theme` está vacío. Si usas un tema, pon los colores en el tema.", "d": {"g_panel": "Marco", "g_title": "Título", "g_button": "Botones", "g_colors": "Colores (solo sin tema)", "align": "Posición del marco", "left": "Izquierda", "center": "Centro", "right": "Derecha", "width": "Ancho del marco", "padding": "Margen interior", "border": "Grosor del borde", "radius": "Esquinas redondeadas", "tsize": "Tamaño del título", "tspacing": "Espacio entre letras", "talign": "Alineación del título", "bheight": "Altura", "bsize": "Tamaño de letra", "bgap": "Separación", "bradius": "Esquinas", "bstripe": "Franja izquierda", "bcenter": "Texto centrado", "bhover": "Animación al pasar el ratón", "c_panel": "Fondo del marco", "c_accent": "Borde", "c_title": "Título", "c_btn": "Fondo del botón", "c_btnh": "Botón (ratón encima)", "c_text": "Texto", "c_stripe": "Franja", "copy": "Copiar el código USS", "copied": "¡Copiado!", "reset": "Volver a los valores de la plantilla", "code_t": "Código para MenuMiJuego.uss", "p_title": "MI JUEGO", "p_b1": "Nueva partida", "p_b2": "Continuar", "p_b3": "Ajustes", "p_b4": "Créditos", "p_b5": "Salir"}, "ref_t": "Referencia: selectores que puedes usar", "ref_h": ["Selector", "Qué es", "Ejemplos de cambios"], "ref": [[".menu-root", "Fondo de toda la pantalla", "`background-image`, `align-items`, `padding-left`"], [".document-frame", "Marco del menú", "`width`, `padding`, `border-radius`, `border-width`"], [".menu-logo", "Logo", "`width`, `height`, `margin-bottom`"], [".title", "Título de cada pantalla", "`font-size`, `letter-spacing`, `-unity-text-align`"], [".menu-button", "Botones principales", "`height`, `font-size`, `border-radius`, `background-image`"], [".menu-button:hover", "Botón con el ratón encima", "`background-color`, `scale`, `translate`"], [".menu-button--quiet", "Botones secundarios (Créditos, Salir, Volver)", "`opacity`, `margin-top`"], [".menu-button--danger", "Botón para confirmar una acción peligrosa", "`background-color`, `border-left-color`"], [".settings-section", "Títulos de sección en Ajustes", "`font-size`, `color`"], [".setting-row", "Una fila de Ajustes (etiqueta + control)", "`margin-bottom`"], [".save-slot-card", "Una ranura de partida guardada", "`height`, `background-color`, `border-radius`"], [".confirmation-message", "Texto de las confirmaciones", "`font-size`, `color`"]], "hud_t": "¿Y el HUD del juego?", "hud": "La interfaz durante el juego (inventario, mensajes, pistas, temporizador) funciona igual: es `GameplayHUD.uxml` con `GameplayHUD.uss`, y la muestra el `UI Document` de `GameManager` > `GameplayUI`. Puedes seguir el mismo proceso del nivel 2: copia el UXML, añádele tu USS y asígnalo al `Source Asset` de `GameplayUI`. Cambia solo el aspecto, nunca los nombres de los elementos."}, "en": {"eyebrow": "Menu design · step by step", "title": "Change how the menu looks without knowing UI Toolkit", "lead": "The template's menu is built with UI Toolkit, Unity's interface system that works a lot like a web page. You don't need to master it: there are three levels. Start with the first one, which doesn't require writing anything, and move on to the second only if you want to change sizes, shapes, positions or put images on the buttons.", "levels_t": "Three levels of customization", "levels": [{"n": "1", "t": "Theme (no UI Toolkit)", "d": "A settings file, `Menu Theme Settings`, where you choose colors, two fonts, a logo, the game title and the credits. Everything is done in the Inspector.", "tag": "Recommended to start"}, {"n": "2", "t": "Your own style sheet (UI Builder)", "d": "A copy of the menu with a `.uss` style file of your own. There you change sizes, rounded borders, panel position, background images and animations. You do it with the **UI Builder** visual editor or by pasting the code generated by the designer on this page.", "tag": "When the theme isn't enough"}, {"n": "3", "t": "Change the structure (advanced)", "d": "The buttons on each screen (New Game, Continue, `Ajustes` (Settings)...) **are created by the C# code**, not by the layout file. Adding new screens or buttons means programming in `UIToolkitMenuController.cs`. You don't need this to make a menu with personality.", "tag": "Only if you code"}], "anatomy_t": "How the menu is built", "anatomy_lead": "Click each part of the sample menu to find out what it's called, which file you change it in and what you can modify.", "anatomy_pick": "Click a part of the menu.", "anatomy_files_t": "The four pieces", "anatomy_files": [{"k": "UIDocument", "d": "The component that shows the menu in the scene. There are two: `MainMenuUI` in the `MainMenu` scene (main menu) and `MenuUI` inside `GameManager` (pause menu). The `Source Asset` field says which UXML it uses."}, {"k": "UXML", "d": "The **structure**: which boxes there are and how they nest inside each other. The menu's one is `EscapeRoomMenu.uxml`: a background, a frame, the logo, the title and an area where the code places the buttons."}, {"k": "USS", "d": "The **look**: colors, sizes, borders, margins, images. It's like the CSS of a website. The template's one is `EscapeRoomMenu.uss`; yours will go in a separate file."}, {"k": "C#", "d": "The **behavior**: `UIToolkitMenuController` creates the buttons on each screen, translates them and applies the theme. You don't need to touch it."}], "parts": [{"id": "root", "sel": ".menu-root", "name": "Screen background", "d": "It fills the whole screen and centers the frame. Here you can add a background image (`background-image`) or move the frame to the left (`align-items: flex-start`)."}, {"id": "frame", "sel": "#document-frame · .document-frame", "name": "Menu frame", "d": "The box that holds everything. Width (`width: 760px`), inner spacing (`padding`), border thickness and color, rounded corners (`border-radius`) and background color or image."}, {"id": "logo", "sel": "#logo · .menu-logo", "name": "Logo", "d": "Hidden if you don't add a logo to the theme. Size with `width` and `height` (72 px by default)."}, {"id": "title", "sel": "#title · .title", "name": "Title", "d": "The title of each screen. Font size (`font-size: 28px`), space between letters (`letter-spacing`), alignment (`-unity-text-align`) and font."}, {"id": "button", "sel": ".menu-button", "name": "Button", "d": "All the menu buttons. Height (`height: 42px`), spacing (`margin-bottom`), font size, red left border (`border-left-width`, `border-left-color`), corners and background image. The mouse-over state is `.menu-button:hover`."}, {"id": "quiet", "sel": ".menu-button--quiet", "name": "Secondary button", "d": "Buttons like Credits, Quit or Back. They look more faded (`opacity: 0.72`) and have more space above them."}, {"id": "content", "sel": "#screen-content · .screen-content", "name": "Content area", "d": "Where the code places the buttons, the settings and the save slots. It gets a scroll bar if the content doesn't fit (`max-height: 560px`)."}], "warn_t": "Before you touch anything: four rules", "warn": ["**Don't change the name** (`name`) of the `document-frame`, `logo`, `title` or `screen-content` elements. The code looks for them by name; if you change it, the menu ends up empty.", "**Don't edit the template files** (`EscapeRoomMenu.uxml` and `EscapeRoomMenu.uss`). Always work on copies in your own folder.", "**If a theme is assigned, the theme's colors win** over the ones in your USS (frame background, border, title and buttons). Use the theme for colors and the USS for everything else, or leave the `Theme` field empty if you want to control the colors from the USS.", "**Don't put text inside the button images**: the code adds the text and translates it automatically. The high contrast mode in Ajustes (Settings) must also stay easy to read."], "phases": [{"id": "T", "title": "Level 1 · The menu theme", "goal": "Your game's colors, fonts, logo, title and credits, without touching any layout file.", "steps": [{"id": "t1", "title": "Create the theme file", "do": ["In **Project**, go into your folder (`Assets/MyGame`) and create a `UI` folder there.", "Inside `UI`: right-click > `Create` > `Escape Room Framework` > `Menu Theme Settings`.", "Name it `MenuTheme` and press [[Enter]]."], "see": "A `MenuTheme` file in your folder. If you select it, the Inspector shows the sections `Colores` (Colors), `Tipografía` (Typography), `Marca` (Branding) and `Textos propios` (Custom texts). The default values are the menu's current colors: nothing changes yet.", "fix": ["If `Escape Room Framework` doesn't appear in the `Create` menu, wait for Unity to finish compiling (bar at the bottom right)."]}, {"id": "t2", "title": "Assign it to the main menu", "do": ["Menu `Escape Room Framework` > `Demo` > `Open Main Menu`.", "In the **Hierarchy**, click `MainMenuUI`.", "In the Inspector, on the `UI Toolkit Menu Controller` component, drag `MenuTheme` from Project into the **`Theme`** field.", "Save the scene ([[Ctrl]] + [[S]])."], "see": "The `Theme` field shows `MenuTheme`. Here you do touch a template scene, but you only assign one of your own files to it.", "fix": ["If you drag the theme and it doesn't stay, check that you selected `MainMenuUI` and not `MainMenuCamera`."]}, {"id": "t3", "title": "Assign it to the pause menu too", "do": ["Open your scene (`Room1`).", "In the Hierarchy, open the arrow next to `GameManager` and click `MenuUI`.", "Drag `MenuTheme` into the `Theme` field of its `UI Toolkit Menu Controller` and save.", "Repeat this in every game scene you have."], "see": "When you press [[Esc]] during the game, the pause menu has the same colors as /* ── App shell: language, navigation, sections, 2D demos ───────────────────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem("err-guide:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("err-guide:" + k, JSON.stringify(v)); } catch (e) { } }
};
let LANG = store.get("lang", "ca");
if (!["ca", "es", "en"].includes(LANG)) LANG = "ca";
const t = (k) => { const v = I[k]; return v ? (v[LANG] ?? v.ca) : k; };
const tx = (o) => o[LANG] ?? o.ca;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SECTIONS = [
  ["start", "nav_start"], ["projects", "nav_projects"], ["tour", "nav_tour"], ["mech", "nav_mech"], ["rec", "nav_rec"], ["menu", "nav_menu"], ["player", "nav_player"],
  ["feat", "nav_feat"], ["room", "nav_room"], ["help", "nav_help"]];
let current = store.get("sec", "start");
if (location.hash && SECTIONS.some(s => s[0] === location.hash.slice(1))) current = location.hash.slice(1);
let currentMech = store.get("mech", "code");

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = SECTIONS.map(([id, key], i) =>
    `<li><button data-sec="${id}" aria-current="${id === current}"><span class="no">0${i}</span><span>${esc(t(key))}</span></button></li>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.sec));
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  document.documentElement.lang = LANG;
}

function go(id, focusSel) {
  current = id; store.set("sec", id);
  try { history.replaceState(null, "", "#" + id); } catch (e) { }
  render();
  window.scrollTo({ top: 0 });
  if (focusSel) setTimeout(() => { const el = document.querySelector(focusSel); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } }, 60);
}

function head(eyebrow, title, lead) {

}

/* Inspector field builder: fields = [{id,label,type,value,min,max,options,onChange}] */
function buildFields(fields) {
  const box = document.getElementById("labFields"); if (!box) return;
  box.innerHTML = fields.map(f => {
    const id = "f_" + f.id;
    let input;
    if (f.type === "bool") input = `<input type="checkbox" id="${id}" ${f.value ? "checked" : ""}>`;
    else if (f.type === "select") input = `<select id="${id}">${f.options.map(o => `<option ${o === f.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else input = `<input type="${f.type === "int" ? "number" : "text"}" id="${id}" value="${esc(f.value)}" ${f.min !== undefined ? `min="${f.min}"` : ""} ${f.max !== undefined ? `max="${f.max}"` : ""}>`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
  }).join("");
  fields.forEach(f => {
    const el = document.getElementById("f_" + f.id);
    el.addEventListener("change", () => {
      let v = f.type === "bool" ? el.checked : f.type === "int" ? Math.max(f.min ?? -1e9, Math.min(f.max ?? 1e9, parseInt(el.value || "0", 10))) : el.value;
      if (f.type === "int") el.value = v;
      f.onChange(v);
    });
  });
}

function copyText(pre, btn) {
  const done = () => { btn.textContent = t("copied"); setTimeout(() => btn.textContent = t("copy"), 1400); };
  const select = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(pre.textContent).then(done, select); } catch (e) { select(); }
}

/* ── Sliding ─────────────────────────────────────────────────────────────── */
Stages.mech.slide = (el) => {
  const w = createWorld(el, { orbit: { r: 5.5, theta: 0, phi: 1.35, target: new THREE.Vector3(0, 1.5, 0), minPhi: 1.0, maxPhi: 1.55 } });
  floorRoom(w, 10);
  const door = makeDoor(w, 2.4, -0.6);
  const cfg = { cols: 3, rows: 3, shuffle: 60 };
  const pz = puzzleCtl("SlidingPuzzle", door);
  let order = [], group = null;
  const target = () => { const a = []; for (let i = 1; i < cfg.cols * cfg.rows; i++) a.push(String(i)); a.push(""); return a; };
  function shuffle() {
    order = target(); let hole = order.length - 1, last = -1;
    for (let k = 0; k < cfg.shuffle; k++) {
      const x = hole % cfg.cols, y = Math.floor(hole / cfg.cols); const nb = [];
      if (x > 0) nb.push(hole - 1); if (x < cfg.cols - 1) nb.push(hole + 1); if (y > 0) nb.push(hole - cfg.cols); if (y < cfg.rows - 1) nb.push(hole + cfg.cols);
      const opts = nb.filter(n => n !== last); const c = opts[Math.floor(Math.random() * opts.length)];
      [order[hole], order[c]] = [order[c], order[hole]]; last = hole; hole = c;
    }
  }
  const tilesById = {};
  function build() {
    if (group) w.scene.remove(group);
    group = new THREE.Group(); group.position.set(-0.3, 1.5, 0); w.scene.add(group);
    const s = Math.min(0.62, 2.2 / Math.max(cfg.cols, cfg.rows));
    const frame = box(cfg.cols * s + 0.2, cfg.rows * s + 0.2, 0.1, 0x3d3a2d); frame.position.z = -0.08; group.add(frame);
    Object.keys(tilesById).forEach(k => delete tilesById[k]);
    order.forEach((id) => {
      if (!id) return;
      const tb = box(s * 0.94, s * 0.94, 0.1, 0x7d6c46, { roughness: 0.6 });
      const lab = plane(s * 0.8, s * 0.8, labelTex(id, { w: 128, h: 128, bg: null, fg: "#fff4d6", size: 76, font: "'Big Shoulders Display', Impact, sans-serif" }), true); lab.position.z = 0.051; tb.add(lab);
      group.add(tb); tilesById[id] = tb;
      w.clickable(tb, () => {
        if (pz.state === "Solved") return;
        const i = order.indexOf(id), h = order.indexOf("");
        const ax = i % cfg.cols, ay = Math.floor(i / cfg.cols), bx = h % cfg.cols, by = Math.floor(h / cfg.cols);
        if (!((ax === bx && Math.abs(ay - by) === 1) || (ay === by && Math.abs(ax - bx) === 1))) { logLine(`TryMoveTile("${id}") → false · TileMoveBlocked`, "w"); tb.position.x += 0.03; setTimeout(() => place(), 90); return; }
        [order[i], order[h]] = [order[h], order[i]]; pz.progress(); logLine(`TryMoveTile("${id}") → true`); place(); tone(300, 0.05);
        if (order.join(",") === target().join(",")) pz.solve();
      });
    });
    place();
    function place() { order.forEach((id, i) => { if (!id) return; const x = i % cfg.cols, y = Math.floor(i / cfg.cols); tilesById[id].position.set((x - (cfg.cols - 1) / 2) * s, ((cfg.rows - 1) / 2 - y) * s, 0); }); }
    group.userData.place = place;
  }
  const init = () => { shuffle(); build(); };
  init();
  onReset(() => { pz.reset(); init(); });
  buildFields([
    { id: "cols", label: "Columns", type: "int", value: cfg.cols, min: 2, max: 5, onChange: v => { cfg.cols = v; pz.reset(); init(); } },
    { id: "rows", label: "Rows", type: "int", value: cfg.rows, min: 2, max: 5, onChange: v => { cfg.rows = v; pz.reset(); init(); } },
    { id: "shuf", label: "Shuffle Move Count", type: "int", value: cfg.shuffle, min: 1, max: 400, onChange: v => { cfg.shuffle = v; pz.reset(); init(); logLine(`Barrejat amb ${v} moviments legals: sempre té solució`, "i"); } },
  ]);
  return () => w.dispose();
};

/* ── Throw ───────────────────────────────────────────────────────────────── */
Stages.mech.throw = (el) => {
  const w = createWorld(el, { fov: 55 });
  w.camera.position.set(0, 1.6, 4.5); w.camera.lookAt(0, 1.4, -3);
  floorRoom(w, 14);
  const wall = box(10, 4, 0.2, 0x3b372b); wall.position.set(0, 2, -4); w.scene.add(wall);
  const door = makeDoor(w, 3, -3.88);
  const cfg = { minSpeed: 3, force: 12 };
  const pz = puzzleCtl("ThrowPuzzle", door);
  const targets = [[-2, 1.4], [0, 2.4], [2, 1.2]].map(([x, y], i) => {
    const t2 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.08, 28), mat(0xb23b2b, { emissive: 0x220000 })); t2.rotation.x = Math.PI / 2; t2.position.set(x, y, -3.85); w.scene.add(t2);
    return { mesh: t2, id: "target" + (i + 1), hit: false };
  });
  const balls = [];

  targets.forEach(tg => w.clickable(tg.mesh, (h) => throwAt(null, h.point), false));
  w.clickable(wall, (h) => throwAt(null, h.point), false);
  function throwAt(ev, point) {
    let dir;
    if (point) dir = point.clone().sub(w.camera.position).normalize();
    else { const r = w.renderer.domElement.getBoundingClientRect(); const v = new THREE.Vector3(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1, 0.5).unproject(w.camera); dir = v.sub(w.camera.position).normalize(); }
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10), mat(0xdfcf9e)); ball.castShadow = true;
    ball.position.copy(w.camera.position).add(new THREE.Vector3(0.25, -0.3, 0)); w.scene.add(ball);
    const vel = dir.multiplyScalar(cfg.force).add(new THREE.Vector3(0, 2.2, 0));

  }

      if (b.ball.position.y < 0.12) { b.ball.position.y = 0.12; b.vel.y *= -0.4; b.vel.x *= 0.8; b.vel.z *= 0.8; }
      if (b.ball.position.z < -3.75 && !b.done) {
        b.done = true; const speed = b.vel.length();
        const tg = targets.find(t3 => t3.mesh.position.distanceTo(new THREE.Vector3(b.ball.position.x, b.ball.position.y, -3.85)) < 0.45);

          else if (!tg.hit && pz.state !== "Solved") { tg.hit = true; tg.mesh.material.color.setHex(0x3f9a4f); tg.mesh.material.emissive.setHex(0x0a3312); pz.progress(); logLine(`RegisterHit("${tg.id}") · ${targets.filter(x => x.hit).length}/3 · ${speed.toFixed(1)} m/s`); tone(700, 0.1); if (targets.every(x => x.hit)) { pz.solve(); targets.forEach(x => x.mesh.material.color.setHex(0x3fa8b8)); } }
        }
        b.vel.z *= -0.3;
      }
      if (b.life <= 0) { w.scene.remove(b.ball); b.ball.geometry.dispose(); balls.splice(i, 1); }
    }
  });
  onReset(() => { pz.reset(); targets.forEach(x => { x.hit = false; x.mesh.material.color.setHex(0xb23b2b); x.mesh.material.emissive.setHex(0x220000); }); });

    { id: "ids", label: "Target Ids", type: "text", value: "target1,target2,target3", onChange: () => { } },

    { id: "force", label: "Throw Force", type: "int", value: cfg.force, min: 3, max: 30, onChange: v => { cfg.force = v; } },
  ]);
  return () => w.dispose();
};

    return { id, mesh: s, ring, x, z, occupant: null, color: c };

  const paintRings = () => sockets.forEach(s => { const c = colorFor(s.id); s.ring.material.color.setHex(c); s.ring.material.emissive.setHex(c); });
  let drag = null; const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.25); const tmp = new THREE.Vector3();
  w.onDown = (ev) => { if (pz.state === "Solved") return; const p = w.pickAt(ev); if (p && p.obj.userData.piece) { drag = pieces.find(x => x.id === p.obj.userData.piece); if (drag.socket) { const s = sockets.find(x => x.id === drag.socket); s.occupant = null; logLine(`OnTriggerExit → Disconnect("${drag.id}")`); drag.socket = null; } } };
  w.onDrag = (ev) => { if (!drag) return false; const r = w.renderer.domElement.getBoundingClientRect(); const ndc = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1); w.ray.setFromCamera(ndc, w.camera); if (w.ray.ray.intersectPlane(floorPlane, tmp)) drag.mesh.position.set(tmp.x, 0.55, tmp.z); return true; };

  };
  paintRings();

    } },
  ]);
  return () => w.dispose();
};

      focus = nf; if (focus) focus.obj.traverse(m => m.material && m.material.emissive && m.material.emissive.setHex(0x4a3a14));
    }
    if (focus) { prompt.hidden = false; prompt.textContent = focus.prompt(); } else prompt.hidden = true;
  });

  return () => { window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); if (document.pointerLockElement === cv) document.exitPointerLock(); w.dispose(); };
};

render();
</script>
