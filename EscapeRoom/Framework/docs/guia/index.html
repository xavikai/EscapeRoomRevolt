a-li nom i pistes al puzle (recomanat)", "do": ["Segueix la recepta **Teclat de codi** de la secció *Receptes pas a pas*: crea una `Puzzle Definition` amb un `Persistent Id` únic (per exemple `sala1_teclat`), un nom i un objectiu, i tres pistes `Hint Data`.", "Arrossega la definició al camp `Definition` del component `Code Panel Puzzle`."], "see": "Durant el joc, la tecla [[H]] mostra les teves pistes i el HUD mostra l'objectiu.", "fix": ["Sense `Persistent Id`, el guardat no sap distingir aquest puzle d'un altre."]}]}, {"id": "G", "title": "Fes-ne un joc que es pugui compartir", "goal": "Que el menú principal porti a la teva sala i generar un programa .exe per a Windows.", "steps": [{"id": "g1", "title": "Afegeix la teva escena a la llista del joc", "do": ["Amb `Sala1` oberta, menú `File` > `Build Profiles`.", "A l'esquerra, clica `Scene List`.", "Clica `Add Open Scenes`. `Sala1` s'afegeix a la llista.", "Comprova que `MainMenu` també hi és i està marcat."], "see": "A la llista hi ha `Intro`, `MainMenu`, ... i a baix de tot `ElMeuJoc/Scenes/Sala1`, marcada.", "fix": ["Una escena que no és a la llista no es pot carregar des del menú i dona l'error `could not be loaded because it has not been added to the build settings`."]}, {"id": "g2", "title": "Fes que «Nova partida» porti a la teva sala", "do": ["A **Project**, ves a `Assets/_EscapeRoomTemplate/Resources` i clica `GameFlowSettings`.", "A l'Inspector, a `First Gameplay Scene`, escriu `Sala1` (el nom exacte, sense `.unity`)."], "see": "`First Gameplay Scene` = `Sala1` i `Main Menu Scene` = `MainMenu`.", "fix": ["Majúscules i minúscules compten: `sala1` no és el mateix que `Sala1`."]}, {"id": "g3", "title": "Prova el joc complet des del menú", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Main Menu` (desa la teva escena si t'ho demana).", "Prem **▶ Play** i clica `Nova partida` (o `Nueva partida` / `New Game`, segons l'idioma del joc)."], "see": "Apareix el menú principal i, en començar, arribes a la teva sala.", "fix": ["Si arribes al museu en lloc de la teva sala, revisa el pas G2."]}, {"id": "g4", "title": "Tria quines escenes porta el programa final", "do": ["A `Assets/_EscapeRoomTemplate/Resources`, clica `ProductConfiguration`.", "A `Desktop Scenes` hi ha la llista de camins d'escenes. Deixa `Intro.unity` i `MainMenu.unity`.", "Canvia la línia de `ShowcaseMuseum.unity` pel camí de la teva escena: `Assets/ElMeuJoc/Scenes/Sala1.unity`. Esborra la de `LockedOffice.unity` amb el botó `-`.", "Truc per no equivocar-te: a Project, clic dret a `Sala1` > `Copy Path`, i enganxa-ho amb [[Ctrl]] + [[V]]."], "see": "`Desktop Scenes` té 3 línies: Intro, MainMenu i la teva Sala1.", "fix": ["Un camí mal escrit fa fallar la build. Copia'l amb `Copy Path` en lloc d'escriure'l."]}, {"id": "g5", "title": "Genera el joc per a Windows", "do": ["Desa ([[Ctrl]] + [[S]]).", "Menú `Escape Room Framework` > `Build` > `Release` > `Build Windows`.", "Espera. La primera vegada pot trigar de 5 a 15 minuts. Unity queda bloquejat mentre construeix.", "Quan acabi, a la Console surt un missatge `[Release Build] Windows PASS`."], "see": "A la carpeta del teu projecte hi ha `Builds/Release/v0.1.0-beta.5/Windows/` amb `escaperoom-revolt.exe` i altres fitxers i carpetes. Fes-hi doble clic: el teu joc s'obre sense Unity.", "fix": ["Si surt un error en vermell a la Console, fes-hi clic, copia el text i ensenya'l al professor.", "El nom de la carpeta `v0.1.0-beta.5` és històric. No vol dir res del teu joc."]}, {"id": "g6", "title": "Comparteix-lo", "do": ["Clic dret a la carpeta `Windows` (la que conté l'.exe) > `Envia a` > `Carpeta comprimida (zip)`.", "Comparteix aquest ZIP. Qui el rebi l'ha d'extreure **tot** i executar l'.exe."], "see": "Un ZIP que funciona en qualsevol PC amb Windows de 64 bits, sense instal·lar Unity.", "fix": ["No enviïs només l'.exe: necessita la carpeta `escaperoom-revolt_Data`, `UnityPlayer.dll` i la resta de fitxers del costat."]}]}], "editor": [{"id": "toolbar", "name": "Barra superior i Play", "text": "A dalt hi ha els menús (`File`, `Edit`, `GameObject`... i `Escape Room Framework`, el de la plantilla). Al mig hi ha **▶ Play** (provar el joc), **Pausa** i **Pas a pas**. Quan Play està actiu, el que canvies es perd en aturar-lo."}, {"id": "hierarchy", "name": "Hierarchy", "text": "La llista de **tot el que hi ha a l'escena oberta**: terra, parets, jugador, puzles. Els objectes es poden posar un dins d'un altre (fletxeta) per agrupar-los. Clicar aquí és la manera més fàcil de seleccionar."}, {"id": "scene", "name": "Scene", "text": "On **construeixes** el nivell. Pots moure't lliurement (botó dret + WASD) i moure objectes amb les fletxes de colors. El jugador no veu aquesta vista."}, {"id": "game", "name": "Game", "text": "El que **veu el jugador** a través de la seva càmera. Quan prems Play, hi jugues aquí. Clica-hi per capturar el ratolí."}, {"id": "inspector", "name": "Inspector", "text": "Les **propietats de l'objecte seleccionat**, agrupades en components: `Transform` (posició, rotació, escala), i després els de la plantilla com `Door` o `Code Panel Puzzle`. Aquí és on configures el codi, si la porta està tancada, el text d'una nota..."}, {"id": "project", "name": "Project", "text": "Els **fitxers** del projecte (com l'Explorador de Windows): escenes, materials, models, sons. La plantilla és a `_EscapeRoomTemplate`; el teu treball va a la teva carpeta."}, {"id": "console", "name": "Console", "text": "**Missatges i errors**. Blanc = informació, groc = avís, vermell = error. Si alguna cosa no funciona, mira primer aquí. Fes clic a un missatge per veure'n el detall."}], "glossary": [{"t": "Projecte", "d": "La carpeta amb tot el teu joc (`Assets`, `Packages`, `ProjectSettings`). S'obre des de Unity Hub."}, {"t": "Escena", "d": "Un nivell o una pantalla del joc (un fitxer `.unity`). El menú és una escena; cada sala pot ser una escena."}, {"t": "GameObject", "d": "Qualsevol cosa que hi ha a l'escena: una paret, una llum, el jugador, una porta. Sol no fa res."}, {"t": "Component", "d": "Una peça que dona comportament a un GameObject: `Transform` (on és), `Mesh Renderer` (com es veu), `Box Collider` (amb què xoca), `Door` (porta)."}, {"t": "Transform", "d": "El component que tenen tots els objectes: `Position` (on és, en metres), `Rotation` (graus) i `Scale` (mida). Y és l'alçada."}, {"t": "Collider", "d": "La forma invisible amb què un objecte xoca. Sense collider, el jugador el travessa."}, {"t": "Material", "d": "Com es veu una superfície: color, textura, brillantor."}, {"t": "Asset", "d": "Qualsevol fitxer del projecte: una escena, un material, un so, un model 3D, un ScriptableObject."}, {"t": "Prefab", "d": "Un objecte preparat i desat per reutilitzar-lo. `Player_PC` i `GameManager` són prefabs."}, {"t": "ScriptableObject", "d": "Un fitxer de dades que configures a l'Inspector: definicions de puzles, pistes, objectes d'inventari."}, {"t": "Play mode", "d": "Quan el joc s'està executant dins de Unity. Els canvis fets en Play mode es perden."}, {"t": "Build", "d": "Convertir el projecte en un programa (`.exe`) que funciona sense Unity."}], "keys": [["Ctrl+S", "Desar l'escena"], ["Ctrl+Z / Ctrl+Y", "Desfer / refer"], ["Ctrl+D", "Duplicar l'objecte seleccionat"], ["F2", "Canviar el nom"], ["F", "Centrar la vista en l'objecte seleccionat"], ["W / E / R", "Moure / girar / escalar"], ["Botó dret + WASD", "Volar per la vista Scene"], ["Ctrl+P", "Play / aturar"], ["Supr", "Esborrar l'objecte seleccionat"]], "faq": [{"q": "Tot es veu de color rosa.", "a": "Són materials que no són d'URP. Crea'ls de nou amb `Create` > `Material`. Si és tot el projecte, has obert una versió de Unity diferent de la `6000.4.9f1`."}, {"q": "He fet molts canvis i en aturar el Play han desaparegut.", "a": "Els canvis fets amb el Play actiu no es guarden mai. Atura el Play abans d'editar. Truc: `Edit` > `Preferences` > `Colors` > `Playmode tint` per posar un color fort que t'avisi."}, {"q": "No em puc moure quan jugo.", "a": "Clica dins la vista Game. Si hi ha un panell obert (inventari, nota, teclat), tanca'l amb [[Esc]]. Comprova que hi ha `Player_PC` a l'escena."}, {"q": "La Console està plena d'errors vermells.", "a": "Clica el botó `Clear` de la Console i torna a provar. Si continuen, fes clic al primer, copia el text i ensenya'l al professor. Sovint els següents errors són conseqüència del primer."}, {"q": "He tancat una finestra i no la trobo.", "a": "`Window` > `Layouts` > `Default` ho torna tot al seu lloc. Les finestres soltes són a `Window` > `General`."}, {"q": "Un objecte no reacciona a la tecla E.", "a": "S'ha de crear amb el menú `Escape Room Framework` > `Create`. A més, el jugador ha d'estar a prop i apuntant-hi."}, {"q": "Unity em demana actualitzar el projecte o canviar de versió.", "a": "No acceptis. Tanca'l i obre'l amb la `6000.4.9f1` des de Unity Hub."}, {"q": "Quan prem «Nova partida» surt un error de que l'escena no està afegida.", "a": "Falta el pas G1: afegeix la teva escena a `File` > `Build Profiles` > `Scene List`."}, {"q": "El projecte va molt lent o dona errors estranys de fitxers.", "a": "Comprova que no és dins d'una carpeta sincronitzada (OneDrive, Google Drive) ni en un llapis USB. Mou-lo a `C:\\Unity`."}]}, "es": {"nav": "Crear el proyecto desde cero", "eyebrow": "Expediente 00 · Desde cero", "title": "De la nada a tu primer escape room", "lead": "Esta sección es para quien nunca ha abierto Unity. Siguiendo los pasos en orden, instalarás Unity, abrirás el proyecto, crearás una sala tuya con una puerta cerrada y un teclado que la abre, y la convertirás en un juego que se ejecuta en cualquier PC con Windows. Cada paso dice qué tienes que hacer, qué deberías ver y qué hacer si no lo ves.", "howto_t": "Cómo usar esta página", "howto": ["Haz los pasos **en orden**. Cada paso usa lo que has hecho antes.", "Marca la casilla de cada paso cuando lo termines. La página recuerda tu progreso en este navegador.", "Si algo no sale como dice el paso, mira el recuadro **Si no funciona** antes de continuar.", "El texto en `este formato` es exactamente lo que verás en la pantalla (menús, botones, campos). Las teclas se muestran así: [[Ctrl]] + [[S]].", "La sala 3D de la derecha se va construyendo a medida que avanzas: te muestra cómo debería quedar tu escena."], "time_t": "Cuánto tiempo hace falta", "time": "Instalación: 45-90 minutos (sobre todo esperar descargas). Abrir el proyecto la primera vez: 10-20 minutos. Crear la sala y el primer puzle: 1-2 horas.", "progress": "Progreso", "of": "de", "steps_done": "pasos hechos", "reset": "Borrar el progreso", "reset_confirm": "¿Seguro que quieres desmarcar todos los pasos?", "do": "Qué tienes que hacer", "see": "Qué deberías ver", "fix": "Si no funciona", "tip": "Truco", "show3d": "Muéstralo en la sala 3D", "stage_t": "Tu sala, paso a paso", "stage_hint": "Arrastra para girar · rueda para acercar", "stage_now": "Ahora se ve", "stage_empty": "Todavía no has creado nada en tu escena. Empieza la fase E.", "editor_t": "El editor de Unity: haz clic en cada zona", "editor_lead": "Así es la pantalla de Unity con la disposición por defecto. Haz clic en cada zona para saber para qué sirve.", "editor_pick": "Haz clic en una zona del editor.", "glossary_t": "Palabras de Unity que tienes que conocer", "keys_t": "Atajos que usarás siempre", "faq_t": "Problemas frecuentes", "next_t": "¿Y ahora qué?", "next": "Ya tienes una sala que funciona. A partir de aquí: mira el **Laboratorio de mecánicas** para elegir más puzles, sigue las **Recetas paso a paso** para añadirlos y el **Taller de menús** para cambiar el aspecto del menú.", "phases": [{"id": "A", "title": "Prepara el ordenador", "goal": "Tener Unity Hub y la versión exacta de Unity instaladas. Lo haces una sola vez por ordenador.", "steps": [{"id": "a1", "title": "Comprueba que el ordenador es adecuado", "do": ["Windows 10 u 11 de 64 bits.", "Mínimo 8 GB de memoria RAM (16 GB va mucho mejor).", "Unos 25 GB libres en el disco: Unity ocupa unos 10 GB y el proyecto unos 5 GB una vez abierto.", "Conexión a internet para descargar Unity.", "Un ratón con rueda: Unity se usa mucho mejor con ratón que con el panel táctil del portátil."], "see": "Para ver la memoria y el disco: [[Win]] + [[E]], clic en `Este equipo`. Verás el espacio libre de cada disco.", "fix": ["Si tienes poco espacio, vacía la Papelera y borra las descargas antiguas antes de empezar."]}, {"id": "a2", "title": "Instala Unity Hub", "do": ["Abre el navegador y ve a `unity.com/download`.", "Haz clic en el botón de descarga para Windows. Se descarga un archivo `UnityHubSetup.exe`.", "Abre el archivo descargado. Si Windows pregunta si quieres permitir cambios, haz clic en `Sí`.", "Acepta la licencia y deja la carpeta que propone. Haz clic en `Instalar` y, cuando acabe, en `Finalizar`."], "see": "Se abre la ventana de **Unity Hub**. Es el programa que gestiona las versiones de Unity y tus proyectos. No es Unity: es la \"puerta de entrada\".", "fix": ["Si el antivirus o el ordenador del centro no te deja instalar, pídeselo al profesor o al administrador."]}, {"id": "a3", "title": "Inicia sesión y activa la licencia gratuita", "do": ["En Unity Hub, haz clic en `Sign in` y entra con tu cuenta de Unity. Si no tienes, haz clic en `Create account` y créate una con tu correo (es gratis).", "Cuando el Hub pida una licencia, elige la **Personal** (gratuita).", "Si no te lo pide: icono de engranaje `Preferences` > `Licenses` > `Add` > `Get a free personal license`."], "see": "Arriba a la izquierda del Hub aparece tu inicial o tu foto. En `Preferences` > `Licenses` hay una licencia **Personal** activa.", "fix": ["Si el correo de confirmación no llega, mira la carpeta de correo no deseado (spam).", "Sin licencia activa, Unity no abre ningún proyecto."]}, {"id": "a4", "title": "Instala Unity 6000.4.9f1 (esta versión exacta)", "do": ["La versión tiene que ser **exactamente** `6000.4.9f1`. Con otra, el proyecto se puede romper.", "En el Hub, ve a `Installs` > `Install Editor`.", "Si la versión `6000.4.9f1` sale en la lista, haz clic en `Install` a su lado.", "Si no sale, ve a la pestaña `Archive` > `download archive`. Se abre una web: busca `6000.4.9f1` y haz clic en `Install`. El Hub se abrirá solo con esta versión.", "En la lista de módulos, marca **Microsoft Visual Studio Community** si no lo tienes (sirve para ver el código). Marca **Android Build Support** solo si vas a hacer VR para Meta Quest.", "Haz clic en `Install` y espera. Son unos 10 GB y puede tardar de 20 minutos a 1 hora."], "see": "En `Installs` aparece `Unity 6000.4.9f1` sin ninguna barra de progreso.", "fix": ["Si la descarga se detiene, haz clic en el icono de pausa/continuar o vuelve a intentarlo.", "También hay un atajo: si en el paso B4 añades el proyecto y todavía no tienes la versión, el Hub muestra un botón para instalarla directamente."], "tip": "Puedes continuar con la fase B mientras se instala."}]}, {"id": "B", "title": "Consigue el proyecto y ábrelo", "goal": "Tener el proyecto Escape Room en el ordenador y abierto en Unity.", "steps": [{"id": "b1", "title": "Descarga el proyecto", "do": ["Ve a la página de GitHub del proyecto que te ha pasado el profesor.", "A la derecha, en `Releases`, haz clic en la versión más nueva (`Escape Room Revolt 0.2.0` o posterior).", "Abajo, en `Assets`, descarga **`EscapeRoom-0.2.0-pcfix-2026-10-26-delivery.zip`** (el proyecto Unity).", "Si quieres jugar la demo sin Unity, descarga también el ZIP `...-windows.zip`."], "see": "En la carpeta `Descargas` tienes un archivo ZIP de unos 10 MB.", "fix": ["No descargues `Source code (zip)`: es todo el repositorio y es más difícil de abrir. Usa el ZIP `delivery`."]}, {"id": "b2", "title": "Descomprímelo en una carpeta corta", "do": ["Crea una carpeta corta, por ejemplo `C:\\Unity`.", "Clic derecho en el ZIP > `Extraer todo...` > `Examinar` > elige `C:\\Unity` > `Extraer`.", "Entra en la carpeta extraída. Verás `Project`, `docs`, `README.md` y `FILES.sha256.json`.", "Cambia el nombre de la carpeta `Project` por el nombre de tu juego, sin tildes ni espacios. Por ejemplo `EscapeRoom_JuanGarcia`."], "see": "Dentro de la carpeta de tu juego están las carpetas `Assets`, `Packages` y `ProjectSettings`. Eso quiere decir que es una carpeta de proyecto Unity.", "fix": ["No trabajes nunca desde dentro del ZIP (haciendo doble clic en el ZIP sin extraerlo).", "Evita el Escritorio si está sincronizado con OneDrive: el proyecto va lento y puede dar errores.", "Evita rutas largas o con tildes (`C:\\Users\\Núria\\Documents\\...`)."]}, {"id": "b3", "title": "Añade el proyecto a Unity Hub", "do": ["En el Hub, ve a `Projects`.", "Haz clic en la flecha del botón `Add` > `Add project from disk`.", "Selecciona la carpeta de tu juego (la que contiene `Assets`, `Packages` y `ProjectSettings`) y haz clic en `Seleccionar carpeta`."], "see": "El proyecto aparece en la lista con la versión `6000.4.9f1` al lado.", "fix": ["Si sale un aviso amarillo de versión que falta, haz clic en él e instala la `6000.4.9f1` (paso A4).", "Si el Hub dice que la carpeta no es un proyecto válido, has seleccionado una carpeta de más arriba o de más abajo. Tiene que ser la que contiene `Assets`."]}, {"id": "b4", "title": "Ábrelo por primera vez (y espera)", "do": ["Haz clic en el nombre del proyecto en la lista.", "La primera vez Unity importa todo el proyecto. Puede tardar **de 10 a 20 minutos**. No cierres la ventana aunque parezca parada.", "Si Unity pregunta si quieres cambiar de versión (`Change Editor version` o `Upgrade`), **no aceptes**: cierra y ábrelo con la `6000.4.9f1`."], "see": "Se abre el editor de Unity con varias ventanas. Arriba está el menú `File  Edit  Assets  GameObject  Component  Escape Room Framework  ...`. Si ves `Escape Room Framework`, el proyecto se ha cargado bien.", "fix": ["Si sale el diálogo **Safe Mode**: hay errores de código. Haz clic en `Enter Safe Mode`, mira la ventana `Console` y avisa al profesor con una captura.", "Si no ves el menú `Escape Room Framework`, espera a que termine la barra de progreso de abajo a la derecha.", "La próxima vez que abras el proyecto tardará menos de un minuto."]}]}, {"id": "C", "title": "Conoce el editor de Unity", "goal": "Saber qué es cada ventana y moverte por la escena sin perderte.", "steps": [{"id": "c1", "title": "Las seis ventanas que usarás", "do": ["Usa la maqueta interactiva de abajo: haz clic en cada zona para saber qué hace.", "Busca las mismas zonas en tu Unity."], "see": "Identificas **Hierarchy** (la lista de lo que hay en la escena), **Scene** (donde construyes), **Game** (lo que ve el jugador), **Inspector** (las propiedades del objeto seleccionado), **Project** (los archivos) y **Console** (mensajes y errores).", "fix": ["Si has cerrado o movido ventanas sin querer: `Window` > `Layouts` > `Default`. Vuelve a poner todo en su sitio."], "editor": true}, {"id": "c2", "title": "Moverte por la vista Scene", "do": ["Pon el ratón sobre la vista **Scene**.", "Mantén pulsado el **botón derecho** del ratón y usa [[W]] [[A]] [[S]] [[D]] para volar como en un videojuego. [[Q]] y [[E]] bajan y suben.", "La **rueda** acerca y aleja. Haciendo clic con la rueda y arrastrando desplazas la vista.", "[[Alt]] + botón izquierdo y arrastrar: gira alrededor de lo que miras.", "Haz doble clic en un objeto de la **Hierarchy** (o selecciónalo y pulsa [[F]]) para centrarlo en la vista."], "see": "Puedes acercarte a cualquier sitio y volver a encontrar un objeto con [[F]].", "fix": ["Si te pierdes del todo: selecciona un objeto en la Hierarchy y pulsa [[F]]."]}, {"id": "c3", "title": "Seleccionar, mover, girar y escalar objetos", "do": ["Haz clic en un objeto en la Scene o en la Hierarchy para seleccionarlo.", "Herramientas (también en la barra de la izquierda de la Scene): [[W]] mover, [[E]] girar, [[R]] escalar. Arrastra las flechas de colores: roja = X, verde = Y (arriba), azul = Z.", "Para poner valores exactos, escríbelos en el **Inspector** > `Transform` > `Position`, `Rotation` y `Scale`.", "¿Te has equivocado? [[Ctrl]] + [[Z]] deshace."], "see": "Cuando cambias un número del `Transform`, el objeto se mueve en la Scene.", "fix": ["Si las teclas W/E/R no hacen nada, primero haz clic dentro de la vista Scene para que tenga el foco."]}]}, {"id": "D", "title": "Juega la demo del museo", "goal": "Ver cómo funciona un escape room hecho con la plantilla antes de hacer el tuyo.", "steps": [{"id": "d1", "title": "Abre la escena del museo", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Showcase Museum`.", "Si pregunta si quieres guardar los cambios de la escena actual, haz clic en `Don't Save`."], "see": "En la Hierarchy sale `ShowcaseMuseum` y en la Scene ves un pasillo con salas.", "fix": ["Si no sale el menú `Escape Room Framework`, vuelve al paso B4."]}, {"id": "d2", "title": "Pulsa Play y juega", "do": ["Haz clic en el botón **▶ Play** de arriba en el centro.", "Haz clic dentro de la vista **Game** para que el juego capture el ratón.", "Muévete con [[W]] [[A]] [[S]] [[D]] y el ratón. [[E]] para interactuar, [[I]] inventario, [[H]] pista, [[Esc]] cerrar un panel o pausa.", "Para detener el juego, vuelve a hacer clic en **▶ Play**."], "see": "Mientras juegas, el botón Play se queda azul y la ventana Game muestra el juego.", "fix": ["**Muy importante:** todo lo que cambies en el Inspector **mientras el Play está activo se pierde** al detenerlo. Primero detén el Play, después edita.", "Si el ratón no mueve la cámara, haz clic dentro de la vista Game.", "Para recuperar el cursor durante el juego, pulsa [[Esc]]."]}, {"id": "d3", "title": "Resuelve el teclado y prueba el guardado", "do": ["Camina hasta la **sala 2**. Apunta al teclado y pulsa [[E]]: se abre un teclado en la pantalla.", "Busca la pista de la sala, escribe el código y mira cómo se abre la puerta.", "Pulsa [[F5]] para guardar, haz algo más y pulsa [[F9]] para cargar."], "see": "La luz del teclado se pone verde y la puerta se abre. Al cargar, todo vuelve a estar como cuando guardaste.", "fix": ["Si te quedas atascado, pulsa [[H]] para pedir una pista."], "tip": "Cada sala del museo enseña una mecánica diferente. En la sección **Visita** de esta guía está el mapa del museo."}]}, {"id": "E", "title": "Crea tu sala", "goal": "Una habitación vacía donde el jugador puede caminar. Es la base de todo tu juego.", "steps": [{"id": "e1", "title": "Crea tu carpeta", "do": ["Detén el Play si está activo.", "En la ventana **Project**, haz clic en `Assets`.", "Clic derecho en el espacio vacío de la derecha > `Create` > `Folder`. Ponle el nombre `MiJuego` y pulsa [[Enter]].", "Entra en `MiJuego` y crea dentro dos carpetas más: `Scenes` y `Materials`."], "see": "En `Assets` están `_EscapeRoomTemplate` (la plantilla) y `MiJuego` (la tuya).", "fix": ["**No guardes nunca nada dentro de `_EscapeRoomTemplate`** ni modifiques las escenas del museo. Si quieres cambiar algo del museo, duplica la escena en tu carpeta."]}, {"id": "e2", "title": "Crea y guarda una escena nueva", "do": ["Menú `File` > `New Scene`.", "Elige la plantilla **`Basic (URP)`** y haz clic en `Create`.", "Menú `File` > `Save As...`. Ve a `Assets/MiJuego/Scenes`, pon el nombre `Sala1` y guarda.", "A partir de ahora, guarda a menudo con [[Ctrl]] + [[S]]."], "see": "En la Hierarchy sale `Sala1` con dos objetos: `Main Camera` y `Directional Light`. La Scene está vacía, con el cielo de fondo.", "fix": ["Si no ves `Basic (URP)`, elige la plantilla básica que salga (cualquiera que tenga cámara y luz).", "Si en la pestaña de la escena hay un asterisco (`Sala1*`), quiere decir que hay cambios sin guardar."], "stage": "empty"}, {"id": "e3", "title": "Ponle un suelo", "do": ["Menú `GameObject` > `3D Object` > `Plane`.", "Con el `Plane` seleccionado, en el **Inspector** > `Transform`: `Position` 0, 0, 0 y `Scale` 2, 1, 2.", "Cámbiale el nombre: selecciónalo en la Hierarchy, pulsa [[F2]], escribe `Suelo` y pulsa [[Enter]]."], "see": "Un suelo gris cuadrado de 20 × 20 metros (un `Plane` mide 10 m y lo has escalado × 2).", "fix": ["Si no lo ves, haz doble clic en `Suelo` en la Hierarchy para centrarlo en la vista."], "stage": "floor"}, {"id": "e4", "title": "Levanta las cuatro paredes", "do": ["Menú `GameObject` > `3D Object` > `Cube`. Llámalo `Pared_Norte`.", "`Position` 0, 1.5, 10 · `Rotation` 0, 0, 0 · `Scale` 20, 3, 0.2.", "Con la pared seleccionada, pulsa [[Ctrl]] + [[D]] para duplicarla. Llámala `Pared_Sur` y pon `Position` 0, 1.5, -10.", "Duplícala otra vez: `Pared_Este`, `Position` 10, 1.5, 0 y `Rotation` 0, 90, 0.", "Y la última: `Pared_Oeste`, `Position` -10, 1.5, 0 y `Rotation` 0, 90, 0.", "Para ordenar: `GameObject` > `Create Empty`, llámalo `Paredes` y arrastra las cuatro paredes encima de él en la Hierarchy."], "see": "Una habitación cerrada de 20 × 20 m con paredes de 3 m de alto.", "fix": ["Si una pared queda hundida o flotando, revisa que `Position Y` sea 1.5 (la mitad de la altura, 3).", "Si las paredes quedan en cruz, revisa la `Rotation Y` de las paredes este y oeste (tiene que ser 90)."], "stage": "walls"}, {"id": "e5", "title": "Da color a las paredes", "do": ["En **Project**, ve a `Assets/MiJuego/Materials`. Clic derecho > `Create` > `Material`. Llámalo `MatPared`.", "Con el material seleccionado, en el Inspector haz clic en el recuadro de color al lado de `Base Map` y elige un color.", "Arrastra el material desde Project hasta cada pared en la vista Scene (o hasta su nombre en la Hierarchy).", "Haz otro material `MatSuelo` para el suelo."], "see": "Las paredes y el suelo tienen los colores que has elegido.", "fix": ["Si el objeto se ve **rosa**, el material no es de URP. Créalo de nuevo con `Create` > `Material` (Unity lo hace con el shader correcto, `Universal Render Pipeline/Lit`)."], "stage": "color"}, {"id": "e6", "title": "Añade el Game Manager", "do": ["Menú `Escape Room Framework` > `Setup` > `Instantiate Game Manager`."], "see": "En la Hierarchy aparece `GameManager`. Contiene todos los sistemas del juego: guardar y cargar, inventario, pistas, la interfaz (HUD) y el menú de pausa. Sin él, nada de la plantilla funciona.", "fix": ["Si vuelve a seleccionarlo en lugar de crear otro, es que ya había uno: correcto, solo tiene que haber uno."], "stage": "manager"}, {"id": "e7", "title": "Añade el jugador", "do": ["Menú `Escape Room Framework` > `Setup` > `Instantiate PC Player`. Aparece `Player_PC`.", "Ponlo en `Position` 0, 0, -7 y `Rotation` 0, 0, 0. Así mira hacia la pared norte.", "**Borra la cámara que venía con la escena**: en la Hierarchy, haz clic en `Main Camera` (la que está sola, en el primer nivel, **no** la que está dentro de `Player_PC`) y pulsa [[Supr]]. El jugador ya lleva su propia cámara."], "see": "Un jugador dentro de la habitación. En la Hierarchy, si abres la flecha de `Player_PC`, hay una `Main Camera` dentro.", "fix": ["Si en la Console sale `There are 2 audio listeners in the scene`, no has borrado la cámara de la escena.", "Si has borrado la cámara del jugador sin querer: [[Ctrl]] + [[Z]]."], "stage": "player"}, {"id": "e8", "title": "Pruébalo", "do": ["Guarda con [[Ctrl]] + [[S]].", "Pulsa **▶ Play**, haz clic en la vista Game y camina por la habitación.", "Detén el Play."], "see": "Caminas por tu sala, chocas con las paredes y ves el HUD de la plantilla.", "fix": ["**Caes al vacío:** el suelo no tiene colisión. Selecciona `Suelo` y comprueba que tiene el componente `Mesh Collider`.", "**`No cameras rendering`:** no hay jugador o has borrado su cámara.", "**No te puedes mover:** haz clic dentro de la vista Game; si hay un panel abierto, pulsa [[Esc]].", "**Empiezas dentro de una pared:** revisa la `Position` del jugador."], "stage": "player"}]}, {"id": "F", "title": "El primer puzle: un teclado que abre la puerta", "goal": "El jugador encuentra una nota con el código, lo escribe en el teclado y la puerta se abre.", "steps": [{"id": "f1", "title": "Pon una puerta cerrada con llave", "do": ["Menú `Escape Room Framework` > `Create` > `Interactables` > `Door`. Aparece `NewDoor_Logic` en el centro de la vista Scene.", "Cámbiale el nombre a `PuertaSalida`.", "`Position` 0, 1.25, 9.8 (delante de la pared norte, tocando el suelo).", "En el Inspector, en el componente `Door` > `Door Settings`, marca **`Is Locked`**."], "see": "Una puerta naranja delante de la pared norte. Con `Is Locked` marcado, el jugador no la puede abrir con [[E]].", "fix": ["Crea siempre los objetos interactivos desde el menú `Escape Room Framework`. Un cubo normal no reacciona a la tecla E.", "Si la puerta queda dentro de la pared, baja un poco la `Position Z` (por ejemplo 9.6)."], "stage": "door"}, {"id": "f2", "title": "Pon un teclado al lado", "do": ["Menú `Escape Room Framework` > `Create` > `Puzzles` > `Keypad Panel`. Aparece `NewKeypad_Logic` con 11 botones (1-9, C y 0) y una pantalla.", "Llámalo `TecladoPuerta`.", "`Position` 2, 1.4, 9.8.", "Pon `Rotation` 0, 180, 0. Los botones quedan hacia dentro de la habitación, donde está el jugador."], "see": "Un teclado a la altura de los ojos, a la derecha de la puerta, con los botones hacia el jugador.", "fix": ["Mueve solo el objeto principal (`TecladoPuerta`), nunca los botones uno por uno.", "Si desde el jugador ves la parte de atrás del teclado (sin botones), cambia `Rotation Y` a 0."], "stage": "keypad"}, {"id": "f3", "title": "Elige el código", "do": ["Selecciona `TecladoPuerta`. En el Inspector, busca el componente `Code Panel Puzzle`.", "En `Correct Code` escribe el código que quieras, por ejemplo `2580`.", "En `Max Code Length` pon el número de cifras del código (4).", "Deja marcado `Auto Check When Full`: se comprueba solo cuando se escribe la cuarta cifra."], "see": "`Correct Code` = `2580` y `Max Code Length` = `4`.", "fix": ["Si `Max Code Length` no coincide con las cifras del código, el teclado no lo comprobará nunca."], "stage": "keypad"}, {"id": "f4", "title": "Conecta el teclado con la puerta", "do": ["En la Hierarchy, haz clic en `TecladoPuerta`.", "Mantén [[Ctrl]] y haz clic en `PuertaSalida`. Ahora tienes los dos seleccionados.", "Menú `Escape Room Framework` > `Create` > `Puzzles` > `Link Selected Objects To Puzzle`."], "see": "Selecciona `TecladoPuerta` y baja en el Inspector hasta el evento `On Solved ()`. Hay dos líneas con `PuertaSalida`: `Door.Unlock` (quita la cerradura) y `Door.ForceOpen` (abre la puerta).", "fix": ["Si `On Solved ()` está vacío, vuelve a seleccionar los dos objetos (el teclado **primero**) y repite el menú.", "No borres estas líneas: son el \"cableado\" entre el puzle y la puerta."], "stage": "link"}, {"id": "f5", "title": "Esconde la pista en una nota", "do": ["Menú `Escape Room Framework` > `Create` > `Interactables` > `Note`. Llámala `NotaCodigo`.", "`Position` -6, 0.03, -2 (en el suelo, a la izquierda del jugador).", "En el Inspector, en `Note Content`, escribe la pista. Por ejemplo: `La combinación es la columna del medio del teclado, de arriba abajo.` (2-5-8-0)."], "see": "Una hoja blanca en el suelo.", "fix": ["Si la nota queda dentro del suelo, súbela un poco (`Position Y` 0.05)."], "tip": "Una buena pista hace pensar, pero no da la respuesta directamente.", "stage": "note"}, {"id": "f6", "title": "Juega tu puzle", "do": ["Guarda ([[Ctrl]] + [[S]]) y pulsa **▶ Play**.", "Ve a la nota, mírala y pulsa [[E]] para leerla.", "Ve al teclado, pulsa [[E]] y escribe el código.", "Prueba también un código incorrecto."], "see": "Con el código incorrecto, la luz roja parpadea y se borra. Con el correcto, la luz se pone verde y la puerta se abre sola.", "fix": ["**La puerta no se abre:** revisa el paso F4 (`On Solved ()` con dos líneas).", "**El teclado no reacciona a la E:** el jugador tiene que estar cerca y apuntándolo. Si nunca reacciona, lo has creado sin el menú de la plantilla.", "**La puerta se abre hacia dentro de la pared:** gírala 180° (`Rotation Y`)."], "stage": "solved"}, {"id": "f7", "title": "Dale nombre y pistas al puzle (recomendado)", "do": ["Sigue la receta **Teclado de código** de la sección *Recetas paso a paso*: crea una `Puzzle Definition` con un `Persistent Id` único (por ejemplo `sala1_teclado`), un nombre y un objetivo, y tres pistas `Hint Data`.", "Arrastra la definición al campo `Definition` del componente `Code Panel Puzzle`."], "see": "Durante el juego, la tecla [[H]] muestra tus pistas y el HUD muestra el objetivo.", "fix": ["Sin `Persistent Id`, el guardado no sabe distinguir este puzle de otro."]}]}, {"id": "G", "title": "Conviértelo en un juego que se pueda compartir", "goal": "Que el menú principal lleve a tu sala y generar un programa .exe para Windows.", "steps": [{"id": "g1", "title": "Añade tu escena a la lista del juego", "do": ["Con `Sala1` abierta, menú `File` > `Build Profiles`.", "A la izquierda, haz clic en `Scene List`.", "Haz clic en `Add Open Scenes`. `Sala1` se añade a la lista.", "Comprueba que `MainMenu` también está y está marcado."], "see": "En la lista están `Intro`, `MainMenu`, ... y abajo del todo `MiJuego/Scenes/Sala1`, marcada.", "fix": ["Una escena que no está en la lista no se puede cargar desde el menú y da el error `could not be loaded because it has not been added to the build settings`."]}, {"id": "g2", "title": "Haz que «Nueva partida» lleve a tu sala", "do": ["En **Project**, ve a `Assets/_EscapeRoomTemplate/Resources` y haz clic en `GameFlowSettings`.", "En el Inspector, en `First Gameplay Scene`, escribe `Sala1` (el nombre exacto, sin `.unity`)."], "see": "`First Gameplay Scene` = `Sala1` y `Main Menu Scene` = `MainMenu`.", "fix": ["Las mayúsculas y minúsculas cuentan: `sala1` no es lo mismo que `Sala1`."]}, {"id": "g3", "title": "Prueba el juego completo desde el menú", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Main Menu` (guarda tu escena si te lo pide).", "Pulsa **▶ Play** y haz clic en `Nueva partida` (o `Nova partida` / `New Game`, según el idioma del juego)."], "see": "Aparece el menú principal y, al empezar, llegas a tu sala.", "fix": ["Si llegas al museo en lugar de a tu sala, revisa el paso G2."]}, {"id": "g4", "title": "Elige qué escenas lleva el programa final", "do": ["En `Assets/_EscapeRoomTemplate/Resources`, haz clic en `ProductConfiguration`.", "En `Desktop Scenes` está la lista de rutas de escenas. Deja `Intro.unity` y `MainMenu.unity`.", "Cambia la línea de `ShowcaseMuseum.unity` por la ruta de tu escena: `Assets/MiJuego/Scenes/Sala1.unity`. Borra la de `LockedOffice.unity` con el botón `-`.", "Truco para no equivocarte: en Project, clic derecho en `Sala1` > `Copy Path`, y pégalo con [[Ctrl]] + [[V]]."], "see": "`Desktop Scenes` tiene 3 líneas: Intro, MainMenu y tu Sala1.", "fix": ["Una ruta mal escrita hace fallar la build. Cópiala con `Copy Path` en lugar de escribirla."]}, {"id": "g5", "title": "Genera el juego para Windows", "do": ["Guarda ([[Ctrl]] + [[S]]).", "Menú `Escape Room Framework` > `Build` > `Release` > `Build Windows`.", "Espera. La primera vez puede tardar de 5 a 15 minutos. Unity se queda bloqueado mientras construye.", "Cuando termine, en la Console sale un mensaje `[Release Build] Windows PASS`."], "see": "En la carpeta de tu proyecto está `Builds/Release/v0.1.0-beta.5/Windows/` con `escaperoom-revolt.exe` y otros archivos y carpetas. Haz doble clic en él: tu juego se abre sin Unity.", "fix": ["Si sale un error en rojo en la Console, haz clic en él, copia el texto y enséñaselo al profesor.", "El nombre de la carpeta `v0.1.0-beta.5` es histórico. No dice nada de tu juego."]}, {"id": "g6", "title": "Compártelo", "do": ["Clic derecho en la carpeta `Windows` (la que contiene el .exe) > `Enviar a` > `Carpeta comprimida (en zip)`.", "Comparte este ZIP. Quien lo reciba tiene que extraerlo **todo** y ejecutar el .exe."], "see": "Un ZIP que funciona en cualquier PC con Windows de 64 bits, sin instalar Unity.", "fix": ["No envíes solo el .exe: necesita la carpeta `escaperoom-revolt_Data`, `UnityPlayer.dll` y el resto de archivos que tiene al lado."]}]}], "editor": [{"id": "toolbar", "name": "Barra superior y Play", "text": "Arriba están los menús (`File`, `Edit`, `GameObject`... y `Escape Room Framework`, el de la plantilla). En el centro están **▶ Play** (probar el juego), **Pausa** y **Paso a paso**. Cuando Play está activo, lo que cambias se pierde al detenerlo."}, {"id": "hierarchy", "name": "Hierarchy", "text": "La lista de **todo lo que hay en la escena abierta**: suelo, paredes, jugador, puzles. Los objetos se pueden poner uno dentro de otro (flechita) para agruparlos. Hacer clic aquí es la forma más fácil de seleccionar."}, {"id": "scene", "name": "Scene", "text": "Donde **construyes** el nivel. Puedes moverte libremente (botón derecho + WASD) y mover objetos con las flechas de colores. El jugador no ve esta vista."}, {"id": "game", "name": "Game", "text": "Lo que **ve el jugador** a través de su cámara. Cuando pulsas Play, juegas aquí. Haz clic dentro para capturar el ratón."}, {"id": "inspector", "name": "Inspector", "text": "Las **propiedades del objeto seleccionado**, agrupadas en componentes: `Transform` (posición, rotación, escala), y después los de la plantilla como `Door` o `Code Panel Puzzle`. Aquí es donde configuras el código, si la puerta está cerrada, el texto de una nota..."}, {"id": "project", "name": "Project", "text": "Los **archivos** del proyecto (como el Explorador de Windows): escenas, materiales, modelos, sonidos. La plantilla está en `_EscapeRoomTemplate`; tu trabajo va en tu carpeta."}, {"id": "console", "name": "Console", "text": "**Mensajes y errores**. Blanco = información, amarillo = aviso, rojo = error. Si algo no funciona, mira primero aquí. Haz clic en un mensaje para ver su detalle."}], "glossary": [{"t": "Proyecto", "d": "La carpeta con todo tu juego (`Assets`, `Packages`, `ProjectSettings`). Se abre desde Unity Hub."}, {"t": "Escena", "d": "Un nivel o una pantalla del juego (un archivo `.unity`). El menú es una escena; cada sala puede ser una escena."}, {"t": "GameObject", "d": "Cualquier cosa que hay en la escena: una pared, una luz, el jugador, una puerta. Solo no hace nada."}, {"t": "Component", "d": "Una pieza que da comportamiento a un GameObject: `Transform` (dónde está), `Mesh Renderer` (cómo se ve), `Box Collider` (con qué choca), `Door` (puerta)."}, {"t": "Transform", "d": "El componente que tienen todos los objetos: `Position` (dónde está, en metros), `Rotation` (grados) y `Scale` (tamaño). Y es la altura."}, {"t": "Collider", "d": "La forma invisible con la que choca un objeto. Sin collider, el jugador lo atraviesa."}, {"t": "Material", "d": "Cómo se ve una superficie: color, textura, brillo."}, {"t": "Asset", "d": "Cualquier archivo del proyecto: una escena, un material, un sonido, un modelo 3D, un ScriptableObject."}, {"t": "Prefab", "d": "Un objeto preparado y guardado para reutilizarlo. `Player_PC` y `GameManager` son prefabs."}, {"t": "ScriptableObject", "d": "Un archivo de datos que configuras en el Inspector: definiciones de puzles, pistas, objetos de inventario."}, {"t": "Play mode", "d": "Cuando el juego se está ejecutando dentro de Unity. Los cambios hechos en Play mode se pierden."}, {"t": "Build", "d": "Convertir el proyecto en un programa (`.exe`) que funciona sin Unity."}], "keys": [["Ctrl+S", "Guardar la escena"], ["Ctrl+Z / Ctrl+Y", "Deshacer / rehacer"], ["Ctrl+D", "Duplicar el objeto seleccionado"], ["F2", "Cambiar el nombre"], ["F", "Centrar la vista en el objeto seleccionado"], ["W / E / R", "Mover / girar / escalar"], ["Botón derecho + WASD", "Volar por la vista Scene"], ["Ctrl+P", "Play / detener"], ["Supr", "Borrar el objeto seleccionado"]], "faq": [{"q": "Todo se ve de color rosa.", "a": "Son materiales que no son de URP. Créalos de nuevo con `Create` > `Material`. Si es todo el proyecto, has abierto una versión de Unity diferente de la `6000.4.9f1`."}, {"q": "He hecho muchos cambios y al detener el Play han desaparecido.", "a": "Los cambios hechos con el Play activo no se guardan nunca. Detén el Play antes de editar. Truco: `Edit` > `Preferences` > `Colors` > `Playmode tint` para poner un color fuerte que te avise."}, {"q": "No me puedo mover cuando juego.", "a": "Haz clic dentro de la vista Game. Si hay un panel abierto (inventario, nota, teclado), ciérralo con [[Esc]]. Comprueba que hay un `Player_PC` en la escena."}, {"q": "La Console está llena de errores rojos.", "a": "Haz clic en el botón `Clear` de la Console y vuelve a probar. Si siguen, haz clic en el primero, copia el texto y enséñaselo al profesor. A menudo los errores siguientes son consecuencia del primero."}, {"q": "He cerrado una ventana y no la encuentro.", "a": "`Window` > `Layouts` > `Default` lo vuelve a poner todo en su sitio. Las ventanas sueltas están en `Window` > `General`."}, {"q": "Un objeto no reacciona a la tecla E.", "a": "Se tiene que crear con el menú `Escape Room Framework` > `Create`. Además, el jugador tiene que estar cerca y apuntándolo."}, {"q": "Unity me pide actualizar el proyecto o cambiar de versión.", "a": "No aceptes. Ciérralo y ábrelo con la `6000.4.9f1` desde Unity Hub."}, {"q": "Cuando pulso «Nueva partida» sale un error de que la escena no está añadida.", "a": "Falta el paso G1: añade tu escena en `File` > `Build Profiles` > `Scene List`."}, {"q": "El proyecto va muy lento o da errores raros de archivos.", "a": "Comprueba que no está dentro de una carpeta sincronizada (OneDrive, Google Drive) ni en un pendrive USB. Muévelo a `C:\\Unity`."}]}, "en": {"nav": "Build the project from scratch", "eyebrow": "File 00 · From scratch", "title": "From nothing to your first escape room", "lead": "This section is for people who have never opened Unity. By following the steps in order, you will install Unity, open the project, build your own room with a locked door and a keypad that opens it, and turn it into a game that runs on any Windows PC. Each step tells you what to do, what you should see, and what to do if you don't see it.", "howto_t": "How to use this page", "howto": ["Do the steps **in order**. Each step uses what you did before.", "Tick each step's box when you finish it. The page remembers your progress in this browser.", "If something doesn't turn out the way the step says, check the **If it doesn't work** box before you carry on.", "Text in `this format` is exactly what you'll see on screen (menus, buttons, fields). Keys are shown like this: [[Ctrl]] + [[S]].", "The 3D room on the right builds up as you go: it shows you what your scene should look like."], "time_t": "How long it takes", "time": "Installation: 45-90 minutes (mostly waiting for downloads). Opening the project for the first time: 10-20 minutes. Building the room and the first puzzle: 1-2 hours.", "progress": "Progress", "of": "of", "steps_done": "steps done", "reset": "Clear progress", "reset_confirm": "Are you sure you want to untick all the steps?", "do": "What to do", "see": "What you should see", "fix": "If it doesn't work", "tip": "Tip", "show3d": "Show it in the 3D room", "stage_t": "Your room, step by step", "stage_hint": "Drag to rotate · scroll to zoom", "stage_now": "Now showing", "stage_empty": "You haven't created anything in your scene yet. Start phase E.", "editor_t": "The Unity editor: click each area", "editor_lead": "This is what the Unity screen looks like with the default layout. Click each area to find out what it's for.", "editor_pick": "Click an area of the editor.", "glossary_t": "Unity words you need to know", "keys_t": "Shortcuts you'll use all the time", "faq_t": "Common problems", "next_t": "What next?", "next": "You now have a working room. From here: check out the **Mechanics lab** to pick more puzzles, follow the **Step-by-step recipes** to add them, and use the **Menu workshop** to change how the menu looks.", "phases": [{"id": "A", "title": "Get your computer ready", "goal": "Have Unity Hub and the exact version of Unity installed. You only do this once per computer.", "steps": [{"id": "a1", "title": "Check that your computer is suitable", "do": ["64-bit Windows 10 or 11.", "At least 8 GB of RAM (16 GB works much better).", "About 25 GB free on your disk: Unity takes up about 10 GB and the project about 5 GB once it has been opened.", "An internet connection to download Unity.", "A mouse with a scroll wheel: Unity is much easier to use with a mouse than with a laptop touchpad."], "see": "To check memory and disk: [[Win]] + [[E]], click `This PC`. You'll see the free space on each disk.", "fix": ["If you're short on space, empty the Recycle Bin and delete old downloads before you start."]}, {"id": "a2", "title": "Install Unity Hub", "do": ["Open your browser and go to `unity.com/download`.", "Click the download button for Windows. A file called `UnityHubSetup.exe` is downloaded.", "Open the downloaded file. If Windows asks whether you want to allow changes, click `Yes`.", "Accept the license and keep the suggested folder. Click `Install` and, when it's done, `Finish`."], "see": "The **Unity Hub** window opens. It's the program that manages your Unity versions and your projects. It isn't Unity itself: it's the \"front door\".", "fix": ["If your antivirus or the school computer won't let you install it, ask your teacher or the IT administrator."]}, {"id": "a3", "title": "Sign in and activate the free license", "do": ["In Unity Hub, click `Sign in` and log in with your Unity account. If you don't have one, click `Create account` and make one with your email (it's free).", "When the Hub asks for a license, choose **Personal** (free).", "If it doesn't ask: gear icon `Preferences` > `Licenses` > `Add` > `Get a free personal license`."], "see": "At the top left of the Hub you'll see your initial or photo. Under `Preferences` > `Licenses` there's an active **Personal** license.", "fix": ["If the confirmation email doesn't arrive, check your spam folder.", "Without an active license, Unity won't open any project."]}, {"id": "a4", "title": "Install Unity 6000.4.9f1 (this exact version)", "do": ["The version must be **exactly** `6000.4.9f1`. With any other version, the project may break.", "In the Hub, go to `Installs` > `Install Editor`.", "If version `6000.4.9f1` appears in the list, click `Install` next to it.", "If it doesn't appear, go to the `Archive` tab > `download archive`. A web page opens: search for `6000.4.9f1` and click `Install`. The Hub will open by itself with this version.", "In the list of modules, tick **Microsoft Visual Studio Community** if you don't already have it (it's for viewing the code). Tick **Android Build Support** only if you'll be making VR for Meta Quest.", "Click `Install` and wait. It's about 10 GB and can take from 20 minutes to 1 hour."], "see": "`Unity 6000.4.9f1` appears under `Installs` with no progress bar.", "fix": ["If the download stops, click the pause/resume icon or try again.", "There's also a shortcut: if you add the project in step B4 and don't have the version yet, the Hub shows a button to install it directly."], "tip": "You can carry on with phase B while it installs."}]}, {"id": "B", "title": "Get the project and open it", "goal": "Have the Escape Room project on your computer and open in Unity.", "steps": [{"id": "b1", "title": "Download the project", "do": ["Go to the project's GitHub page that your teacher gave you.", "On the right, under `Releases`, click the newest version (`Escape Room Revolt 0.2.0` or later).", "Further down, under `Assets`, download **`EscapeRoom-0.2.0-pcfix-2026-10-26-delivery.zip`** (the Unity project).", "If you want to play the demo without Unity, also download the `...-windows.zip` ZIP."], "see": "In your `Downloads` folder there's a ZIP file of about 10 MB.", "fix": ["Don't download `Source code (zip)`: it's the whole repository and it's harder to open. Use the `delivery` ZIP."]}, {"id": "b2", "title": "Unzip it into a short folder", "do": ["Create a folder with a short path, for example `C:\\Unity`.", "Right-click the ZIP > `Extract All...` > `Browse` > choose `C:\\Unity` > `Extract`.", "Open the extracted folder. You'll see `Project`, `docs`, `README.md` and `FILES.sha256.json`.", "Rename the `Project` folder to the name of your game, with no accents or spaces. For example `EscapeRoom_JohnSmith`."], "see": "Inside your game's folder there are the folders `Assets`, `Packages` and `ProjectSettings`. That means it's a Unity project folder.", "fix": ["Never work from inside the ZIP (by double-clicking the ZIP without extracting it).", "Avoid the Desktop if it's synced with OneDrive: the project runs slowly and can cause errors.", "Avoid long paths or paths with accents (`C:\\Users\\Núria\\Documents\\...`)."]}, {"id": "b3", "title": "Add the project to Unity Hub", "do": ["In the Hub, go to `Projects`.", "Click the arrow on the `Add` button > `Add project from disk`.", "Select your game's folder (the one that contains `Assets`, `Packages` and `ProjectSettings`) and click `Select Folder`."], "see": "The project appears in the list with version `6000.4.9f1` next to it.", "fix": ["If a yellow missing-version warning appears, click it and install `6000.4.9f1` (step A4).", "If the Hub says the folder isn't a valid project, you've selected a folder one level too high or too low. It must be the one that contains `Assets`."]}, {"id": "b4", "title": "Open it for the first time (and wait)", "do": ["Click the project's name in the list.", "The first time, Unity imports the whole project. It can take **10 to 20 minutes**. Don't close the window even if it looks stuck.", "If Unity asks to change version (`Change Editor version` or `Upgrade`), **don't accept**: close it and open it with `6000.4.9f1`."], "see": "The Unity editor opens with several windows. At the top is the menu `File  Edit  Assets  GameObject  Component  Escape Room Framework  ...`. If you see `Escape Room Framework`, the project has loaded correctly.", "fix": ["If the **Safe Mode** dialog appears: there are code errors. Click `Enter Safe Mode`, look at the `Console` window and let your teacher know with a screenshot.", "If you don't see the `Escape Room Framework` menu, wait for the progress bar at the bottom right to finish.", "Next time you open the project it will take less than a minute."]}]}, {"id": "C", "title": "Get to know the Unity editor", "goal": "Know what each window is and move around the scene without getting lost.", "steps": [{"id": "c1", "title": "The six windows you'll use", "do": ["Use the interactive mock-up below: click each area to find out what it does.", "Find the same areas in your own Unity."], "see": "You can identify **Hierarchy** (the list of what's in the scene), **Scene** (where you build), **Game** (what the player sees), **Inspector** (the properties of the selected object), **Project** (the files) and **Console** (messages and errors).", "fix": ["If you've closed or moved windows by accident: `Window` > `Layouts` > `Default`. It puts everything back in place."], "editor": true}, {"id": "c2", "title": "Moving around the Scene view", "do": ["Put your mouse over the **Scene** view.", "Hold down the **right mouse button** and use [[W]] [[A]] [[S]] [[D]] to fly around like in a video game. [[Q]] and [[E]] move down and up.", "The **scroll wheel** zooms in and out. Clicking the wheel and dragging pans the view.", "[[Alt]] + left button and drag: orbits around what you're looking at.", "Double-click an object in the **Hierarchy** (or select it and press [[F]]) to centre it in the view."], "see": "You can get close to anywhere and find an object again with [[F]].", "fix": ["If you're completely lost: select an object in the Hierarchy and press [[F]]."]}, {"id": "c3", "title": "Selecting, moving, rotating and scaling objects", "do": ["Click an object in the Scene or in the Hierarchy to select it.", "Tools (also on the bar on the left of the Scene): [[W]] move, [[E]] rotate, [[R]] scale. Drag the coloured arrows: red = X, green = Y (up), blue = Z.", "To enter exact values, type them in the **Inspector** > `Transform` > `Position`, `Rotation` and `Scale`.", "Made a mistake? [[Ctrl]] + [[Z]] undoes it."], "see": "When you change a number in the `Transform`, the object moves in the Scene.", "fix": ["If the W/E/R keys do nothing, click inside the Scene view first so it has focus."]}]}, {"id": "D", "title": "Play the museum demo", "goal": "See how an escape room made with the template works before you make your own.", "steps": [{"id": "d1", "title": "Open the museum scene", "do": ["Menu `Escape Room Framework` > `Demo` > `Open Showcase Museum`.", "If it asks whether you want to save changes to the current scene, click `Don't Save`."], "see": "`ShowcaseMuseum` appears in the Hierarchy and in the Scene you see a corridor with rooms.", "fix": ["If the `Escape Room Framework` menu doesn't appear, go back to step B4."]}, {"id": "d2", "title": "Press Play and play", "do": ["Click the **▶ Play** button at the top centre.", "Click inside the **Game** view so the game captures the mouse.", "Move with [[W]] [[A]] [[S]] [[D]] and the mouse. [[E]] to interact, [[I]] inventory, [[H]] hint, [[Esc]] close a panel or pause.", "To stop the game, click **▶ Play** again."], "see": "While you're playing, the Play button stays blue and the Game window shows the game.", "fix": ["**Very important:** anything you change in the Inspector **while Play is active is lost** when you stop it. Stop Play first, then edit.", "If the mouse doesn't move the camera, click inside the Game view.", "To get your cursor back during the game, press [[Esc]]."]}, {"id": "d3", "title": "Solve the keypad and test saving", "do": ["Walk to **room 2**. Aim at the keypad and press [[E]]: a keypad opens on screen.", "Find the room's clue, type the code and watch the door open.", "Press [[F5]] to save, do something else and press [[F9]] to load."], "see": "The keypad light turns green and the door opens. When you load, everything goes back to how it was when you saved.", "fix": ["If you get stuck, press [[H]] to ask for a hint."], "tip": "Each room in the museum teaches a different mechanic. The **Tour** section of this guide has the museum map."}]}, {"id": "E", "title": "Build your room", "goal": "An empty room where the player can walk around. It's the base of your whole game.", "steps": [{"id": "e1", "title": "Create your folder", "do": ["Stop Play if it's active.", "In the **Project** window, click `Assets`.", "Right-click the empty space on the right > `Create` > `Folder`. Name it `MyGame` and press [[Enter]].", "Open `MyGame` and create two more folders inside it: `Scenes` and `Materials`."], "see": "In `Assets` there's `_EscapeRoomTemplate` (the template) and `MyGame` (yours).", "fix": ["**Never save anything inside `_EscapeRoomTemplate`** and don't modify the museum scenes. If you want to change something in the museum, duplicate the scene into your own folder."]}, {"id": "e2", "title": "Create and save a new scene", "do": ["Menu `File` > `New Scene`.", "Choose the **`Basic (URP)`** template and click `Create`.", "Menu `File` > `Save As...`. Go to `Assets/MyGame/Scenes`, enter the name `Room1` and save.", "From now on, save often with [[Ctrl]] + [[S]]."], "see": "`Room1` appears in the Hierarchy with two objects: `Main Camera` and `Directional Light`. The Scene is empty, with the sky in the background.", "fix": ["If you don't see `Basic (URP)`, choose whichever basic template appears (any that has a camera and a light).", "If the scene tab has an asterisk (`Room1*`), it means there are unsaved changes."], "stage": "empty"}, {"id": "e3", "title": "Add a floor", "do": ["Menu `GameObject` > `3D Object` > `Plane`.", "With the `Plane` selected, in the **Inspector** > `Transform`: `Position` 0, 0, 0 and `Scale` 2, 1, 2.", "Rename it: select it in the Hierarchy, press [[F2]], type `Floor` and press [[Enter]]."], "see": "A square grey floor of 20 × 20 metres (a `Plane` is 10 m and you've scaled it × 2).", "fix": ["If you can't see it, double-click `Floor` in the Hierarchy to centre it in the view."], "stage": "floor"}, {"id": "e4", "title": "Put up the four walls", "do": ["Menu `GameObject` > `3D Object` > `Cube`. Name it `Wall_North`.", "`Position` 0, 1.5, 10 · `Rotation` 0, 0, 0 · `Scale` 20, 3, 0.2.", "With the wall selected, press [[Ctrl]] + [[D]] to duplicate it. Name it `Wall_South` and set `Position` 0, 1.5, -10.", "Duplicate it once more: `Wall_East`, `Position` 10, 1.5, 0 and `Rotation` 0, 90, 0.", "And the last one: `Wall_West`, `Position` -10, 1.5, 0 and `Rotation` 0, 90, 0.", "To keep things tidy: `GameObject` > `Create Empty`, name it `Walls` and drag the four walls onto it in the Hierarchy."], "see": "A closed room of 20 × 20 m with walls 3 m high.", "fix": ["If a wall is sunk into the floor or floating, check that `Position Y` is 1.5 (half the height, 3).", "If the walls end up crossing each other, check the `Rotation Y` of the east and west walls (it must be 90)."], "stage": "walls"}, {"id": "e5", "title": "Give the walls some colour", "do": ["In **Project**, go to `Assets/MyGame/Materials`. Right-click > `Create` > `Material`. Name it `MatWall`.", "With the material selected, in the Inspector click the colour box next to `Base Map` and choose a colour.", "Drag the material from Project onto each wall in the Scene view (or onto its name in the Hierarchy).", "Make another material, `MatFloor`, for the floor."], "see": "The walls and the floor have the colours you chose.", "fix": ["If the object looks **pink**, the material isn't a URP one. Create it again with `Create` > `Material` (Unity makes it with the correct shader, `Universal Render Pipeline/Lit`)."], "stage": "color"}, {"id": "e6", "title": "Add the Game Manager", "do": ["Menu `Escape Room Framework` > `Setup` > `Instantiate Game Manager`."], "see": "`GameManager` appears in the Hierarchy. It contains all the game systems: saving and loading, inventory, hints, the interface (HUD) and the pause menu. Without it, nothing in the template works.", "fix": ["If it selects an existing one instead of creating another, there was already one: that's fine, there should only be one."], "stage": "manager"}, {"id": "e7", "title": "Add the player", "do": ["Menu `Escape Room Framework` > `Setup` > `Instantiate PC Player`. `Player_PC` appears.", "Set it to `Position` 0, 0, -7 and `Rotation` 0, 0, 0. That way it faces the north wall.", "**Delete the camera that came with the scene**: in the Hierarchy, click `Main Camera` (the one on its own, at the top level, **not** the one inside `Player_PC`) and press [[Delete]]. The player already has its own camera."], "see": "A player inside the room. In the Hierarchy, if you open the arrow next to `Player_PC`, there's a `Main Camera` inside.", "fix": ["If the Console shows `There are 2 audio listeners in the scene`, you haven't deleted the scene camera.", "If you deleted the player's camera by accident: [[Ctrl]] + [[Z]]."], "stage": "player"}, {"id": "e8", "title": "Test it", "do": ["Save with [[Ctrl]] + [[S]].", "Press **▶ Play**, click in the Game view and walk around the room.", "Stop Play."], "see": "You walk around your room, bump into the walls and see the template's HUD.", "fix": ["**You fall into the void:** the floor has no collision. Select `Floor` and check that it has the `Mesh Collider` component.", "**`No cameras rendering`:** there's no player or you've deleted its camera.", "**You can't move:** click inside the Game view; if a panel is open, press [[Esc]].", "**You start inside a wall:** check the player's `Position`."], "stage": "player"}]}, {"id": "F", "title": "The first puzzle: a keypad that opens the door", "goal": "The player finds a note with the code, types it on the keypad and the door opens.", "steps": [{"id": "f1", "title": "Add a locked door", "do": ["Menu `Escape Room Framework` > `Create` > `Interactables` > `Door`. `NewDoor_Logic` appears in the centre of the Scene view.", "Rename it to `ExitDoor`.", "`Position` 0, 1.25, 9.8 (in front of the north wall, touching the floor).", "In the Inspector, in the `Door` component > `Door Settings`, tick **`Is Locked`**."], "see": "An orange door in front of the north wall. With `Is Locked` ticked, the player can't open it with [[E]].", "fix": ["Always create interactive objects from the `Escape Room Framework` menu. A normal cube doesn't react to the E key.", "If the door ends up inside the wall, lower the `Position Z` a little (for example 9.6)."], "stage": "door"}, {"id": "f2", "title": "Put a keypad next to it", "do": ["Menu `Escape Room Framework` > `Create` > `Puzzles` > `Keypad Panel`. `NewKeypad_Logic` appears with 11 buttons (1-9, C and 0) and a display.", "Name it `DoorKeypad`.", "`Position` 2, 1.4, 9.8.", "Set `Rotation` 0, 180, 0. The buttons will face into the room, where the player is."], "see": "A keypad at eye level, to the right of the door, with the buttons facing the player.", "fix": ["Only move the main object (`DoorKeypad`), never the buttons one by one.", "If from the player's position you see the back of the keypad (no buttons), change `Rotation Y` to 0."], "stage": "keypad"}, {"id": "f3", "title": "Choose the code", "do": ["Select `DoorKeypad`. In the Inspector, find the `Code Panel Puzzle` component.", "In `Correct Code` type whatever code you like, for example `2580`.", "In `Max Code Length` enter the number of digits in the code (4).", "Leave `Auto Check When Full` ticked: it checks the code automatically when the fourth digit is typed."], "see": "`Correct Code` = `2580` and `Max Code Length` = `4`.", "fix": ["If `Max Code Length` doesn't match the number of digits in the code, the keypad will never check it."], "stage": "keypad"}, {"id": "f4", "title": "Connect the keypad to the door", "do": ["In the Hierarchy, click `DoorKeypad`.", "Hold [[Ctrl]] and click `ExitDoor`. Now you have both selected.", "Menu `Escape Room Framework` > `Create` > `Puzzles` > `Link Selected Objects To Puzzle`."], "see": "Select `DoorKeypad` and scroll down the Inspector to the `On Solved ()` event. There are two lines with `ExitDoor`: `Door.Unlock` (removes the lock) and `Door.ForceOpen` (opens the door).", "fix": ["If `On Solved ()` is empty, select the two objects again (the keypad **first**) and repeat the menu command.", "Don't delete these lines: they're the \"wiring\" between the puzzle and the door."], "stage": "link"}, {"id": "f5", "title": "Hide the clue in a note", "do": ["Menu `Escape Room Framework` > `Create` > `Interactables` > `Note`. Name it `CodeNote`.", "`Position` -6, 0.03, -2 (on the floor, to the player's left).", "In the Inspector, in `Note Content`, write the clue. For example: `The combination is the middle column of the keypad, from top to bottom.` (2-5-8-0)."], "see": "A white sheet of paper on the floor.", "fix": ["If the note ends up inside the floor, raise it a little (`Position Y` 0.05)."], "tip": "A good clue makes players think but doesn't give the answer away directly.", "stage": "note"}, {"id": "f6", "title": "Play your puzzle", "do": ["Save ([[Ctrl]] + [[S]]) and press **▶ Play**.", "Go to the note, look at it and press [[E]] to read it.", "Go to the keypad, press [[E]] and type the code.", "Try a wrong code too."], "see": "With the wrong code, the red light flashes and the code is cleared. With the right one, the light turns green and the door opens by itself.", "fix": ["**The door doesn't open:** check step F4 (`On Solved ()` with two lines).", "**The keypad doesn't react to E:** the player has to be close and aiming at it. If it never reacts, you created it without the template menu.", "**The door opens into the wall:** rotate it 180° (`Rotation Y`)."], "stage": "solved"}, {"id": "f7", "title": "Give the puzzle a name and hints (recommended)", "do": ["Follow the **Code keypad** recipe in the *Step-by-step recipes* section: create a `Puzzle Definition` with a unique `Persistent Id` (for example `room1_keypad`), a name and an objective, and three `Hint Data` hints.", "Drag the definition into the `Definition` field of the `Code Panel Puzzle` component."], "see": "During the game, the [[H]] key shows your hints and the HUD shows the objective.", "fix": ["Without a `Persistent Id`, the save system can't tell this puzzle apart from another one."]}]}, {"id": "G", "title": "Turn it into a game you can share", "goal": "Make the main menu take you to your room and build a Windows .exe program.", "steps": [{"id": "g1", "title": "Add your scene to the game's list", "do": ["With `Room1` open, menu `File` > `Build Profiles`.", "On the left, click `Scene List`.", "Click `Add Open Scenes`. `Room1` is added to the list.", "Check that `MainMenu` is in the list too and is ticked."], "see": "The list contains `Intro`, `MainMenu`, ... and right at the bottom `MyGame/Scenes/Room1`, ticked.", "fix": ["A scene that isn't in the list can't be loaded from the menu and gives the error `could not be loaded because it has not been added to the build settings`."]}, {"id": "g2", "title": "Make “New Game” take you to your room", "do": ["In **Project**, go to `Assets/_EscapeRoomTemplate/Resources` and click `GameFlowSettings`.", "In the Inspector, in `First Gameplay Scene`, type `Room1` (the exact name, without `.unity`)."], "see": "`First Gameplay Scene` = `Room1` and `Main Menu Scene` = `MainMenu`.", "fix": ["Upper and lower case matter: `room1` is not the same as `Room1`."]}, {"id": "g3", "title": "Test the complete game from the menu", "do": ["Menu `Escape Room Framework` > `Demo` > `Open Main Menu` (save your scene if it asks).", "Press **▶ Play** and click `New Game` (or `Nueva partida` / `Nova partida`, depending on the game language)."], "see": "The main menu appears and, when you start, you arrive in your room.", "fix": ["If you end up in the museum instead of your room, check step G2."]}, {"id": "g4", "title": "Choose which scenes go into the final program", "do": ["In `Assets/_EscapeRoomTemplate/Resources`, click `ProductConfiguration`.", "`Desktop Scenes` holds the list of scene paths. Keep `Intro.unity` and `MainMenu.unity`.", "Replace the `ShowcaseMuseum.unity` line with the path to your scene: `Assets/MyGame/Scenes/Room1.unity`. Delete the `LockedOffice.unity` line with the `-` button.", "Tip to avoid mistakes: in Project, right-click `Room1` > `Copy Path`, and paste it with [[Ctrl]] + [[V]]."], "see": "`Desktop Scenes` has 3 lines: Intro, MainMenu and your Room1.", "fix": ["A mistyped path makes the build fail. Copy it with `Copy Path` instead of typing it."]}, {"id": "g5", "title": "Build the game for Windows", "do": ["Save ([[Ctrl]] + [[S]]).", "Menu `Escape Room Framework` > `Build` > `Release` > `Build Windows`.", "Wait. The first time it can take 5 to 15 minutes. Unity is locked while it builds.", "When it finishes, the Console shows the message `[Release Build] Windows PASS`."], "see": "In your project folder there's `Builds/Release/v0.1.0-beta.5/Windows/` with `escaperoom-revolt.exe` and other files and folders. Double-click it: your game opens without Unity.", "fix": ["If a red error appears in the Console, click it, copy the text and show it to your teacher.", "The folder name `v0.1.0-beta.5` is historical. It doesn't mean anything about your game."]}, {"id": "g6", "title": "Share it", "do": ["Right-click the `Windows` folder (the one containing the .exe) > `Send to` > `Compressed (zipped) folder`.", "Share this ZIP. Whoever receives it must extract **all** of it and run the .exe."], "see": "A ZIP that works on any 64-bit Windows PC, without installing Unity.", "fix": ["Don't send only the .exe: it needs the `escaperoom-revolt_Data` folder, `UnityPlayer.dll` and the rest of the files next to it."]}]}], "editor": [{"id": "toolbar", "name": "Top bar and Play", "text": "At the top are the menus (`File`, `Edit`, `GameObject`... and `Escape Room Framework`, the template's menu). In the middle are **▶ Play** (test the game), **Pause** and **Step**. While Play is active, anything you change is lost when you stop it."}, {"id": "hierarchy", "name": "Hierarchy", "text": "The list of **everything in the open scene**: floor, walls, player, puzzles. Objects can be placed inside one another (small arrow) to group them. Clicking here is the easiest way to select things."}, {"id": "scene", "name": "Scene", "text": "Where you **build** the level. You can move around freely (right button + WASD) and move objects with the coloured arrows. The player doesn't see this view."}, {"id": "game", "name": "Game", "text": "What **the player sees** through their camera. When you press Play, you play here. Click in it to capture the mouse."}, {"id": "inspector", "name": "Inspector", "text": "The **properties of the selected object**, grouped into components: `Transform` (position, rotation, scale), followed by the template ones such as `Door` or `Code Panel Puzzle`. This is where you set the code, whether the door is locked, the text of a note..."}, {"id": "project", "name": "Project", "text": "The project's **files** (like Windows File Explorer): scenes, materials, models, sounds. The template is in `_EscapeRoomTemplate`; your work goes in your own folder."}, {"id": "console", "name": "Console", "text": "**Messages and errors**. White = information, yellow = warning, red = error. If something isn't working, look here first. Click a message to see its details."}], "glossary": [{"t": "Project", "d": "The folder with your whole game (`Assets`, `Packages`, `ProjectSettings`). You open it from Unity Hub."}, {"t": "Scene", "d": "A level or screen of the game (a `.unity` file). The menu is a scene; each room can be a scene."}, {"t": "GameObject", "d": "Anything in the scene: a wall, a light, the player, a door. On its own it does nothing."}, {"t": "Component", "d": "A piece that gives a GameObject its behaviour: `Transform` (where it is), `Mesh Renderer` (how it looks), `Box Collider` (what it bumps into), `Door` (door)."}, {"t": "Transform", "d": "The component every object has: `Position` (where it is, in metres), `Rotation` (degrees) and `Scale` (size). Y is height."}, {"t": "Collider", "d": "The invisible shape an object uses for collisions. Without a collider, the player walks straight through it."}, {"t": "Material", "d": "How a surface looks: colour, texture, shininess."}, {"t": "Asset", "d": "Any file in the project: a scene, a material, a sound, a 3D model, a ScriptableObject."}, {"t": "Prefab", "d": "An object that has been set up and saved so you can reuse it. `Player_PC` and `GameManager` are prefabs."}, {"t": "ScriptableObject", "d": "A data file you configure in the Inspector: puzzle definitions, hints, inventory items."}, {"t": "Play mode", "d": "When the game is running inside Unity. Changes made in Play mode are lost."}, {"t": "Build", "d": "Turning the project into a program (`.exe`) that works without Unity."}], "keys": [["Ctrl+S", "Save the scene"], ["Ctrl+Z / Ctrl+Y", "Undo / redo"], ["Ctrl+D", "Duplicate the selected object"], ["F2", "Rename"], ["F", "Centre the view on the selected object"], ["W / E / R", "Move / rotate / scale"], ["Right button + WASD", "Fly around the Scene view"], ["Ctrl+P", "Play / stop"], ["Delete", "Delete the selected object"]], "faq": [{"q": "Everything looks pink.", "a": "These are materials that aren't URP materials. Create them again with `Create` > `Material`. If it's the whole project, you've opened a Unity version other than `6000.4.9f1`."}, {"q": "I made lots of changes and they disappeared when I stopped Play.", "a": "Changes made while Play is active are never saved. Stop Play before editing. Tip: `Edit` > `Preferences` > `Colors` > `Playmode tint` to set a strong colour that warns you."}, {"q": "I can't move when I play.", "a": "Click inside the Game view. If a panel is open (inventory, note, keypad), close it with [[Esc]]. Check that there's a `Player_PC` in the scene."}, {"q": "The Console is full of red errors.", "a": "Click the Console's `Clear` button and try again. If they're still there, click the first one, copy the text and show it to your teacher. Often the later errors are a consequence of the first one."}, {"q": "I closed a window and can't find it.", "a": "`Window` > `Layouts` > `Default` puts everything back in place. Individual windows are under `Window` > `General`."}, {"q": "An object doesn't react to the E key.", "a": "It has to be created with the `Escape Room Framework` > `Create` menu. Also, the player has to be close and aiming at it."}, {"q": "Unity asks me to upgrade the project or change version.", "a": "Don't accept. Close it and open it with `6000.4.9f1` from Unity Hub."}, {"q": "When I press “New Game”, I get an error saying the scene hasn't been added.", "a": "You've missed step G1: add your scene in `File` > `Build Profiles` > `Scene List`."}, {"q": "The project is very slow or gives strange file errors.", "a": "Check that it isn't inside a synced folder (OneDrive, Google Drive) or on a USB stick. Move it to `C:\\Unity`."}]}};
const MENUD = {"ca": {"eyebrow": "Disseny del menú · pas a pas", "title": "Canvia l'aspecte del menú sense saber UI Toolkit", "lead": "El menú de la plantilla està fet amb UI Toolkit, el sistema d'interfícies de Unity que funciona com una pàgina web. No cal dominar-lo: hi ha tres nivells. Comença pel primer, que no demana escriure res, i passa al segon només si vols canviar mides, formes, posicions o posar imatges als botons.", "levels_t": "Tres nivells de personalització", "levels": [{"n": "1", "t": "Tema (sense UI Toolkit)", "d": "Un fitxer de configuració, `Menu Theme Settings`, on tries colors, dues fonts, un logo, el títol del joc i els crèdits. Es fa tot a l'Inspector.", "tag": "Recomanat per començar"}, {"n": "2", "t": "Full d'estils propi (UI Builder)", "d": "Una còpia del menú amb un fitxer d'estils `.uss` teu. Hi canvies mides, vores arrodonides, posició del panell, imatges de fons i animacions. Es fa amb l'editor visual **UI Builder** o enganxant el codi que genera el dissenyador d'aquesta pàgina.", "tag": "Quan el tema se't queda curt"}, {"n": "3", "t": "Canviar l'estructura (avançat)", "d": "Els botons de cada pantalla (Nova partida, Continuar, Ajustes...) **els crea el codi C#**, no el fitxer de disseny. Afegir pantalles o botons nous vol dir programar a `UIToolkitMenuController.cs`. No ho necessites per fer un menú amb personalitat.", "tag": "Només si programes"}], "anatomy_t": "Com està fet el menú", "anatomy_lead": "Clica cada part del menú de mostra per saber com es diu, a quin fitxer es canvia i què hi pots modificar.", "anatomy_pick": "Clica una part del menú.", "anatomy_files_t": "Les quatre peces", "anatomy_files": [{"k": "UIDocument", "d": "El component que mostra el menú a l'escena. N'hi ha dos: `MainMenuUI` a l'escena `MainMenu` (menú principal) i `MenuUI` dins de `GameManager` (menú de pausa). El camp `Source Asset` diu quin UXML fa servir."}, {"k": "UXML", "d": "L'**estructura**: quines caixes hi ha i com s'aniuen. El del menú és `EscapeRoomMenu.uxml`: un fons, un marc, el logo, el títol i una zona on el codi posa els botons."}, {"k": "USS", "d": "L'**aspecte**: colors, mides, vores, marges, imatges. És com el CSS d'una web. El de la plantilla és `EscapeRoomMenu.uss`; el teu anirà en un fitxer a part."}, {"k": "C#", "d": "El **comportament**: `UIToolkitMenuController` crea els botons de cada pantalla, els tradueix i aplica el tema. No l'has de tocar."}], "parts": [{"id": "root", "sel": ".menu-root", "name": "Fons de pantalla", "d": "Ocupa tota la pantalla i centra el marc. Aquí pots posar una imatge de fons (`background-image`) o moure el marc a l'esquerra (`align-items: flex-start`)."}, {"id": "frame", "sel": "#document-frame · .document-frame", "name": "Marc del menú", "d": "La caixa on hi ha tot. Amplada (`width: 760px`), marge interior (`padding`), gruix i color de la vora, cantonades arrodonides (`border-radius`) i color o imatge de fons."}, {"id": "logo", "sel": "#logo · .menu-logo", "name": "Logo", "d": "Amagat si no poses logo al tema. Mida amb `width` i `height` (72 px per defecte)."}, {"id": "title", "sel": "#title · .title", "name": "Títol", "d": "El títol de cada pantalla. Mida de lletra (`font-size: 28px`), espai entre lletres (`letter-spacing`), alineació (`-unity-text-align`) i font."}, {"id": "button", "sel": ".menu-button", "name": "Botó", "d": "Tots els botons del menú. Alçada (`height: 42px`), separació (`margin-bottom`), mida de lletra, vora esquerra vermella (`border-left-width`, `border-left-color`), cantonades i imatge de fons. L'estat del ratolí a sobre és `.menu-button:hover`."}, {"id": "quiet", "sel": ".menu-button--quiet", "name": "Botó secundari", "d": "Botons com Crèdits, Sortir o Tornar. Es veuen més apagats (`opacity: 0.72`) i amb més espai a sobre."}, {"id": "content", "sel": "#screen-content · .screen-content", "name": "Zona de contingut", "d": "On el codi posa els botons, els ajustos i les ranures de partida. Té barra de desplaçament si el contingut no hi cap (`max-height: 560px`)."}], "warn_t": "Abans de tocar res: quatre normes", "warn": ["**No canviïs el nom** (`name`) dels elements `document-frame`, `logo`, `title` ni `screen-content`. El codi els busca pel nom; si el canvies, el menú queda buit.", "**No editis els fitxers de la plantilla** (`EscapeRoomMenu.uxml` i `EscapeRoomMenu.uss`). Treballa sempre sobre còpies a la teva carpeta.", "**Si hi ha un tema assignat, els colors del tema guanyen** als del teu USS (fons del marc, vora, títol i botons). Fes servir el tema per als colors i l'USS per a la resta, o deixa el camp `Theme` buit si vols controlar els colors des de l'USS.", "**No escriguis text dins de les imatges** dels botons: el text el posa el codi i es tradueix sol. El mode d'alt contrast dels Ajustes també ha de continuar llegint-se bé."], "phases": [{"id": "T", "title": "Nivell 1 · El tema del menú", "goal": "Colors, fonts, logo, títol i crèdits del teu joc, sense tocar cap fitxer de disseny.", "steps": [{"id": "t1", "title": "Crea el fitxer del tema", "do": ["A **Project**, entra a la teva carpeta (`Assets/ElMeuJoc`) i crea-hi una carpeta `UI`.", "Dins de `UI`: clic dret > `Create` > `Escape Room Framework` > `Menu Theme Settings`.", "Posa-li el nom `TemaMenu` i prem [[Enter]]."], "see": "Un fitxer `TemaMenu` a la teva carpeta. Si el selecciones, l'Inspector mostra els apartats `Colores`, `Tipografía`, `Marca` i `Textos propios`. Els valors per defecte són els colors actuals del menú: encara no canvia res.", "fix": ["Si no surt `Escape Room Framework` al menú `Create`, espera que Unity acabi de compilar (barra de baix a la dreta)."]}, {"id": "t2", "title": "Assigna'l al menú principal", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Main Menu`.", "A la **Hierarchy**, clica `MainMenuUI`.", "A l'Inspector, al component `UI Toolkit Menu Controller`, arrossega `TemaMenu` des de Project fins al camp **`Theme`**.", "Desa l'escena ([[Ctrl]] + [[S]])."], "see": "El camp `Theme` mostra `TemaMenu`. Aquí sí que toq
