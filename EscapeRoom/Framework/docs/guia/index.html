<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape Room Revolt · Projectes i mecàniques</title>
<meta name="description" content="Guia interactiva d’Escape Room i de la base comuna: dos projectes Unity, rutes actuals i laboratori Three.js. Guia Survival separada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: case-file dossier. Fixed index tab rail on the left, one "expedient" section visible at a time,
   3D stage panels framed like evidence photos. Palette taken from the template's own menu theme (brass on olive). */
:root{
  --bg:#efe8d6; --panel:#f8f3e6; --panel-2:#e6dcc2; --ink:#27251c; --muted:#6c6450;
  --line:#cbbf9f; --accent:#7d6c46; --accent-ink:#5a4b2a; --accent-soft:#e2d4ac;
  --ok:#2f7a4a; --warn:#a4661a; --bad:#a53a2a; --code-bg:#2a2820; --code-ink:#e8dfc4;
  --stage-bg:#1d1c17;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.2rem; --s2:1.55rem; --s3:2.2rem; --s4:3.2rem;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171611; --panel:#201f19; --panel-2:#2a2820; --ink:#e6e1cd; --muted:#a79e84;
  --line:#3d3a2d; --accent:#b39a61; --accent-ink:#dfcf9e; --accent-soft:#3a3424;
  --ok:#6fbf87; --warn:#e0a44f; --bad:#e07a66; --code-bg:#11100c; --code-ink:#e8dfc4; --stage-bg:#0f0e0b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171611; --panel:#201f19; --panel-2:#2a2820; --ink:#e6e1cd; --muted:#a79e84;
  --line:#3d3a2d; --accent:#b39a61; --accent-ink:#dfcf9e; --accent-soft:#3a3424;
  --ok:#6fbf87; --warn:#e0a44f; --bad:#e07a66; --code-bg:#11100c; --code-ink:#e8dfc4; --stage-bg:#0f0e0b;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--s0);line-height:1.55;margin:0}
a{color:var(--accent-ink)}
code,kbd,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--panel-2);padding:.08em .35em;border-radius:3px;overflow-wrap:anywhere}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:.05em .4em;background:var(--panel);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:var(--s4);text-transform:uppercase}
h3{font-size:var(--s2);text-transform:uppercase;font-weight:600}
p{margin:0;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;
  background:var(--panel);border-right:1px solid var(--line);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1.25rem}
.brand{display:grid;gap:.15rem}
.brand .stamp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{font-family:var(--f-display);font-size:1.9rem;line-height:.95;text-transform:uppercase;color:var(--accent-ink)}
.nav{display:grid;gap:.2rem;list-style:none;margin:0;padding:0}
.nav button{width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:.5rem .6rem;display:grid;grid-template-columns:2.1rem 1fr;gap:.3rem;align-items:baseline}
.nav button .no{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.nav button:hover{background:var(--panel-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.langs{display:flex;gap:.25rem}
.langs button{flex:1;min-width:2.4rem;border:1px solid var(--line);background:none;border-radius:var(--r);padding:.3rem 0;font-family:var(--f-mono);font-size:.78rem}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.rail .meta{margin-top:auto;font-size:var(--s-1);color:var(--muted);display:grid;gap:.4rem}

main{padding-inline:clamp(1rem,3.5vw,3rem);padding-block:2rem 4rem;min-width:0}
.sec{display:grid;gap:1.6rem;max-width:74rem}
.sec[hidden]{display:none}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.lead{font-size:var(--s1);color:var(--muted);max-width:62ch}
.head{display:grid;gap:.6rem;border-bottom:2px solid var(--ink);padding-bottom:1rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1.25rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.55rem;align-content:start;min-width:0}
.card h4{margin:0;font-size:1rem}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.path{font-family:var(--f-mono);font-size:.8rem;color:var(--accent-ink);background:var(--accent-soft);padding:.3rem .5rem;border-radius:4px;overflow-wrap:anywhere}
.path::before{content:"▸ ";opacity:.6}

.stage{position:relative;background:var(--stage-bg);border-radius:var(--r);overflow:hidden;min-height:22rem;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hud{position:absolute;inset:auto .75rem .75rem .75rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
.stage .hud>*{pointer-events:auto}
.pill{background:rgba(20,19,15,.82);color:#efe6c8;border:1px solid rgba(179,154,97,.55);border-radius:999px;padding:.3rem .75rem;font-size:.8rem;font-family:var(--f-mono)}
.pill.ok{border-color:#6fbf87;color:#bff0cd}
.pill.bad{border-color:#e07a66;color:#ffd0c6}
.stage .hint{position:absolute;top:.7rem;left:.75rem;right:.75rem;color:#d8cfb2;font-size:.8rem;font-family:var(--f-mono);pointer-events:none;text-shadow:0 1px 2px #000}
.stage .crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(240,230,200,.8);border-radius:50%;pointer-events:none}
.stage .prompt{position:absolute;left:50%;top:calc(50% + 1.4rem);transform:translateX(-50%);pointer-events:none}

.play{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.35rem .8rem;font-size:.86rem}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.inspector .ttl{background:var(--panel-2);padding:.45rem .8rem;font-family:var(--f-mono);font-size:.78rem;display:flex;justify-content:space-between;gap:.5rem}
.inspector .body{padding:.8rem;display:grid;gap:.6rem}
.field{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:.5rem;align-items:center;font-size:.86rem}
.field label{color:var(--muted);font-family:var(--f-mono);font-size:.76rem}
.field input[type=text],.field input[type=number],.field select{width:100%;min-width:0;font:inherit;font-size:.86rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.25rem .4rem}
.field input[type=color]{width:100%;height:1.8rem;border:1px solid var(--line);border-radius:4px;background:none;padding:0}
.console{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);font-family:var(--f-mono);font-size:.76rem;padding:.6rem .75rem;height:9.5rem;overflow:auto;display:grid;align-content:start;gap:.15rem}
.console .w{color:#e0a44f}.console .e{color:#f08a76}.console .s{color:#8fd6a5}.console .i{color:#9fb7d9}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);padding:.8rem 1rem;font-family:var(--f-mono);font-size:.78rem;overflow-x:auto;margin:0;line-height:1.5}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:var(--r);padding:.45rem .9rem;font-weight:600}
.btn.ghost{background:none;color:var(--accent-ink)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.steps{counter-reset:s;display:grid;gap:.6rem;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:1.5rem;line-height:1;color:var(--accent-ink);text-align:right}
.check{display:grid;gap:.4rem;list-style:none;margin:0;padding:0}
.check label{display:grid;grid-template-columns:1.3rem minmax(0,1fr);gap:.5rem;align-items:start;cursor:pointer}
.check input{margin-top:.3rem;accent-color:var(--accent)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tr:last-child td{border-bottom:0}
.status{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:.1rem .45rem;border-radius:3px;border:1px solid currentColor}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
.tree{font-family:var(--f-mono);font-size:.8rem;display:grid;gap:.1rem;list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:1.1rem;border-left:1px dashed var(--line)}
.tree button{background:none;border:0;padding:.12rem .3rem;border-radius:3px;text-align:left}
.tree button:hover,.tree button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.tree .grp{color:var(--muted);padding:.12rem .3rem;display:block}
.tour{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:min(24rem,calc(100vw - 2rem));background:var(--ink);color:var(--bg);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.6rem;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10}
.tour .tag{color:var(--accent-soft)}
.tour .row .btn{background:var(--accent-soft);color:var(--ink);border-color:var(--accent-soft)}
.tour .row .btn.ghost{background:none;color:var(--bg);border-color:rgba(255,255,255,.3)}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.menu-prev{display:grid;place-items:center;padding:1.2rem;border-radius:var(--r);min-height:26rem}
.mp-frame{width:min(100%,24rem);border:3px solid;padding:1.1rem 1.2rem;display:grid;gap:.55rem;border-radius:2px}
.mp-title{font-size:1.5rem;letter-spacing:.06em;text-align:center;font-weight:700}
.mp-logo{justify-self:center;font-family:var(--f-display);font-size:1.1rem;letter-spacing:.2em;padding:.2rem .6rem;border:1px dashed currentColor}
.mp-btn{border:0;padding:.55rem .8rem;text-align:left;letter-spacing:.04em;font-size:.95rem;border-radius:0}
.mp-btn.quiet{opacity:.8}
.mp-btn[disabled]{opacity:.4;cursor:not-allowed}
.mp-row{display:flex;justify-content:space-between;gap:.5rem;font-size:.85rem}
.mp-slot{border:1px solid;padding:.45rem .6rem;display:grid;gap:.1rem;font-size:.82rem}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:.45rem .9rem;font-size:.86rem}
.keys div{display:flex;gap:.5rem;align-items:baseline}
.note{border-left:3px solid var(--warn);padding:.2rem 0 .2rem .8rem;color:var(--muted);font-size:.9rem;max-width:70ch}
details.card summary{cursor:pointer;font-weight:600}
.recipe{margin-top:1rem;display:grid;gap:.6rem}
.recipe summary{list-style:none;display:grid;gap:.2rem}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary h3{margin:0;display:flex;gap:.5rem;align-items:baseline}
.recipe summary h3::before{content:"＋";font-family:var(--f-mono);color:var(--accent-ink);font-size:.9em}
.recipe[open] summary h3::before{content:"－"}
.recipe>*+*{margin-top:.5rem}
.recipe ul{margin:.3rem 0 0;padding-left:1.1rem;display:grid;gap:.3rem}
.chip{display:inline-block;font-size:.8rem;padding:.2rem .6rem;border:1px solid var(--line, currentColor);border-radius:999px;color:inherit;text-decoration:none}
.chip:hover{background:var(--accent-soft)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.6rem 1rem;gap:.6rem;border-right:0;border-bottom:1px solid var(--line)}
  .brand b{font-size:1.25rem}.brand .stamp{display:none}
  .nav{display:flex;overflow-x:auto;gap:.2rem;width:100%;order:3}
  .nav button{white-space:nowrap;grid-template-columns:auto auto;padding:.35rem .55rem}
  .rail .meta{display:none}
  .langs{margin-left:auto}
  .play{grid-template-columns:1fr}
  h2{font-size:var(--s3)}
  .field{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── Start from zero ── */
.st-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.st-main{display:grid;gap:1.6rem;min-width:0}
.st-side{position:sticky;top:1rem;min-width:0}
.st-phase{display:grid;gap:.7rem}
.st-phase h3{display:flex;gap:.6rem;align-items:center}
.st-ph{display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1.2rem}
.st-goal{color:var(--muted)}
.st-step{padding:0;gap:0}
.st-step>summary{list-style:none;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.6rem;align-items:center;padding:.75rem 1rem;cursor:pointer}
.st-step>summary::-webkit-details-marker{display:none}
.st-step>summary::after{content:"▾";grid-column:4;color:var(--muted)}
.st-step:not([open])>summary::after{content:"▸"}
.st-step.done>summary .st-title{color:var(--muted);text-decoration:line-through}
.st-tick input{width:1.15rem;height:1.15rem;accent-color:var(--ok);cursor:pointer;margin:0}
.st-num{font-family:var(--f-mono);font-size:.78rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:.1rem .4rem}
.st-title{font-weight:600}
.st-body{display:grid;gap:.8rem;padding:0 1rem 1rem}
.st-do{margin:.3rem 0 0;padding-left:1.3rem;display:grid;gap:.4rem}
.st-do li::marker{font-family:var(--f-mono);color:var(--accent-ink)}
.st-see{border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent);padding:.5rem .8rem;border-radius:0 4px 4px 0}
.st-fix{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:.5rem .8rem;border-radius:0 4px 4px 0}
.st-fix ul,.st-list{margin:.3rem 0 0;padding-left:1.1rem;display:grid;gap:.35rem}
.st-tip{font-size:.92rem}
.st-small{font-size:.86rem;color:var(--muted)}
.st-bar{height:.6rem;border-radius:999px;background:var(--panel-2);overflow:hidden}
.st-bar span{display:block;height:100%;background:var(--ok);transition:width .3s}
.st-phases .chip small{opacity:.7;margin-left:.2rem}
.st-phases .chip.ok{border-color:var(--ok);color:var(--ok)}
.st-gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.6rem;margin:0}
.st-gloss div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem}
.st-gloss dt{font-weight:700}.st-gloss dd{margin:.2rem 0 0;font-size:.9rem}
.st-editor{display:grid;gap:.5rem}
.ue{display:grid;grid-template-columns:1fr 2.4fr 1.2fr;grid-template-rows:auto 7.5rem 4.5rem 5rem;gap:3px;background:#191919;padding:3px;border-radius:6px;font-family:var(--f-mono);font-size:.68rem;color:#c8c8c8}
.ue-zone{position:relative;border:1px solid #2c2c2c;background:#2a2a2a;color:inherit;text-align:left;padding:1.3rem .4rem .3rem;border-radius:3px;overflow:hidden;font:inherit;line-height:1.35}
.ue-zone:hover,.ue-zone[aria-pressed="true"]{outline:2px solid #f0c060;outline-offset:-2px;background:#353227}
.ue-name{position:absolute;top:0;left:0;right:0;background:#3c3c3c;color:#eee;padding:.1rem .4rem;font-weight:600}
.ue-toolbar{grid-column:1/-1;display:flex;justify-content:space-between;gap:.5rem;padding:1.3rem .4rem .3rem}
.ue-play{color:#7fb7ff;letter-spacing:.3em}
.ue-hierarchy{grid-row:2/4}
.ue-scene{background:linear-gradient(#5d7486,#7f95a5 55%,#4a4a44 55%)}
.ue-grid{position:absolute;inset:55% 0 0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.12) 18px 19px)}
.ue-game{background:#1f2b33;display:grid;place-items:center}
.ue-cross{font-size:1.2rem;color:#eee}
.ue-inspector{grid-column:3;grid-row:2/5}
.ue-project{grid-column:1/2;grid-row:4}
.ue-console{grid-column:2;grid-row:4}
.st-uecard{min-height:5rem}
@media (max-width:860px){
  .st-wrap{grid-template-columns:1fr}
  .st-side{position:static;order:-1}
  .ue{grid-template-columns:1fr 1fr;grid-template-rows:auto 5rem 5rem 5rem 4.5rem}
  .ue-hierarchy{grid-row:auto}.ue-scene{grid-column:1/-1}.ue-game{grid-column:1/-1}
  .ue-inspector{grid-column:auto;grid-row:auto}.ue-project{grid-column:auto;grid-row:auto}.ue-console{grid-column:1/-1;grid-row:auto}
}
/* ── Menu design ── */
.md{display:grid;gap:1.4rem;margin-top:2.5rem;padding-top:1.5rem;border-top:2px dashed var(--line)}
.md-level{position:relative;padding-top:1.4rem}
.md-n{position:absolute;top:-.9rem;left:1rem;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--panel);font-family:var(--f-display);font-size:1.1rem}
.md-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.md-left{display:grid;gap:1rem;min-width:0}
.md-controls{display:grid;gap:.8rem;min-width:0}
.md-controls .ttl input{margin:0}
.md-rng{display:flex;gap:.5rem;align-items:center}.md-rng input{flex:1;min-width:0}.md-rng output{font-family:var(--f-mono);font-size:.75rem;min-width:3.2rem;text-align:right}
.md-stage{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#2e3a40,#1a1f22)}
.mdp-root{display:flex;align-items:center;min-height:23rem;padding:14px 8px;background:rgba(5,7,8,.55);cursor:pointer}
.mdp-frame{display:flex;flex-direction:column;max-width:100%;font-family:var(--f-body)}
.mdp-logo{align-self:center;width:38px;height:38px;margin-bottom:8px;border:1px dashed #b39a61;color:#b39a61;font-size:.55rem;display:grid;place-items:center;font-family:var(--f-mono)}
.mdp-title{font-weight:700;margin-bottom:12px;font-family:var(--f-display)}
.mdp-btn{display:flex;align-items:center;letter-spacing:.03em;cursor:pointer;user-select:none}
.md-stage .md-sel{outline:2px dashed #f0c060;outline-offset:2px}
@media (max-width:860px){.md-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

  /* Tour */
  tour_eyebrow: L("Expedient 00 · Visita guiada", "Expediente 00 · Visita guiada", "File 00 · Guided tour"),
  tour_title: L("Un marc per fer escape rooms, no una sala tancada", "Un marco para hacer escape rooms, no una sala cerrada", "A framework for escape rooms, not one closed room"),
  tour_lead: L(
    "Escape Room Revolt és una plantilla de Unity 6 (URP) per crear jocs d'escapada en primera persona per a PC i per a realitat virtual amb comandaments. Les sales, els puzles i les pistes es configuren amb ScriptableObjects i amb el menú Escape Room Framework de l'editor, sense reescriure codi.",
    "Escape Room Revolt es una plantilla de Unity 6 (URP) para crear juegos de escape en primera persona para PC y para realidad virtual con mandos. Las salas, los puzles y las pistas se configuran con ScriptableObjects y con el menú Escape Room Framework del editor, sin reescribir código.",
    "Escape Room Revolt is a Unity 6 (URP) template for first-person escape games on PC and on VR with controllers. Rooms, puzzles and hints are configured with ScriptableObjects and the Escape Room Framework editor menu, without rewriting code."),
  tour_start: L("Comença la visita guiada", "Empieza la visita guiada", "Start the guided tour"),
  tour_map_title: L("El museu de mostra, sala per sala", "El museo de muestra, sala por sala", "The sample museum, room by room"),
  tour_map_hint: L("Arrossega per girar · roda per apropar · clica una sala", "Arrastra para girar · rueda para acercar · haz clic en una sala", "Drag to orbit · wheel to zoom · click a room"),
  tour_map_help: L(
    "L'escena ShowcaseMuseum conté una sala per mecànica. Clica una sala del mapa per veure què ensenya i quin component la fa funcionar.",
    "La escena ShowcaseMuseum contiene una sala por mecánica. Haz clic en una sala del mapa para ver qué enseña y qué componente la hace funcionar.",
    "The ShowcaseMuseum scene has one room per mechanic. Click a room on the map to see what it teaches and which component drives it."),
  tour_try: L("Prova-la al laboratori", "Pruébala en el laboratorio", "Try it in the lab"),
  tour_pick: L("Selecciona una sala al mapa.", "Selecciona una sala en el mapa.", "Select a room on the map."),
  arch_title: L("Com està construït", "Cómo está construido", "How it is built"),
  arch_1t: L("Dades, lògica i aspecte separats", "Datos, lógica y aspecto separados", "Data, logic and look kept apart"),
  arch_1: L("La configuració viu en ScriptableObjects (PuzzleDefinition, HintData, InventoryItemData). La lògica en components petits. El model 3D penja d'un ModelSocket i es pot substituir sense tocar scripts ni colliders.",
    "La configuración vive en ScriptableObjects (PuzzleDefinition, HintData, InventoryItemData). La lógica en componentes pequeños. El modelo 3D cuelga de un ModelSocket y se puede sustituir sin tocar scripts ni colliders.",
    "Configuration lives in ScriptableObjects (PuzzleDefinition, HintData, InventoryItemData), logic in small components. The 3D model hangs from a ModelSocket and can be swapped without touching scripts or colliders."),
  arch_2t: L("Una sola interfície d'interacció", "Una sola interfaz de interacción", "One interaction interface"),
  arch_2: L("Tot el que es pot tocar implementa IInteractable. El ratolí (InteractionManager) i els comandaments VR passen pel mateix InteractionDispatcher, així que un puzle no sap si l'han activat des de PC o des de VR.",
    "Todo lo que se puede tocar implementa IInteractable. El ratón (InteractionManager) y los mandos VR pasan por el mismo InteractionDispatcher, así que un puzle no sabe si lo han activado desde PC o desde VR.",
    "Everything touchable implements IInteractable. Mouse rays (InteractionManager) and VR controllers go through the same InteractionDispatcher, so a puzzle never knows whether PC or VR triggered it."),
  arch_3t: L("Una sola font d'entrada", "Una sola fuente de entrada", "One input source"),
  arch_3: L("El joc consulta InputRouter i PlayerPlatformRegistry.Current, mai Camera.main ni una API del visor. Canviar de plataforma vol dir canviar de prefab de jugador.",

    "Gameplay reads InputRouter and PlayerPlatformRegistry.Current, never Camera.main or a headset API. Switching platform means switching the player prefab."),
  arch_4t: L("Guardat per estat", "Guardado por estado", "State-based saving"),
  arch_4: L("Cada objecte persistent implementa ISaveable, té un SaveId únic i es serialitza ell mateix. SaveManager escriu 3 ranures manuals i una ràpida de manera atòmica, amb còpia .bak.",
    "Cada objeto persistente implementa ISaveable, tiene un SaveId único y se serializa a sí mismo. SaveManager escribe 3 ranuras manuales y una rápida de forma atómica, con copia .bak.",

  sc_office: L("Sala petita: claus, porta, calaix, nota i dos teclats.", "Sala pequeña: llaves, puerta, cajón, nota y dos teclados.", "Small room: keys, door, drawer, note and two keypads."),

  ts_1: L("Aquí tens el museu de mostra. Cada bloc és una sala amb una mecànica diferent. Clica'n una per saber què fa.", "Aquí tienes el museo de muestra. Cada bloque es una sala con una mecánica distinta. Haz clic en una para saber qué hace.", "This is the sample museum. Each block is a room with a different mechanic. Click one to learn what it does."),
  ts_2: L("Al laboratori de mecàniques pots jugar cada puzle i canviar-ne els camps com si fos l'Inspector de Unity. La consola de sota mostra els esdeveniments.", "En el laboratorio de mecánicas puedes jugar cada puzle y cambiar sus campos como si fuera el Inspector de Unity. La consola de abajo muestra los eventos.", "In the mechanics lab you can play each puzzle and change its fields as if it were Unity's Inspector. The console below shows the events."),
  ts_3: L("Prova el teclat: escriu 3142. Després canvia Correct Code a l'Inspector i torna-ho a provar.", "Prueba el teclado: escribe 3142. Después cambia Correct Code en el Inspector y vuelve a probar.", "Try the keypad: enter 3142. Then change Correct Code in the Inspector and try again."),
  ts_4: L("Al taller de menús dissenyes el menú del teu joc amb els mateixos camps de MenuThemeSettings.", "En el taller de menús diseñas el menú de tu juego con los mismos campos de MenuThemeSettings.", "In the menu workshop you design your game's menu with the same MenuThemeSettings fields."),
  ts_5: L("Aquí veus com es mou i interactua el jugador de PC, i com està muntat el rig de VR.", "Aquí ves cómo se mueve e interactúa el jugador de PC, y cómo está montado el rig de VR.", "Here you see how the PC player moves and interacts, and how the VR rig is built."),
  ts_6: L("Inventari, examen 3D, guardat, pistes, finals i eines de validació, amb demos.", "Inventario, examen 3D, guardado, pistas, finales y herramientas de validación, con demos.", "Inventory, 3D examine, saving, hints, endings and validation tools, with demos."),
  ts_7: L("Quan ho tinguis clar, segueix la recepta pas a pas per muntar la teva primera sala.", "Cuando lo tengas claro, sigue la receta paso a paso para montar tu primera sala.", "When you are ready, follow the step-by-step recipe to build your first room."),
  tour_next: L("Següent", "Siguiente", "Next"),
  tour_close: L("Tanca", "Cerrar", "Close"),
  tour_step: L("Pas", "Paso", "Step"),

  /* Mechanics */
  mech_eyebrow: L("Expedient 01 · Laboratori", "Expediente 01 · Laboratorio", "File 01 · Lab"),
  mech_title: L("Laboratori de mecàniques", "Laboratorio de mecánicas", "Mechanics lab"),
  mech_lead: L("Cada puzle de la plantilla, jugable aquí. Els camps de la dreta són els mateixos que veuràs a l'Inspector del component; canvia'ls i observa com canvia el comportament.",
    "Cada puzle de la plantilla, jugable aquí. Los campos de la derecha son los mismos que verás en el Inspector del componente; cámbialos y observa cómo cambia el comportamiento.",

  insp: L("Inspector", "Inspector", "Inspector"),
  console: L("Consola", "Consola", "Console"),
  reset: L("ResetPuzzle()", "ResetPuzzle()", "ResetPuzzle()"),
  how_create: L("Com crear-lo", "Cómo crearlo", "How to create it"),
  how_wire: L("Com connectar-lo", "Cómo conectarlo", "How to wire it"),
  in_museum: L("Al museu", "En el museo", "In the museum"),
  room: L("Sala", "Sala", "Room"),

  unsolved: L("Sense resoldre", "Sin resolver", "Unsolved"),
  inprogress: L("En curs", "En curso", "In progress"),
  door_open: L("OnSolved → Door.Unlock() + Door.ForceOpen()", "OnSolved → Door.Unlock() + Door.ForceOpen()", "OnSolved → Door.Unlock() + Door.ForceOpen()"),
  wrong: L("Intent incorrecte", "Intento incorrecto", "Wrong attempt"),

  m_code: L("Teclat de codi", "Teclado de código", "Code keypad"),
  m_code_d: L("Un teclat numèric o cadenat. Cada botó afegeix un caràcter; quan s'arriba a la longitud màxima es comprova automàticament. Un error neteja l'intent i dispara OnFailed.",
    "Un teclado numérico o candado. Cada botón añade un carácter; al llegar a la longitud máxima se comprueba automáticamente. Un error limpia el intento y dispara OnFailed.",
    "A numeric keypad or lock. Each button adds a character; at max length it checks automatically. A wrong code clears the attempt and fires OnFailed."),
  m_code_w: L("Cada botó crida InputDigit(\"n\"); el botó C crida ClearInput. Si desactives Auto Check, afegeix un botó OK que cridi SubmitCode. A On Solved, arrossega la porta i tria Door.Unlock; afegeix una segona entrada amb Door.ForceOpen (o selecciona puzle i porta i fes Create > Puzzles > Link Selected Objects To Puzzle, que ho connecta sol).",
    "Cada botón llama a InputDigit(\"n\"); el botón C llama a ClearInput. Si desactivas Auto Check, añade un botón OK que llame a SubmitCode. En On Solved, arrastra la puerta y elige Door.Unlock; añade una segunda entrada con Door.ForceOpen (o selecciona puzle y puerta y usa Create > Puzzles > Link Selected Objects To Puzzle, que lo conecta solo).",
    "Each button calls InputDigit(\"n\"); the C button calls ClearInput. With Auto Check off, add an OK button calling SubmitCode. In On Solved, drag the door and pick Door.Unlock; add a second entry with Door.ForceOpen (or select puzzle and door and run Create > Puzzles > Link Selected Objects To Puzzle, which wires it for you)."),
  m_code_h: L("Clica les tecles del teclat 3D. La pista és al paper de la paret.", "Haz clic en las teclas del teclado 3D. La pista está en el papel de la pared.", "Click the keys of the 3D keypad. The clue is on the note on the wall."),

  m_seq: L("Seqüència", "Secuencia", "Sequence"),
  m_seq_d: L("Botons o palanques que s'han de prémer en un ordre concret. Un pas equivocat reinicia l'intent. La melodia de la sala 9 és el mateix component amb so.",
    "Botones o palancas que hay que pulsar en un orden concreto. Un paso equivocado reinicia el intento. La melodía de la sala 9 es el mismo componente con sonido.",
    "Buttons or levers pressed in a set order. A wrong step restarts the attempt. The melody in room 9 is the same component with sound."),
  m_seq_w: L("Omple Correct Sequence amb IDs (red, green, blue). Cada botó porta un SequenceStepButton amb el seu ID o crida InputStep(id).",
    "Rellena Correct Sequence con IDs (red, green, blue). Cada botón lleva un SequenceStepButton con su ID o llama a InputStep(id).",
    "Fill Correct Sequence with IDs (red, green, blue). Each button has a SequenceStepButton with its ID, or calls InputStep(id)."),
  m_seq_h: L("Prem els botons en l'ordre correcte. Activa Melody per sentir-los.", "Pulsa los botones en el orden correcto. Activa Melody para oírlos.", "Press the buttons in the right order. Turn on Melody to hear them."),

  m_wheels: L("Rodets numèrics (StatePuzzle)", "Rodillos numéricos (StatePuzzle)", "Number wheels (StatePuzzle)"),
  m_wheels_d: L("Diversos objectes amb N posicions (rodets, palanques, dials) que han d'estar tots en la posició demanada. L'ordre no importa. Des de la revisió de setembre, la posició de cada rodet es guarda.",
    "Varios objetos con N posiciones (rodillos, palancas, diales) que deben estar todos en la posición pedida. El orden no importa. Desde la revisión de septiembre, la posición de cada rodillo se guarda.",
    "Several objects with N positions (wheels, levers, dials) that must all show the required position. Order does not matter. Since the September review each wheel's position is saved."),
  m_wheels_w: L("Crea'l amb Number Wheels Puzzle (de 2 a 8 rodets). Cada condició és un SteppedPositioner i el seu Required Index (comença a 0). Per a palanques, usa State Puzzle + Multi-Position Lever.",
    "Créalo con Number Wheels Puzzle (de 2 a 8 rodillos). Cada condición es un SteppedPositioner y su Required Index (empieza en 0). Para palancas, usa State Puzzle + Multi-Position Lever.",
    "Create it with Number Wheels Puzzle (2 to 8 wheels). Each condition is a SteppedPositioner and its Required Index (starting at 0). For levers use State Puzzle + Multi-Position Lever."),
  m_wheels_h: L("Clica ▲ o ▼ a sobre o a sota de cada rodet.", "Haz clic en ▲ o ▼ encima o debajo de cada rodillo.", "Click ▲ or ▼ above or below each wheel."),

  m_pipe: L("Canonades", "Tuberías", "Pipes"),
  m_pipe_d: L("Una graella de peces que giren 90°. Es resol quan hi ha un camí continu d'obertures des de l'origen fins al destí (es comprova de veritat, no pel dibuix).",
    "Una cuadrícula de piezas que giran 90°. Se resuelve cuando hay un camino continuo de aberturas desde el origen hasta el destino (se comprueba de verdad, no por el dibujo).",
    "A grid of pieces that rotate 90°. It solves when a continuous path of openings links source to sink (real connectivity, not the drawing)."),
  m_pipe_w: L("Defineix cada tile (id, fila, columna, obertures, gir inicial) i els IDs d'origen i destí. Cada peça porta un PipeTileButton que crida Rotate.",
    "Define cada tile (id, fila, columna, aberturas, giro inicial) y los IDs de origen y destino. Cada pieza lleva un PipeTileButton que llama a Rotate.",
    "Define each tile (id, row, column, openings, starting rotation) and the source and sink IDs. Each piece carries a PipeTileButton that calls Rotate."),
  m_pipe_h: L("Clica les peces per girar-les fins connectar el verd amb el vermell.", "Haz clic en las piezas para girarlas hasta conectar el verde con el rojo.", "Click pieces to rotate them until green connects to red."),

  m_slide: L("Trencaclosques lliscant", "Rompecabezas deslizante", "Sliding puzzle"),
  m_slide_d: L("Una graella amb un forat. Només es pot moure una fitxa veïna del forat. Es barreja fent moviments legals des de la solució, així sempre té solució.",
    "Una cuadrícula con un hueco. Solo se puede mover una ficha vecina del hueco. Se mezcla haciendo movimientos legales desde la solución, así que siempre tiene solución.",
    "A grid with one hole. Only a tile next to the hole can move. It shuffles with legal moves from the solution, so it is always solvable."),
  m_slide_w: L("Tria Columns, Rows i Hole Cell. SlidingBoardView genera les fitxes i les imatges; cada fitxa porta un SlidingTileButton.",
    "Elige Columns, Rows y Hole Cell. SlidingBoardView genera las fichas y las imágenes; cada ficha lleva un SlidingTileButton.",
    "Choose Columns, Rows and Hole Cell. SlidingBoardView builds the tiles and images; each tile carries a SlidingTileButton."),
  m_slide_h: L("Clica una fitxa que toqui el forat per moure-la. Ordena 1–8.", "Haz clic en una ficha que toque el hueco para moverla. Ordena 1–8.", "Click a tile touching the hole to move it. Order 1–8."),

  m_lights: L("Circuit de llums", "Circuito de luces", "Linked lights"),
  m_lights_d: L("Cada botó commuta la seva llum i les connectades. Guarda el progrés parcial i té botó de reinici. És la sala 14 i té un prefab llest: LinkedLightsPuzzleKit.",
    "Cada botón conmuta su luz y las conectadas. Guarda el progreso parcial y tiene botón de reinicio. Es la sala 14 y tiene un prefab listo: LinkedLightsPuzzleKit.",
    "Each button toggles its light and the connected ones. Saves partial progress and has a reset button. It is room 14 with a ready prefab: LinkedLightsPuzzleKit."),
  m_lights_w: L("Llista Nodes: Initially On, Target On, Connections (índexs) i Indicator. Cada botó és un LinkedLightButton amb el seu índex.",
    "Lista Nodes: Initially On, Target On, Connections (índices) e Indicator. Cada botón es un LinkedLightButton con su índice.",
    "Nodes list: Initially On, Target On, Connections (indices) and Indicator. Each button is a LinkedLightButton with its index."),
  m_lights_h: L("Encén les cinc llums. Cada botó commuta la seva i les veïnes.", "Enciende las cinco luces. Cada botón conmuta la suya y las vecinas.", "Turn all five lights on. Each button toggles itself and its neighbours."),

  m_throw: L("Llançament", "Lanzamiento", "Throw"),
  m_throw_d: L("S'han d'encertar totes les dianes amb objectes físics llançats. Un cop suau no compta: cal superar la velocitat mínima d'impacte.",

    "Hit every target with thrown physics objects. A gentle bump does not count: impact must exceed the minimum speed."),
  m_throw_w: L("Afegeix ThrowTarget amb el seu ID a cada diana i llista'ls a Target Ids. Els objectes necessiten PhysicsGrabbable + Rigidbody. A PC: E per agafar, clic esquerre per llançar, Q per deixar.",

    "Add a ThrowTarget with its ID to each target and list them in Target Ids. Objects need PhysicsGrabbable + Rigidbody. On PC: E to grab, left click to throw, Q to drop."),
  m_throw_h: L("Clica a l'escena per llançar una pilota cap on apuntes.", "Haz clic en la escena para lanzar una pelota hacia donde apuntas.", "Click in the scene to throw a ball where you aim."),

  m_place: L("Col·locació", "Colocación", "Placement"),
  m_place_d: L("Cada peça ha d'acabar al seu sòcol, en qualsevol ordre. Un sòcol només aguanta una peça; l'imant ajuda a encaixar-la quan la deixes anar.",
    "Cada pieza debe acabar en su zócalo, en cualquier orden. Un zócalo solo aguanta una pieza; el imán ayuda a encajarla al soltarla.",
    "Each piece must end in its socket, in any order. A socket holds one piece; the magnet helps it seat when released."),
  m_place_w: L("Regles pieceId → correctSocketId. Peces amb GrabbablePiece, sòcols amb PieceSocketReceiver enllaçats al mateix puzle. Les peces soltes tornen a lloc en carregar si el puzle no està resolt.",
    "Reglas pieceId → correctSocketId. Piezas con GrabbablePiece, zócalos con PieceSocketReceiver enlazados al mismo puzle. Las piezas sueltas vuelven a su sitio al cargar si el puzle no está resuelto.",
    "Rules pieceId → correctSocketId. Pieces with GrabbablePiece, sockets with PieceSocketReceiver linked to the same puzzle. Loose pieces return home on load if the puzzle is unsolved."),
  m_place_h: L("Arrossega cada peça fins al sòcol del mateix color.", "Arrastra cada pieza hasta el zócalo del mismo color.", "Drag each piece onto the socket of its colour."),

  m_multi: L("Puzles encadenats", "Puzles encadenados", "Chained puzzles"),
  m_multi_d: L("Coordina diversos puzles visibles alhora. En ordre obligatori, els següents es veuen però no responen fins al seu torn. La porta escolta només l'OnSolved del grup.",
    "Coordina varios puzles visibles a la vez. En orden obligatorio, los siguientes se ven pero no responden hasta su turno. La puerta escucha solo el OnSolved del grupo.",
    "Coordinates several visible puzzles. In ordered mode the next ones are visible but locked until their turn. The door listens only to the group's OnSolved."),
  m_multi_w: L("Afegeix una entrada ChainedPuzzle per puzle fill (puzle + arrel d'interacció). Require Order i Lock Future Puzzles controlen l'ordre.",
    "Añade una entrada ChainedPuzzle por puzle hijo (puzle + raíz de interacción). Require Order y Lock Future Puzzles controlan el orden.",
    "Add one ChainedPuzzle entry per child (puzzle + interaction root). Require Order and Lock Future Puzzles control ordering."),
  m_multi_h: L("Resol la seqüència (esquerra) i després les palanques (dreta).", "Resuelve la secuencia (izquierda) y después las palancas (derecha).", "Solve the sequence (left), then the levers (right)."),

  /* Menus */
  menu_eyebrow: L("Expedient 02 · Taller", "Expediente 02 · Taller", "File 02 · Workshop"),
  menu_title: L("Taller de menús", "Taller de menús", "Menu workshop"),
  menu_lead: L("Els menús són de UI Toolkit (sense Canvas). Un sol asset, MenuThemeSettings, canvia colors, tipografies, logo, títol i crèdits. Juga amb els camps i navega per les pantalles.",
    "Los menús son de UI Toolkit (sin Canvas). Un solo asset, MenuThemeSettings, cambia colores, tipografías, logo, título y créditos. Juega con los campos y navega por las pantallas.",
    "Menus use UI Toolkit (no Canvas). One asset, MenuThemeSettings, changes colours, fonts, logo, title and credits. Play with the fields and navigate the screens."),
  menu_steps_t: L("Crear el menú del joc", "Crear el menú del juego", "Create the game menu"),
  menu_s1: L("Executa Setup > Create or Update Main Menu Scene. Genera MainMenu.unity amb MainMenuUI (UIDocument + UIToolkitMenuController) i la posa a Build Profiles, després d'Intro si existeix.",
    "Ejecuta Setup > Create or Update Main Menu Scene. Genera MainMenu.unity con MainMenuUI (UIDocument + UIToolkitMenuController) y la pone en Build Profiles, después de Intro si existe.",
    "Run Setup > Create or Update Main Menu Scene. It builds MainMenu.unity with MainMenuUI (UIDocument + UIToolkitMenuController) and adds it to Build Profiles, after Intro if present."),
  menu_s2: L("Obre Resources/GameFlowSettings.asset: First Gameplay Scene és on va Nova partida; Main Menu Scene és on torna el menú de pausa. Continue Slot buit = l'última partida.",
    "Abre Resources/GameFlowSettings.asset: First Gameplay Scene es adonde va Nueva partida; Main Menu Scene es adonde vuelve el menú de pausa. Continue Slot vacío = la última partida.",
    "Open Resources/GameFlowSettings.asset: First Gameplay Scene is where New Game goes; Main Menu Scene is where the pause menu returns. Empty Continue Slot = latest save."),
  menu_s3: L("Crea el tema: al Project, Create > Escape Room Framework > Menu Theme Settings.", "Crea el tema: en Project, Create > Escape Room Framework > Menu Theme Settings.", "Create the theme: in Project, Create > Escape Room Framework > Menu Theme Settings."),
  menu_s4: L("Arrossega l'asset al camp Theme de MainMenuUI (menú principal) i de MenuUI dins del GameManager (menú de pausa de cada escena jugable).",
    "Arrastra el asset al campo Theme de MainMenuUI (menú principal) y de MenuUI dentro del GameManager (menú de pausa de cada escena jugable).",
    "Drag the asset into the Theme field of MainMenuUI (main menu) and of MenuUI inside the GameManager (pause menu in each gameplay scene)."),
  menu_s5: L("Els textos es tradueixen a Resources/DefaultLocalizationCatalog.asset: la clau és el text castellà original. Afegeix una fila amb el codi d'idioma i apareixerà al selector d'Ajustos.",
    "Los textos se traducen en Resources/DefaultLocalizationCatalog.asset: la clave es el texto castellano original. Añade una fila con el código de idioma y aparecerá en el selector de Ajustes.",
    "Texts are translated in Resources/DefaultLocalizationCatalog.asset: the key is the original Spanish text. Add a row with a language code and it appears in the Settings selector."),
  menu_screen: L("Pantalla", "Pantalla", "Screen"),
  menu_hc: L("Mode d'alt contrast (Ajustos del jugador)", "Modo de alto contraste (Ajustes del jugador)", "High contrast mode (player Settings)"),
  menu_hc_note: L("L'alt contrast sempre guanya al tema: l'accessibilitat no depèn de la personalització.", "El alto contraste siempre gana al tema: la accesibilidad no depende de la personalización.", "High contrast always overrides the theme: accessibility never depends on branding."),
  menu_uss_t: L("Alternativa: editar el full d'estils", "Alternativa: editar la hoja de estilos", "Alternative: edit the stylesheet"),
  menu_uss_d: L("Si prefereixes no fer servir l'asset, EscapeRoomMenu.uss té les variables de color al principi. Aquest bloc reflecteix els colors triats:",
    "Si prefieres no usar el asset, EscapeRoomMenu.uss tiene las variables de color al principio. Este bloque refleja los colores elegidos:",
    "If you prefer not to use the asset, EscapeRoomMenu.uss holds colour variables at the top. This block mirrors the colours you picked:"),
  menu_btn_t: L("Botons amb imatges", "Botones con imágenes", "Image buttons"),
  menu_btn_d: L("Obre EscapeRoomMenu.uss amb UI Builder i assigna Background > Image a .menu-button, .menu-button:hover, :active i :disabled. No dibuixis el text dins la imatge: així es pot traduir.",
    "Abre EscapeRoomMenu.uss con UI Builder y asigna Background > Image a .menu-button, .menu-button:hover, :active y :disabled. No dibujes el texto dentro de la imagen: así se puede traducir.",
    "Open EscapeRoomMenu.uss in UI Builder and set Background > Image on .menu-button, .menu-button:hover, :active and :disabled. Keep text out of the image so it can be translated."),

  /* Player */
  pl_eyebrow: L("Expedient 03 · Jugador", "Expediente 03 · Jugador", "File 03 · Player"),
  pl_title: L("El jugador de PC i el de VR", "El jugador de PC y el de VR", "The PC and VR players"),
  pl_lead: L("Hi ha d'haver un sol jugador actiu per escena. Tots dos s'enregistren a PlayerPlatformRegistry i comparteixen puzles, inventari i guardat.",
    "Debe haber un solo jugador activo por escena. Ambos se registran en PlayerPlatformRegistry y comparten puzles, inventario y guardado.",
    "Keep a single active player per scene. Both register with PlayerPlatformRegistry and share puzzles, inventory and saving."),
  pl_pc_t: L("Jugador PC", "Jugador PC", "PC player"),
  pl_pc_demo: L("Clica l'escena i mou-te amb WASD. Arrossega per mirar (o clica per bloquejar el ratolí). Apunta a un objecte i prem E.",
    "Haz clic en la escena y muévete con WASD. Arrastra para mirar (o haz clic para bloquear el ratón). Apunta a un objeto y pulsa E.",
    "Click the scene and move with WASD. Drag to look (or click to lock the mouse). Aim at an object and press E."),
  pl_pc_s1: L("Setup > Instantiate PC Player col·loca Prefabs/Player_PC.prefab. Si ja n'hi ha un, el selecciona.", "Setup > Instantiate PC Player coloca Prefabs/Player_PC.prefab. Si ya hay uno, lo selecciona.", "Setup > Instantiate PC Player places Prefabs/Player_PC.prefab. If one exists it selects it."),
  pl_pc_s2: L("Setup > Instantiate Game Manager afegeix els serveis: guardat, inventari, pistes, HUD (GameplayUI) i menú de pausa (MenuUI).", "Setup > Instantiate Game Manager añade los servicios: guardado, inventario, pistas, HUD (GameplayUI) y menú de pausa (MenuUI).", "Setup > Instantiate Game Manager adds the services: save, inventory, hints, HUD (GameplayUI) and pause menu (MenuUI)."),
  pl_pc_s3: L("Posa terra amb collider i límits físics. La capa Interactable l'assignen els interactuables sols.", "Pon suelo con collider y límites físicos. La capa Interactable la asignan los interactuables solos.", "Add a floor with a collider and physical bounds. Interactables assign the Interactable layer themselves."),
  pl_comp: L("Components", "Componentes", "Components"),
  pl_keys: L("Controls per defecte (reassignables a Ajustos > Controls)", "Controles por defecto (reasignables en Ajustes > Controles)", "Default controls (rebindable in Settings > Controls)"),
  k_move: L("moure's", "moverse", "move"), k_look: L("mirar", "mirar", "look"), k_run: L("córrer", "correr", "sprint"), k_crouch: L("ajupir-se", "agacharse", "crouch"),

  k_qs: L("guardat / càrrega ràpida", "guardado / carga rápida", "quick save / load"), k_slots: L("accés ràpid", "acceso rápido", "quick slots"),
  pl_vr_t: L("Jugador VR", "Jugador VR", "VR player"),
  pl_vr_demo: L("Rig de VR: arrossega per girar el punt de vista. Canvia els ajustos de confort i mira'n l'efecte.", "Rig de VR: arrastra para girar el punto de vista. Cambia los ajustes de confort y mira su efecto.", "VR rig: drag to orbit. Change the comfort settings and watch the effect."),
  pl_vr_s1: L("Deixa que Package Manager importi OpenXR, XR Plug-in Management i XR Interaction Toolkit (i les Starter Assets de XRI 3.3.0).", "Deja que Package Manager importe OpenXR, XR Plug-in Management y XR Interaction Toolkit (y las Starter Assets de XRI 3.3.0).", "Let Package Manager import OpenXR, XR Plug-in Management and XR Interaction Toolkit (plus the XRI 3.3.0 Starter Assets)."),
  pl_vr_s2: L("Setup > Configure OpenXR (PC + Android) i revisa Project Validation.", "Setup > Configure OpenXR (PC + Android) y revisa Project Validation.", "Setup > Configure OpenXR (PC + Android) and check Project Validation."),
  pl_vr_s3: L("Setup > Create or Update VR Player Prefab: parteix del rig oficial de XRI i hi afegeix adaptador, UI 3D, confort, equipament i sòcols de model a cada mà.", "Setup > Create or Update VR Player Prefab: parte del rig oficial de XRI y le añade adaptador, UI 3D, confort, equipamiento y zócalos de modelo en cada mano.", "Setup > Create or Update VR Player Prefab: starts from the official XRI rig and adds the adapter, 3D UI, comfort, equipment and model sockets on each hand."),
  pl_vr_s4: L("A cada escena: Setup > Prepare Current Scene Interactables for VR (afegeix XRSimpleInteractable / XRGrabInteractable + VRInteractionBridge).", "En cada escena: Setup > Prepare Current Scene Interactables for VR (añade XRSimpleInteractable / XRGrabInteractable + VRInteractionBridge).", "In every scene: Setup > Prepare Current Scene Interactables for VR (adds XRSimpleInteractable / XRGrabInteractable + VRInteractionBridge)."),
  pl_vr_s5: L("Per provar sense visor, activa el simulador de VRTemplate i desactiva'l abans de la build. La prova real al visor continua sent obligatòria.", "Para probar sin visor, activa el simulador de VRTemplate y desactívalo antes de la build. La prueba real en el visor sigue siendo obligatoria.", "To test without a headset, enable the VRTemplate simulator and disable it before building. A real headset test is still required."),
  pl_comfort: L("VRComfortSettings (Resources)", "VRComfortSettings (Resources)", "VRComfortSettings (Resources)"),
  pl_vr_input: L("Gatell: activar i agafar · Grip: agafar objectes físics · Menú dret: pausa · Menú esquerre: inventari · Botó A/X: interactuar",
    "Gatillo: activar y agarrar · Grip: agarrar objetos físicos · Menú derecho: pausa · Menú izquierdo: inventario · Botón A/X: interactuar",
    "Trigger: activate and grab · Grip: grab physics objects · Right menu: pause · Left menu: inventory · A/X button: interact"),
  pl_vr_note: L("En VR la plantilla no talla la càmera en resoldre un puzle i els rodets numèrics fan servir botons ▲/▼ físics. Qualsevol cinemàtica pròpia ha de fer el mateix.",
    "En VR la plantilla no corta la cámara al resolver un puzle y los rodillos numéricos usan botones ▲/▼ físicos. Cualquier cinemática propia debe hacer lo mismo.",
    "In VR the template never cuts the camera on solve, and number wheels use physical ▲/▼ buttons. Any custom cinematic should do the same."),

  /* Features */
  ft_eyebrow: L("Expedient 04 · Funcions", "Expediente 04 · Funciones", "File 04 · Features"),
  ft_title: L("Tot el que et dona la plantilla", "Todo lo que te da la plantilla", "Everything the template gives you"),
  ft_lead: L("Sistemes compartits per PC i VR. Els que tenen demo es poden provar aquí mateix.", "Sistemas compartidos por PC y VR. Los que tienen demo se pueden probar aquí mismo.", "Systems shared by PC and VR. Those with a demo can be tried right here."),
  ft_inv_t: L("Inventari i examen 3D", "Inventario y examen 3D", "Inventory and 3D examine"),
  ft_inv_d: L("Quantitats, barra d'accés ràpid, combinacions guiades i examen 3D. Un ExamineHotspot sobre el model revela pistes o dona objectes. Arrossega l'objecte per girar-lo i clica els punts.",
    "Cantidades, barra de acceso rápido, combinaciones guiadas y examen 3D. Un ExamineHotspot sobre el modelo revela pistas o da objetos. Arrastra el objeto para girarlo y haz clic en los puntos.",
    "Quantities, quick-access bar, guided combining and 3D examine. An ExamineHotspot on the model reveals clues or grants items. Drag the object to rotate it and click the spots."),
  ft_inv_w: L("Crea un InventoryItemData (ID, nom, icona, World Prefab, Can Examine) i afegeix-lo a l'ItemCatalog. PickableItem el posa al món.",
    "Crea un InventoryItemData (ID, nombre, icono, World Prefab, Can Examine) y añádelo al ItemCatalog. PickableItem lo pone en el mundo.",
    "Create an InventoryItemData (ID, name, icon, World Prefab, Can Examine) and add it to the ItemCatalog. PickableItem places it in the world."),
  ft_combine: L("Combina", "Combinar", "Combine"),
  ft_save_t: L("Guardar i carregar", "Guardar y cargar", "Save and load"),
  ft_save_d: L("Tres ranures manuals i una ràpida (F5/F9), amb miniatura. Escriptura atòmica amb còpia .bak. Prova-ho: canvia l'estat, guarda, desordena-ho i carrega.",
    "Tres ranuras manuales y una rápida (F5/F9), con miniatura. Escritura atómica con copia .bak. Pruébalo: cambia el estado, guarda, desordénalo y carga.",
    "Three manual slots plus a quick slot (F5/F9), with thumbnails. Atomic writes with a .bak copy. Try it: change state, save, mess it up, load."),
  ft_save_rule: L("Regla d'or: cada objecte persistent necessita un SaveId únic. Si dupliques un objecte o una PuzzleDefinition, canvia l'ID. OnSolved no es torna a disparar en carregar: la porta es restaura amb el seu propi guardat.",
    "Regla de oro: cada objeto persistente necesita un SaveId único. Si duplicas un objeto o una PuzzleDefinition, cambia el ID. OnSolved no se vuelve a disparar al cargar: la puerta se restaura con su propio guardado.",
    "Golden rule: each persistent object needs a unique SaveId. If you duplicate an object or a PuzzleDefinition, change the ID. OnSolved does not fire again on load: the door restores through its own save."),
  ft_save_btn: L("Guarda a la ranura 1", "Guarda en la ranura 1", "Save to slot 1"),
  ft_load_btn: L("Carrega la ranura 1", "Carga la ranura 1", "Load slot 1"),
  ft_scramble: L("Desordena", "Desordenar", "Scramble"),
  ft_empty: L("buida", "vacía", "empty"),
  ft_hint_t: L("Pistes progressives", "Pistas progresivas", "Progressive hints"),
  ft_hint_d: L("Cada PuzzleDefinition apunta a un HintData amb pistes graduades i temps d'espera. Apareixen soles o amb H. Una HintZoneTrigger canvia de context quan entres a una zona.",
    "Cada PuzzleDefinition apunta a un HintData con pistas graduadas y tiempos de espera. Aparecen solas o con H. Una HintZoneTrigger cambia de contexto al entrar en una zona.",
    "Each PuzzleDefinition points to a HintData with graded hints and delays. They appear by themselves or with H. A HintZoneTrigger switches context when you enter an area."),
  ft_hint_btn: L("Demana pista (H)", "Pedir pista (H)", "Ask for a hint (H)"),
  ft_hints: [
    L("Context: la nota de la paret té quatre números ratllats.", "Contexto: la nota de la pared tiene cuatro números tachados.", "Context: the note on the wall has four crossed-out numbers."),
    L("Indicació: llegeix-los d'esquerra a dreta, començant pel més petit.", "Indicación: léelos de izquierda a derecha, empezando por el más pequeño.", "Nudge: read them left to right, starting with the smallest."),
    L("Solució: el codi és 3142.", "Solución: el código es 3142.", "Solution: the code is 3142.")],
  ft_nohints: L("No queden més pistes.", "No quedan más pistas.", "No more hints."),
  ft_obj_t: L("Objectius i finals", "Objetivos y finales", "Objectives and endings"),
  ft_obj_d: L("ObjectiveSet + ObjectiveManager encadenen objectius amb prerequisits. GameEndTrigger i EndingDefinition mostren Victòria o Derrota amb Reintentar, Menú i Sortir.",
    "ObjectiveSet + ObjectiveManager encadenan objetivos con prerrequisitos. GameEndTrigger y EndingDefinition muestran Victoria o Derrota con Reintentar, Menú y Salir.",
    "ObjectiveSet + ObjectiveManager chain objectives with prerequisites. GameEndTrigger and EndingDefinition show Victory or Defeat with Retry, Menu and Quit."),
  ft_haz_t: L("Perill mòbil i temporitzador", "Peligro móvil y temporizador", "Moving hazard and timer"),
  ft_haz_d: L("MovingHazard mou un sostre, paret o terra entre marcadors 3D. GameOverTimer és un compte enrere al HUD. Són independents i s'activen amb un botó o una EventTriggerZone.",
    "MovingHazard mueve un techo, pared o suelo entre marcadores 3D. GameOverTimer es una cuenta atrás en el HUD. Son independientes y se activan con un botón o una EventTriggerZone.",
    "MovingHazard moves a ceiling, wall or floor between 3D markers. GameOverTimer is a HUD countdown. They are independent and start from a button or an EventTriggerZone."),
  ft_haz_btn: L("Inicia (StartTimer + StartHazard)", "Iniciar (StartTimer + StartHazard)", "Start (StartTimer + StartHazard)"),
  ft_haz_stop: L("Atura (resol a temps)", "Detener (resuelto a tiempo)", "Stop (solved in time)"),
  ft_gameover: L("Game Over", "Game Over", "Game Over"),
  ft_genre_t: L("Perfils de gènere", "Perfiles de género", "Genre profiles"),
  ft_genre_d: L("EscapeRoom/Unity només instal·la Common; Survival/Unity afegeix el paquet Survival. El perfil configura les funcions disponibles i SceneFeatureOverride les ajusta per escena. La llanterna és compartida.",
    "EscapeRoom/Unity solo instala Common; Survival/Unity añade Survival. El perfil configura funciones instaladas y SceneFeatureOverride las ajusta por escena. La linterna es compartida.",
    "EscapeRoom/Unity installs Common only; Survival/Unity also installs Survival. Profiles configure installed features and SceneFeatureOverride adjusts them per scene. The flashlight is shared."),
  ft_nav_t: L("Canvi de sala", "Cambio de sala", "Changing rooms"),
  ft_nav_d: L("RoomPortal porta a una altra escena i a un RoomSpawnPoint amb ID. En mode Single l'estat viatja en una instantània; en Additive les escenes conviuen.",
    "RoomPortal lleva a otra escena y a un RoomSpawnPoint con ID. En modo Single el estado viaja en una instantánea; en Additive las escenas conviven.",
    "RoomPortal loads another scene and a RoomSpawnPoint by ID. In Single mode state travels in a snapshot; in Additive the scenes coexist."),
  ft_val_t: L("Eines de validació", "Herramientas de validación", "Validation tools"),
  ft_val_d: L("Abans de provar o entregar: Run Framework Smoke Tests, Validate Current Scene i Validate Save IDs. Llegeix el resultat a la Console.",
    "Antes de probar o entregar: Run Framework Smoke Tests, Validate Current Scene y Validate Save IDs. Lee el resultado en la Console.",
    "Before testing or delivering: Run Framework Smoke Tests, Validate Current Scene and Validate Save IDs. Read the result in the Console."),
  ft_menu_t: L("El menú Escape Room Framework", "El menú Escape Room Framework", "The Escape Room Framework menu"),
  ft_menu_d: L("Clica una opció per saber què fa.", "Haz clic en una opción para saber qué hace.", "Click an entry to see what it does."),

Unity que has de conèixer", "keys_t": "Dreceres que faràs servir sempre", "faq_t": "Problemes freqüents", "next_t": "I ara què?", "next": "Ja tens una sala que funciona. A partir d'aquí: mira el **Laboratori de mecàniques** per triar més puzles, segueix les **Receptes pas a pas** per afegir-los i el **Taller de menús** per canviar l'aspecte del menú.", "phases": [{"id": "A", "title": "Prepara l'ordinador", "goal": "Tenir Unity Hub i la versió exacta de Unity instal·lades. Ho fas una sola vegada per ordinador.", "steps": [{"id": "a1", "title": "Comprova que l'ordinador és adequat", "do": ["Windows 10 o 11 de 64 bits.", "Mínim 8 GB de memòria RAM (16 GB va molt millor).", "Uns 25 GB lliures al disc: Unity ocupa uns 10 GB i el projecte uns 5 GB quan s'ha obert.", "Connexió a internet per descarregar Unity.", "Un ratolí amb roda: Unity es fa servir molt millor amb ratolí que amb el ratolí tàctil del portàtil."], "see": "Per saber la memòria i el disc: [[Win]] + [[E]], clic a `Aquest equip`. Hi veuràs l'espai lliure de cada disc.", "fix": ["Si tens poc espai, esborra la Paperera i les descàrregues antigues abans de començar."]}, {"id": "a2", "title": "Instal·la Unity Hub", "do": ["Obre el navegador i ves a `unity.com/download`.", "Clica el botó de descàrrega per a Windows. Es baixa un fitxer `UnityHubSetup.exe`.", "Obre el fitxer descarregat. Si Windows pregunta si vols permetre canvis, clica `Sí`.", "Accepta la llicència i deixa la carpeta que proposa. Clica `Instal·la` i, quan acabi, `Finalitza`."], "see": "S'obre la finestra de **Unity Hub**. És el programa que gestiona les versions de Unity i els teus projectes. No és Unity: és la \"porta d'entrada\".", "fix": ["Si l'antivirus o l'ordinador del centre no et deixa instal·lar, demana-ho al professor o a l'administrador."]}, {"id": "a3", "title": "Inicia sessió i activa la llicència gratuïta", "do": ["A Unity Hub, clica `Sign in` i entra amb el teu compte de Unity. Si no en tens, clica `Create account` i fes-te'n un amb el teu correu (és gratuït).", "Quan el Hub demani una llicència, tria la **Personal** (gratuïta).", "Si no t'ho demana: icona d'engranatge `Preferences` > `Licenses` > `Add` > `Get a free personal license`."], "see": "A dalt a l'esquerra del Hub hi ha la teva inicial o foto. A `Preferences` > `Licenses` hi ha una llicència **Personal** activa.", "fix": ["Si el correu de confirmació no arriba, mira la carpeta de correu brossa.", "Sense llicència activa, Unity no obre cap projecte."]}, {"id": "a4", "title": "Instal·la Unity 6000.4.9f1 (aquesta versió exacta)", "do": ["La versió ha de ser **exactament** `6000.4.9f1`. Amb una altra, el projecte es pot trencar.", "Al Hub, ves a `Installs` > `Install Editor`.", "Si la versió `6000.4.9f1` surt a la llista, clica `Install` al seu costat.", "Si no hi surt, ves a la pestanya `Archive` > `download archive`. S'obre una web: cerca `6000.4.9f1` i clica `Install`. El Hub s'obrirà sol amb aquesta versió.", "A la llista de mòduls, marca **Microsoft Visual Studio Community** si no el tens (serveix per veure el codi). Marca **Android Build Support** només si faràs VR per a Meta Quest.", "Clica `Install` i espera. Són uns 10 GB i pot trigar de 20 minuts a 1 hora."], "see": "A `Installs` apareix `Unity 6000.4.9f1` sense cap barra de progrés.", "fix": ["Si la descàrrega s'atura, clica la icona de pausa/continua o torna-ho a provar.", "També hi ha una drecera: si en el pas B4 afegeixes el projecte i encara no tens la versió, el Hub mostra un botó per instal·lar-la directament."], "tip": "Pots continuar amb la fase B mentre s'instal·la."}]}, {"id": "B", "title": "Aconsegueix el projecte i obre'l", "goal": "Tenir el projecte Escape Room a l'ordinador i obert a Unity.", "steps": [{"id": "b1", "title": "Descarrega el projecte", "do": ["Ves a la pàgina de GitHub del projecte que t'ha passat el professor.", "A la dreta, a `Releases`, clica la versió més nova (`Escape Room Revolt 0.2.0` o posterior).", "A baix, a `Assets`, descarrega **`EscapeRoom-0.2.0-pcfix-2026-10-26-delivery.zip`** (el projecte Unity).", "Si vols jugar la demo sense Unity, baixa també el ZIP `...-windows.zip`."], "see": "A la carpeta `Baixades` tens un fitxer ZIP d'uns 10 MB.", "fix": ["No descarreguis `Source code (zip)`: és tot el repositori i és més difícil d'obrir. Fes servir el ZIP `delivery`."]}, {"id": "b2", "title": "Descomprimeix-lo en una carpeta curta", "do": ["Crea una carpeta curta, per exemple `C:\\Unity`.", "Clic dret al ZIP > `Extreu-ho tot...` > `Navega` > tria `C:\\Unity` > `Extreu`.", "Entra a la carpeta extreta. Hi veuràs `Project`, `docs`, `README.md` i `FILES.sha256.json`.", "Canvia el nom de la carpeta `Project` pel nom del teu joc, sense accents ni espais. Per exemple `EscapeRoom_JoanGarcia`."], "see": "Dins de la carpeta del teu joc hi ha les carpetes `Assets`, `Packages` i `ProjectSettings`. Això vol dir que és una carpeta de projecte Unity.", "fix": ["No treballis mai des de dins del ZIP (fent doble clic al ZIP sense extreure'l).", "Evita l'Escriptori si està sincronitzat amb OneDrive: el projecte va lent i pot donar errors.", "Evita rutes llargues o amb accents (`C:\\Users\\Núria\\Documents\\...`)."]}, {"id": "b3", "title": "Afegeix el projecte a Unity Hub", "do": ["Al Hub, ves a `Projects`.", "Clica la fletxa del botó `Add` > `Add project from disk`.", "Selecciona la carpeta del teu joc (la que conté `Assets`, `Packages` i `ProjectSettings`) i clica `Seleccionar carpeta`."], "see": "El projecte apareix a la llista amb la versió `6000.4.9f1` al costat.", "fix": ["Si surt un avís groc de versió que falta, clica'l i instal·la la `6000.4.9f1` (pas A4).", "Si el Hub diu que la carpeta no és un projecte vàlid, has seleccionat una carpeta de més amunt o de més avall. Ha de ser la que conté `Assets`."]}, {"id": "b4", "title": "Obre'l per primera vegada (i espera)", "do": ["Clica el nom del projecte a la llista.", "La primera vegada Unity importa tot el projecte. Pot trigar **de 10 a 20 minuts**. No tanquis la finestra encara que sembli aturada.", "Si Unity pregunta per canviar de versió (`Change Editor version` o `Upgrade`), **no acceptis**: tanca i obre'l amb la `6000.4.9f1`."], "see": "S'obre l'editor de Unity amb diverses finestres. A dalt hi ha el menú `File  Edit  Assets  GameObject  Component  Escape Room Framework  ...`. Si veus `Escape Room Framework`, el projecte s'ha carregat bé.", "fix": ["Si surt el diàleg **Safe Mode**: hi ha errors de codi. Clica `Enter Safe Mode`, mira la finestra `Console` i avisa el professor amb una captura.", "Si no veus el menú `Escape Room Framework`, espera que acabi la barra de progrés de baix a la dreta.", "La propera vegada que obris el projecte trigarà menys d'un minut."]}]}, {"id": "C", "title": "Coneix l'editor de Unity", "goal": "Saber què és cada finestra i moure't per l'escena sense perdre't.", "steps": [{"id": "c1", "title": "Les sis finestres que faràs servir", "do": ["Fes servir la maqueta interactiva de sota: clica cada zona per saber què fa.", "Busca les mateixes zones al teu Unity."], "see": "Identifiques **Hierarchy** (la llista del que hi ha a l'escena), **Scene** (on construeixes), **Game** (el que veu el jugador), **Inspector** (les propietats de l'objecte seleccionat), **Project** (els fitxers) i **Console** (missatges i errors).", "fix": ["Si has tancat o mogut finestres sense voler: `Window` > `Layouts` > `Default`. Torna tot al seu lloc."], "editor": true}, {"id": "c2", "title": "Moure't per la vista Scene", "do": ["Posa el ratolí sobre la vista **Scene**.", "Mantén premut el **botó dret** del ratolí i fes servir [[W]] [[A]] [[S]] [[D]] per volar com en un videojoc. [[Q]] i [[E]] baixen i pugen.", "La **roda** apropa i allunya. Clicant la roda i arrossegant desplaces la vista.", "[[Alt]] + botó esquerre i arrossegar: gira al voltant del que mires.", "Fes doble clic a un objecte de la **Hierarchy** (o selecciona'l i prem [[F]]) per centrar-lo a la vista."], "see": "Pots apropar-te a qualsevol lloc i tornar a trobar un objecte amb [[F]].", "fix": ["Si et perds del tot: selecciona un objecte a la Hierarchy i prem [[F]]."]}, {"id": "c3", "title": "Seleccionar, moure, girar i escalar objectes", "do": ["Clica un objecte a la Scene o a la Hierarchy per seleccionar-lo.", "Eines (també a la barra de l'esquerra de la Scene): [[W]] moure, [[E]] girar, [[R]] escalar. Arrossega les fletxes de colors: vermella = X, verda = Y (amunt), blava = Z.", "Per posar valors exactes, escriu-los a l'**Inspector** > `Transform` > `Position`, `Rotation` i `Scale`.", "Ho has fet malament? [[Ctrl]] + [[Z]] desfà."], "see": "Quan canvies un número del `Transform`, l'objecte es mou a la Scene.", "fix": ["Si les tecles W/E/R no fan res, primer clica dins la vista Scene perquè tingui el focus."]}]}, {"id": "D", "title": "Juga la demo del museu", "goal": "Veure com funciona un escape room fet amb la plantilla abans de fer el teu.", "steps": [{"id": "d1", "title": "Obre l'escena del museu", "do": ["Menú `Escape Room Framework` > `Demo` > `Open Showcase Museum`.", "Si pregunta si vols desar canvis de l'escena actual, clica `Don't Save`."], "see": "A la Hierarchy surt `ShowcaseMuseum` i a la Scene veus un passadís amb sales.", "fix": ["Si no surt el menú `Escape Room Framework`, torna al pas B4."]}, {"id": "d2", "title": "Prem Play i juga", "do": ["Clica el botó **▶ Play** de dalt al mig.", "Clica dins la vista **Game** perquè el joc capturi el ratolí.", "Mou-te amb [[W]] [[A]] [[S]] [[D]] i el ratolí. [[E]] per interactuar, [[I]] inventari, [[H]] pista, [[Esc]] tancar un panell o pausa.", "Per aturar el joc, torna a clicar **▶ Play**."], "see": "Mentre jugues, el botó Play queda blau i la finestra Game mostra el joc.", "fix": ["**Molt important:** tot el que canviïs a l'Inspector **mentre el Play està actiu es perd** en aturar-lo. Primer atura el Play, després edita.", "Si el ratolí no mou la càmera, clica dins la vista Game.", "Per recuperar el cursor durant el joc, prem [[Esc]]."]}, {"id": "d3", "title": "Resol el teclat i prova el guardat", "do": ["Camina fins a la **sala 2**. Apunta al teclat i prem [[E]]: s'obre un teclat a la pantalla.", "Busca la pista de la sala, escriu el codi i mira com s'obre la porta.", "Prem [[F5]] per desar, fes alguna cosa més i prem [[F9]] per carregar."], "see": "La llum del teclat es posa verda i la porta s'obre. En carregar, tot torna a com estava en desar.", "fix": ["Si et quedes encallat, prem [[H]] per demanar una pista."], "tip": "Cada sala del museu ensenya una mecànica diferent. A la secció **Visita** d'aquesta guia hi ha el mapa del museu."}]}, {"id": "E", "title": "Crea la teva sala", "goal": "Una habitació buida on el jugador pot caminar. És la base de tot el teu joc.", "steps": [{"id": "e1", "title": "Crea la teva carpeta", "do": ["Atura el Play si està actiu.", "A la finestra **Project**, clica `Assets`.", "Clic dret a l'espai buit de la dreta > `Create` > `Folder`. Posa-li el nom `ElMeuJoc` i prem [[Enter]].", "Entra a `ElMeuJoc` i crea-hi dues carpetes més: `Scenes` i `Materials`."], "see": "A `Assets` hi ha `_EscapeRoomTemplate` (la plantilla) i `ElMeuJoc` (el teu).", "fix": ["**No guardis mai res dins de `_EscapeRoomTemplate`** ni modifiquis les escenes del museu. Si vols canviar alguna cosa del museu, duplica l'escena a la teva carpeta."]}, {"id": "e2", "title": "Crea i desa una escena nova", "do": ["Menú `File` > `New Scene`.", "Tria la plantilla **`Basic (URP)`** i clica `Create`.", "Menú `File` > `Save As...`. Ves a `Assets/ElMeuJoc/Scenes`, posa el nom `Sala1` i desa.", "A partir d'ara, desa sovint amb [[Ctrl]] + [[S]]."], "see": "A la Hierarchy surt `Sala1` amb dos objectes: `Main Camera` i `Directional Light`. La Scene està buida, amb el cel de fons.", "fix": ["Si no veus `Basic (URP)`, tria la plantilla bàsica que surti (qualsevol que tingui càmera i llum).", "Si a la pestanya de l'escena hi ha un asterisc (`Sala1*`), vol dir que hi ha canvis sense desar."], "stage": "empty"}, {"id": "e3", "title": "Posa-hi un terra", "do": ["Menú `GameObject` > `3D Object` > `Plane`.", "Amb el `Plane` seleccionat, a l'**Inspector** > `Transform`: `Position` 0, 0, 0 i `Scale` 2, 1, 2.", "Canvia-li el nom: selecciona'l a la Hierarchy, prem [[F2]], escriu `Terra` i prem [[Enter]]."], "see": "Un terra gris quadrat de 20 × 20 metres (un `Plane` fa 10 m i l'has escalat × 2).", "fix": ["Si no el veus, fes doble clic a `Terra` a la Hierarchy per centrar-lo a la vista."], "stage": "floor"}, {"id": "e4", "title": "Aixeca les quatre parets", "do": ["Menú `GameObject` > `3D Object` > `Cube`. Anomena'l `Paret_Nord`.", "`Position` 0, 1.5, 10 · `Rotation` 0, 0, 0 · `Scale` 20, 3, 0.2.", "Amb la paret seleccionada, prem [[Ctrl]] + [[D]] per duplicar-la. Anomena-la `Paret_Sud` i posa `Position` 0, 1.5, -10.", "Duplica-la una altra vegada: `Paret_Est`, `Position` 10, 1.5, 0 i `Rotation` 0, 90, 0.", "I l'última: `Paret_Oest`, `Position` -10, 1.5, 0 i `Rotation` 0, 90, 0.", "Per endreçar: `GameObject` > `Create Empty`, anomena'l `Parets` i arrossega les quatre parets a sobre d'ell a la Hierarchy."], "see": "Una habitació tancada de 20 × 20 m amb parets de 3 m d'alt.", "fix": ["Si una paret queda enfonsada o flotant, revisa que `Position Y` sigui 1.5 (la meitat de l'alçada, 3).", "Si les parets queden en creu, revisa la `Rotation Y` de les parets est i oest (ha de ser 90)."], "stage": "walls"}, {"id": "e5", "title": "Dona color a les parets", "do": ["A **Project**, ves a `Assets/ElMeuJoc/Materials`. Clic dret > `Create` > `Material`. Anomena'l `MatParet`.", "Amb el material seleccionat, a l'Inspector clica el requadre de color al costat de `Base Map` i tria un color.", "Arrossega el material des de Project fins a cada paret a la vista Scene (o fins al seu nom a la Hierarchy).", "Fes un altre material `MatTerra` per al terra."], "see": "Les parets i el terra tenen els colors que has triat.", "fix": ["Si l'objecte es veu **rosa**, el material no és d'URP. Crea'l de nou amb `Create` > `Material` (Unity el fa amb el shader correcte, `Universal Render Pipeline/Lit`)."], "stage": "color"}, {"id": "e6", "title": "Afegeix el Game Manager", "do": ["Menú `Escape Room Framework` > `Setup` > `Instantiate Game Manager`."], "see": "A la Hierarchy apareix `GameManager`. Conté tots els sistemes del joc: guardar i carregar, inventari, pistes, la interfície (HUD) i el menú de pausa. Sense ell, res de la plantilla funciona.", "fix": ["Si el torna a seleccionar en lloc de crear-ne un altre, és que ja n'hi havia un: correcte, només n'hi ha d'haver un."], "stage": "manager"}, {"id": "e7", "title": "Afegeix el jugador", "do": ["Menú `Escape Room Framework` > `Setup` > `Instantiate PC Player`. Apareix `Player_PC`.", "Posa'l a `Position` 0, 0, -7 i `Rotation` 0, 0, 0. Així mira cap a la paret nord.", "**Esborra la càmera que venia amb l'escena**: a la Hierarchy, clica `Main Camera` (la que està sola, al primer nivell, **no** la que hi ha dins de `Player_PC`) i prem [[Supr]]. El jugador ja porta la seva càmera."], "see": "Un jugador a dins l'habitació. A la Hierarchy, si obres la fletxa de `Player_PC`, hi ha una `Main Camera` a dins.", "fix": ["Si a la Console surt `There are 2 audio listeners in the scene`, no has esborrat la càmera de l'escena.", "Si has esborrat la càmera del jugador sense voler: [[Ctrl]] + [[Z]]."], "stage": "player"}, {"id": "e8", "title": "Prova-ho", "do": ["Desa amb [[Ctrl]] + [[S]].", "Prem **▶ Play**, clica a la vista Game i camina per l'habitació.", "Atura el Play."], "see": "Camines per la teva sala, xoques amb les parets i veus el HUD de la plantilla.", "fix": ["**Caus al buit:** el terra no té col·lisió. Selecciona `Terra` i comprova que té el component `Mesh Collider`.", "**`No cameras rendering`:** no hi ha jugador o has esborrat la seva càmera.", "**No et pots moure:** clica dins la vista Game; si hi ha un panell obert, prem [[Esc]].", "**Comences dins d'una paret:** revisa la `Position` del jugador."], "stage": "player"}]}, {"id": "F", "title": "El primer puzle: un teclat que obre la porta", "goal": "El jugador troba una nota amb el codi, l'escriu al teclat i la porta s'obre.", "steps": [{"id": "f1", "title": "Posa una porta tancada amb clau", "do": ["Menú `Escape Room Framework` > `Create` > `Interactables` > `Door`. Apareix `NewDoor_Logic` al centre de la vista Scene.", "Canvia-li el nom a `PortaSortida`.", "`Position` 0, 1.25, 9.8 (davant de la paret nord, tocant a terra).", "A l'Inspector, al component `Door` > `Door Settings`, marca **`Is Locked`**."], "see": "Una porta taronja davant de la paret nord. Amb `Is Locked` marcat, el jugador no la pot obrir amb [[E]].", "fix": ["Crea sempre els objectes interactius des del menú `Escape Room Framework`. Un cub normal no reacciona a la tecla E.", "Si la porta queda dins de la paret, baixa una mica la `Position Z` (per exemple 9.6)."], "stage": "door"}, {"id": "f2", "title": "Posa un teclat al costat", "do": ["Menú `Escape Room Framework` > `Create` > `Puzzles` > `Keypad Panel`. Apareix `NewKeypad_Logic` amb 11 botons (1-9, C i 0) i una pantalla.", "Anomena'l `TeclatPorta`.", "`Position` 2, 1.4, 9.8.", "Posa `Rotation` 0, 180, 0. Els botons queden cap a dins de l'habitació, on és el jugador."], "see": "Un teclat a l'alçada dels ulls, a la dreta de la porta, amb els botons cap al jugador.", "fix": ["Mou només l'objecte principal (`TeclatPorta`), mai els botons un per un.", "Si des del jugador veus el darrere del teclat (sense botons), canvia `Rotation Y` a 0."], "stage": "keypad"}, {"id": "f3", "title": "Tria el codi", "do": ["Selecciona `TeclatPorta`. A l'Inspector, busca el component `Code Panel Puzzle`.", "A `Correct Code` escriu el codi que vulguis, per exemple `2580`.", "A `Max Code Length` posa el nombre de xifres del codi (4).", "Deixa marcat `Auto Check When Full`: es comprova sol quan s'escriu la quarta xifra."], "see": "`Correct Code` = `2580` i `Max Code Length` = `4`.", "fix": ["Si `Max Code Length` no coincideix amb les xifres del codi, el teclat no el comprovarà mai."], "stage": "keypad"}, {"id": "f4", "title": "Connecta el teclat amb la porta", "do": ["A la Hierarchy, clica `TeclatPorta`.", "Mantén [[Ctrl]] i clica `PortaSortida`. Ara tens els dos seleccionats.", "Menú `Escape Room Framework` > `Create` > `Puzzles` > `Link Selected Objects To Puzzle`."], "see": "Selecciona `TeclatPorta` i baixa a l'Inspector fins a l'esdeveniment `On Solved ()`. Hi ha dues línies amb `PortaSortida`: `Door.Unlock` (treu el pany) i `Door.ForceOpen` (obre la porta).", "fix": ["Si `On Solved ()` està buit, torna a seleccionar els dos objectes (el teclat **primer**) i repeteix el menú.", "No esborris aquestes línies: són la \"cablejada\" entre el puzle i la porta."], "stage": "link"}, {"id": "f5", "title": "Amaga la pista en una nota", "do": ["Menú `Escape Room Framework` > `Create` > `Interactables` > `Note`. Anomena-la `NotaCodi`.", "`Position` -6, 0.03, -2 (a terra, a l'esquerra del jugador).", "A l'Inspector, a `Note Content`, escriu la pista. Per exemple: `La combinació és la columna del mig del teclat, de dalt a baix.` (2-5-8-0)."], "see": "Un full blanc a terra.", "fix": ["Si la nota queda dins del terra, puja-la una mica (`Position Y` 0.05)."], "tip": "Una bona pista fa pensar però no dona la resposta directament.", "stage": "note"}, {"id": "f6", "title": "Juga el teu puzle", "do": ["Desa ([[Ctrl]] + [[S]]) i prem **▶ Play**.", "Ves a la nota, mira-la i prem [[E]] per llegir-la.", "Ves al teclat, prem [[E]] i escriu el codi.", "Prova també un codi incorrecte."], "see": "Amb el codi incorrecte, el llum vermell parpelleja i s'esborra. Amb el correcte, el llum es posa verd i la porta s'obre sola.", "fix": ["**La porta no s'obre:** revisa el pas F4 (`On Solved ()` amb dues línies).", "**El teclat no reacciona a E:** el jugador ha d'estar a prop i apuntant-hi. Si mai reacciona, l'has creat sense el menú de la plantilla.", "**La porta s'obre cap a dins de la paret:** gira-la 180° (`Rotation Y`)."], "stage": "solved"}, {"id": "f7", "title": "Don
